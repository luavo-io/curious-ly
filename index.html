    FACTS.push({d:key(d),t,c:CK[c],lead,body:[body],dyk:[a,b],src:[["Wikipedia — "+decodeURIComponent(w).replace(/_/g," ").replace(/ \(.*\)/,""),"https://en.wikipedia.org/wiki/"+w]]})})})();

/* Daily fact: exact date match, else a clearly labelled archive fallback */
function todaysFact(){
  const t=todayKey(),f=byId(t);if(f)return{f,mode:"daily"};
  const first=FACTS[0].d,last=FACTS[FACTS.length-1].d;
  if(t<first)return{f:FACTS[0],mode:"early"};
  if(t<=last)return{f:published()[0],mode:"archive"};
  /* Past the last scheduled date: cycle the whole library in order, one per day, so every day has a fact */
  const n=Math.round((parse(t)-parse(last))/864e5);
  return{f:FACTS[(n-1)%FACTS.length],mode:"encore"}}
const isToday=d=>todaysFact().f.d===d;

/* Reading streak */
function dayBack(k,n){const d=parse(k);d.setDate(d.getDate()-n);return key(d)}
function streakCount(days,t){let n=0;while(days.includes(dayBack(t,n)))n++;return n}
function updateStreak(){
  const t=todayKey();let days=store.get("cur_days",null);
  if(!days){days=[];const o=store.get("cur_streak",null);if(o&&o.last){for(let i=0;i<o.n;i++)days.push(dayBack(o.last,i))}}
  const first=!days.includes(t);
  if(first){days.push(t);days=days.slice(-1000);store.set("cur_days",days)}
  const n=streakCount(days,t),txt="Reading streak: "+n+(n===1?" day":" days");
  $("#streak").textContent=txt;$("#streak2").textContent=txt;return{n,first}}
function showStreak(){
  if($("#skov"))return;
  const t=todayKey(),days=store.get("cur_days",[]),n=streakCount(days,t),dow=(parse(t).getDay()+6)%7,L=["M","T","W","T","F","S","S"];
  const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="#101a33" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  let cells="";
  for(let i=0;i<7;i++){const done=days.includes(dayBack(t,dow-i));
    cells+=`<div class="sk-day"><span>${L[i]}</span><i class="sk-c${done?" on":""}${i===dow?" now":""}" style="--i:${i}">${done?TICK:""}</i></div>`}
  const o=document.createElement("div");o.className="sk-ov";o.id="skov";
  o.innerHTML=`<div class="sk-card" role="dialog" aria-label="Reading streak"><div class="sk-n">${n}</div><div class="sk-t">day streak</div><div class="sk-m">${n===1?"Nice start. Come back tomorrow to build it.":"You’re on a roll. Keep it going."}</div><div class="sk-row">${cells}</div><button class="btn sm" id="skgo">Keep going</button></div>`;
  const close=()=>{o.style.transition="opacity .2s";o.style.opacity=0;setTimeout(()=>o.remove(),200);document.removeEventListener("keydown",esc)},esc=e=>{if(e.key==="Escape")close()};
  o.addEventListener("click",e=>{if(e.target===o||e.target.id==="skgo")close()});document.addEventListener("keydown",esc);document.body.appendChild(o)}

/* Bookmarks */
const marks=()=>store.get("cur_marks",[]);
function toggleMark(d){let m=marks();m=m.includes(d)?m.filter(x=>x!==d):[...m,d];store.set("cur_marks",m);setTimeout(checkBadges,2400);return m.includes(d)}

const card=f=>`<div class="acard rv" data-go="${f.d}">${isToday(f.d)?'<span class="today-tag">TODAY</span>':""}${art(f)}<div class="fbody"><span class="kick">${fmt(f.d)} · ${mins(f)} min</span><h3>${f.t}</h3></div></div>`;
function observe(){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.1});
  $$(".rv").forEach(e=>io.observe(e))}
function confetti(){const c=["#c6f432","#101a33","#f08c00","#3b5bdb","#c2255c"];
  for(let i=0;i<46;i++){const e=document.createElement("i");e.className="confetti";
    e.style.cssText=`background:${c[i%5]};--x:${(Math.random()-.5)*640}px;--y:${(Math.random()-.7)*520}px;--rot:${Math.random()*720}deg`;
    document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}}

  const rel=FACTS.filter(x=>x.d!==d&&x.d<=todayKey()).sort((a,b)=>(b.c===f.c)-(a.c===f.c)||b.d.localeCompare(a.d)).slice(0,3);

    ${f.more&&f.more.length?`<h2 class="rv">Going deeper</h2>${f.more.map(p=>`<p class="rv" style="margin-bottom:14px">${p}</p>`).join("")}`:""}
    <h2 class="rv">Did you know?</h2><div class="dyk rv">${f.dyk.map((x,i)=>`<div><b>${i+1}</b>${x}</div>`).join("")}</div>
    ${f.why?`<h2 class="rv">Why this matters</h2><p class="rv">${f.why}</p>`:""}
    <h2 class="rv">Sources &amp; further reading</h2><ul class="src rv">${f.src.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join("")}</ul>
  </article>
  <section><h2 style="margin-bottom:20px">Related discoveries</h2><div class="grid">${rel.map(card).join("")}</div></section>`;

 {id:"b10",g:"Collecting",ic:"🔖",name:"Collector",desc:"Save 10 facts",goal:10,val:s=>s.saved},
 {id:"c3",g:"Collecting",ic:"🧭",name:"Explorer",desc:"Reveal facts in 3 categories",goal:3,val:s=>s.cats},
 {id:"c7",g:"Collecting",ic:"🌍",name:"Polymath",desc:"Reveal facts in all "+Object.keys(CATS).length+" categories",goal:Object.keys(CATS).length,val:s=>s.cats},
 {id:"d30",g:"Collecting",ic:"📅",name:"Regular",desc:"Visit on 30 different days",goal:30,val:s=>s.days}];
function checkBadges(){const st=badgeStats(),got=BADGES.filter(b=>b.val(st)>=b.goal),seen=store.get("cur_seen",[]),nw=got.filter(b=>!seen.includes(b.id));
  if(nw.length){store.set("cur_seen",got.map(b=>b.id));toast("Badge unlocked: "+nw[0].name+(nw.length>1?" +"+(nw.length-1)+" more":""))}}
function badges(){const st=badgeStats(),got=BADGES.filter(b=>b.val(st)>=b.goal).length;
  const card=b=>{const v=b.val(st),ok=v>=b.goal;return `<div class="bd${ok?"":" lock"}"><i>${b.ic}</i><b>${b.name}</b><small>${b.desc}</small>${ok?"":`<div class="bar2"><span style="width:${Math.round(v/b.goal*100)}%"></span></div><small>${v} / ${b.goal}</small>`}</div>`};
  const sec=g=>`<h2>${g}</h2><div class="bd-grid">${BADGES.filter(b=>b.g===g).map(card).join("")}</div>`;
  $("#app").innerHTML=`<article class="article"><p class="kick">Badges</p><h1>Your <mark>achievements</mark></h1><p class="lead">${got} of ${BADGES.length} earned. Best streak: ${st.best} ${st.best===1?"day":"days"}.</p>${sec("Streak")}${sec("Learning")}${sec("Collecting")}</article>`}

/* ===== ROUTER (renders directly; the URL hash is updated when the browser allows it) ===== */
let cur=(location.hash.slice(1))||"/",backTo="/";
function route(){
  const[p,a]=cur.split("/").filter(Boolean);
  $("#today-date").textContent=fmt(todayKey(),{weekday:"long",day:"numeric",month:"long"});
  $$(".drawer .dl").forEach(l=>l.classList.toggle("on",l.dataset.r===(p||"home")||(p==="article"&&l.dataset.r==="archive")));
  (p==="archive"?archive:p==="categories"?categories:p==="about"?about:p==="badges"?badges:p==="disclaimer"?disclaimer:p==="article"?()=>article(a):home)();
  window.scrollTo(0,0);
}
function go(path){if(path.startsWith("/article")&&!cur.startsWith("/article"))backTo=cur==="/archive"?"/archive":"/";cur=path;try{if(location.hash.slice(1)!==path)location.hash=path}catch(e){}closeMenu();route()}
addEventListener("hashchange",()=>{const p=location.hash.slice(1)||"/";if(p!==cur){cur=p;route()}});
document.addEventListener("click",e=>{
  const n=e.target.closest("[data-nav]");if(n){e.preventDefault();go(n.dataset.nav);return}
  const g=e.target.closest("[data-go]");if(g){go("/article/"+g.dataset.go)}});

/* ===== BURGER MENU ===== */
const openMenu=()=>{document.body.classList.add("open");$("#burger").setAttribute("aria-expanded","true")};
function closeMenu(){document.body.classList.remove("open");$("#burger").setAttribute("aria-expanded","false")}
(()=>{const lg=document.querySelector(".logo");lg.addEventListener("click",()=>{lg.classList.remove("pop");void lg.offsetWidth;lg.classList.add("pop")});lg.addEventListener("animationend",()=>lg.classList.remove("pop"))})();
$("#burger").onclick=openMenu;$("#xbtn").onclick=closeMenu;$("#scrim").onclick=closeMenu;
$("#rnd2").onclick=()=>{closeMenu();randomFact()};
addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});

["#streak","#streak2"].forEach(q=>$(q).onclick=showStreak);
const _st=updateStreak();route();if(_st.first)setTimeout(showStreak,700);setTimeout(checkBadges,_st.first?2200:800);
/* Refresh automatically at local midnight */
(function midnight(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,2);
  setTimeout(()=>{updateStreak();route();midnight()},t-n)})();
</script>
