"Lichens are a partnership between a fungus and an alga|N|What looks like one organism is really two or three living together.|The fungus gives shelter and the alga or cyanobacterium makes food by photosynthesis. Lichens can grow on bare rock and in extreme cold.|They grow slowly, sometimes under a millimetre a year.|Some lichens are used to track air pollution.|Lichen",
"Pitcher plants drown insects in a trap of liquid|N|Tropical Nepenthes plants have jug-shaped leaves with slippery rims.|Insects slip into a pool of digestive fluid at the bottom. The plant absorbs nutrients from them, which helps it live in poor soil.|Some large species have caught frogs and even small mammals.|Some partner with tree shrews, whose droppings feed the plant.|Nepenthes",
"Baobabs store water in huge trunks|N|Some African baobabs can hold thousands of litres in their swollen trunks.|The trunk acts like a tank that carries the tree through long dry seasons. Baobabs drop their leaves in the dry season and can live for centuries.|Madagascar has six species of baobab.|Their fruit is high in vitamin C.|Adansonia",
"The world’s largest single flower smells like rotting flesh|N|Rafflesia arnoldii can grow nearly a metre across.|The plant has no leaves, stems or roots. It lives as a parasite inside a vine and appears only to bloom, attracting flies to pollinate it.|Blooms last only a few days.|It grows in the rainforests of Sumatra and Borneo.|Rafflesia_arnoldii",
"General Sherman is the largest tree on Earth by volume|N|This giant sequoia in California holds an estimated 1,400 cubic metres of wood.|It is about 84 m tall and over 11 m wide at the base. Giant sequoias are the biggest trees by volume, though coast redwoods grow taller.|It is thought to be around 2,200 years old.|Giant sequoias have thick bark that resists fire.|General_Sherman_(tree)",
"Mangroves grow with their roots in salt water|N|These coastal trees thrive where most plants would die of salt.|They filter or excrete salt, and their tangled roots shelter young fish and protect shores from waves and storms.|They grow on tropical and subtropical coasts around the world.|Mangrove forests store large amounts of carbon.|Mangrove",
"The coco de mer has the largest seed in the world|N|A single seed from this Seychelles palm can weigh up to about 25 kg.|The palm grows naturally on only two islands in the Seychelles. The seed takes years to ripen, and the tree is protected.|The seed is double-lobed and looks like a pair of hips.|It was once believed to grow on a tree under the sea.|Coco_de_mer",
"The Sargasso Sea has no coastline|O|It is a patch of the Atlantic bounded by ocean currents rather than land.|Floating sargassum seaweed gives it its name and shelters many animals. European and American eels travel there to breed.|It lies in the North Atlantic, east of Bermuda.|Its water is unusually clear and blue.|Sargasso_Sea",
"A dead whale feeds a deep-sea community for decades|O|When a whale sinks to the seafloor, its body becomes an island of food.|Scavengers eat the flesh, then worms and bacteria use the bones and oils for years. This is called a whale fall.|Some bone-eating worms live on whale bones.|Whale falls were first found on the seafloor in 1987.|Whale_fall",
"The ocean has a slow global conveyor belt|O|Differences in temperature and saltiness drive water around the planet over centuries.|Cold, salty water sinks near the poles and flows along the deep seafloor, while warmer water moves near the surface. One full loop takes around a thousand years.|This circulation helps spread heat around Earth.|Scientists are studying whether climate change could slow it.|Thermohaline_circulation",
"Giant squid have some of the largest eyes in the animal kingdom|O|Their eyes can be about 27 cm across, roughly the size of a dinner plate.|Large eyes help them detect faint glows in the dark deep sea, such as light stirred up by approaching sperm whales. Giant squid were first photographed alive in the wild in 2004.|They can reach about 12 to 13 metres in length.|They live in deep water around the world.|Giant_squid",
"The longest mountain range on Earth is under the sea|O|The mid-ocean ridge winds for about 65,000 km along the ocean floor.|It forms where tectonic plates pull apart and new crust rises from below. Iceland is a place where it rises above the surface.|Seafloor spreading was a key clue that led to the theory of plate tectonics.|Hydrothermal vents are often found along it.|Mid-ocean_ridge",
"The biggest daily migration on Earth happens in the sea|O|Every night, huge numbers of sea creatures rise from the depths to feed near the surface.|Small fish, krill and jellyfish swim up under cover of darkness and return to deeper water by day, avoiding predators. It is called diel vertical migration.|Sonar picks it up as a moving layer that was once mistaken for a false seafloor.|It carries carbon from the surface down to the deep.|Diel_vertical_migration",
"The ocean has absorbed most of the extra heat from global warming|O|More than 90% of the extra heat trapped by greenhouse gases has gone into the sea.|Water holds far more heat than air. That has slowed surface warming but raised ocean temperatures and expanded seawater, which contributes to sea-level rise.|Scientists track ocean heat with thousands of floats called Argo floats.|Warmer water can bleach coral reefs.|Ocean_heat_content",
"Your body makes about two million red blood cells every second|B|Each red cell lives for roughly four months.|Red blood cells are made in bone marrow and carry oxygen using haemoglobin. Old cells are removed by the spleen and liver.|Red blood cells have no nucleus.|A single drop of blood holds millions of them.|Red_blood_cell",
"Your gut holds about as many bacteria as you have human cells|B|The microbes in your gut roughly match the number of cells in your body.|Estimates suggest a ratio close to one to one, not the ten to one often quoted. These microbes help digest food and train the immune system.|Most live in the large intestine.|Diet affects which bacteria thrive.|Gut_microbiota",
"The tongue map is a myth|B|You can taste sweet, salty, sour, bitter and umami on every part of your tongue.|The idea of separate zones came from a mistranslated early study. Taste receptors for all five basic tastes are spread across the tongue.|Smell contributes a lot to what we call flavour.|Humans have thousands of taste buds.|Taste",
"Fingerprints form before you are born|B|The ridges develop in the womb and stay the same for life.|Even identical twins have different fingerprints, because the pattern depends partly on conditions in the womb. Fingerprints can wear but grow back in the same pattern.|Police have used fingerprints for identification since the late 1800s.|Koalas also have fingerprints.|Fingerprint",
"The smallest bone in your body is in your ear|B|The stapes is only about three millimetres long.|It is one of three tiny bones that pass sound vibrations from the eardrum to the inner ear. Its name means stirrup, which it resembles.|The other two ear bones are the malleus and the incus.|The femur is the longest bone.|Stapes",
"You blink about 15 to 20 times a minute|B|Each blink spreads a film of tears over the eye.|Blinks keep the eye moist and clear of dust. People blink less when concentrating, such as when reading on a screen.|A blink lasts a fraction of a second.|Some blinking is automatic, but you can also do it on purpose.|Human_eye",
"The first webcam watched a coffee pot|T|In 1991 Cambridge computer scientists pointed a camera at a coffee machine so they could see if it was full.|The Trojan Room coffee pot camera sent a picture across the university network, and later went online in 1993, so people worldwide could watch it.|It is often called the first webcam.|The pot was sold at auction in 2001.|Trojan_Room_coffee_pot",
"The first computer “bug” was a real moth|T|In 1947 operators found a moth stuck in a relay of the Harvard Mark II.|They taped it into the logbook with a note about the first actual case of a bug being found. The word bug was already used for engineering faults, and the moth helped make the joke famous.|Grace Hopper is closely linked to the story.|The logbook page is kept at the Smithsonian.|Computer_bug",
"The QWERTY keyboard layout dates from the 1870s|T|It is still used on most keyboards today.|One common story says it was arranged to reduce jams by separating common letter pairs, though historians debate this. It stuck because everyone learned it.|Other layouts such as Dvorak claim to be faster.|It is named after the first six letters on the top row.|QWERTY",
"The first text message said “Merry Christmas”|T|It was sent in December 1992 from a computer to a mobile phone in the UK.|Engineer Neil Papworth sent the message to a Vodafone director. Early phones could not send replies.|SMS stands for Short Message Service.|Messages were limited to 160 characters.|SMS",
"The first item scanned with a barcode was a pack of chewing gum|T|It happened at a supermarket in Troy, Ohio, in 1974.|The pack of Wrigley’s gum was scanned at the checkout, a milestone that made stock control much faster. Barcodes use patterns of bars that a laser reads.|The idea began with a design drawn in sand in the 1940s.|Barcodes now appear on billions of products.|Barcode",
"The Apollo Moon landings were guided by a tiny computer|T|The Apollo Guidance Computer had only tens of kilobytes of memory.|It had about 4 KB of working memory and roughly 72 KB of fixed memory, far less than a modern phone. Even so, it guided astronauts to the Moon and back.|It was one of the first computers to use integrated circuits.|Astronauts entered commands using a number keypad.|Apollo_Guidance_Computer",
"Papua New Guinea has over 800 languages|U|It is the most linguistically diverse country on Earth.|With roughly ten million people, it has more than 800 living languages, many spoken by only a few thousand people. Rugged terrain kept communities apart for thousands of years.|Tok Pisin is a widely used common language.|English and Hiri Motu are also official languages.|Languages_of_Papua_New_Guinea",
"Humans were playing flutes at least 35,000 years ago|U|Bone and ivory flutes found in German caves are among the oldest known musical instruments.|Flutes from caves such as Hohle Fels were carved from vulture bone and mammoth ivory. They show that music was part of life in the Ice Age.|The Hohle Fels flute was found in 2008.|It has five finger holes.|Hohle_Fels",
"Chess began in India about 1,500 years ago|U|Its ancestor was a war game called chaturanga.|Chaturanga spread to Persia and the Islamic world, then to Europe, where the pieces and rules gradually changed into modern chess. The queen became powerful only in the 15th century.|The word checkmate comes from Persian words meaning the king is helpless.|Chess is played worldwide.|Chaturanga",
"Esperanto was invented to be a common second language|U|L. L. Zamenhof published it in 1887 hoping to help people from different nations understand each other.|The language has regular grammar and a vocabulary borrowed from several European languages. Millions are believed to have learned it, and some people have grown up speaking it.|The word esperanto means one who hopes.|There are Esperanto speakers in over 100 countries.|Esperanto",
"Chocolate began as a bitter drink|U|People in Mesoamerica drank cacao thousands of years ago, long before it became sweet.|Early chocolate was made from ground cacao seeds, often mixed with water and spices. After Europeans brought it home, sugar was added and later solid chocolate was invented.|Cacao beans were once used as currency by the Aztecs.|The scientific name of the cacao tree means food of the gods.|Chocolate",
"Tea was first grown and drunk in China|U|Tradition says it was discovered by accident when leaves blew into boiling water.|Tea reached Europe in the 1600s, and today it is one of the most widely drunk beverages in the world.|All true teas come from the same plant, Camellia sinensis.|Black, green and white tea differ in how the leaves are processed.|Tea",
"You shed tens of thousands of skin cells every minute|B|Your outer skin layer is constantly flaking away and being replaced.|Skin cells are made in the deeper layers and slowly rise to the surface, where they die and drop off. The whole outer layer renews roughly every month.|The outer layer is called the epidermis.|Skin is your body’s largest organ.|Desquamation",
"Your liver can grow back|B|After part of it is removed or donated, the rest can regrow towards its original size.|Liver cells divide to rebuild the lost tissue, which is why living donors can give part of their liver. Regrowth takes weeks to months.|The liver is the largest internal organ.|It filters your blood and makes bile for digestion.|Liver_regeneration",
"Your retina has about 126 million light sensors|B|Rods handle dim light and cones handle colour.|Roughly 120 million rods and 6 million cones line the back of each eye. Cones are packed most densely in a tiny pit called the fovea, where your vision is sharpest.|Your eyes can take 20 to 30 minutes to fully adapt to darkness.|Rods cannot see colour, which is why things look grey at night.|Retina",
"Goosebumps are a leftover reflex|B|Tiny muscles pull each hair upright when you are cold or startled.|In furry animals, upright hair traps warm air or makes the animal look bigger. Humans have far less body hair, so the reflex does little today.|The muscles are called arrector pili.|Strong emotions, such as awe, can also cause goosebumps.|Goose_bumps",
"You are slightly taller in the morning|B|Most people measure about a centimetre or two more after a night’s sleep.|The cushioning discs between your vertebrae slowly compress during the day under gravity, then expand again while you lie down.|Those discs are made of tough cartilage.|Astronauts also grow taller in space.|Intervertebral_disc",
"O negative blood can be given to almost anyone in an emergency|B|Its red cells lack the markers that trigger most reactions.|Blood types depend on markers called antigens on red blood cells. Type O negative has none of the main ones, so doctors use it when there is no time to test a patient’s type.|Karl Landsteiner discovered the ABO blood groups in 1901.|AB positive people can receive red cells of any type.|Blood_type",
"Babies are born with soft cartilage kneecaps|B|Their kneecaps harden into bone over the first few years of childhood.|The patella begins as cartilage and gradually turns to bone, a process called ossification. This is one reason babies’ joints are so flexible.|Adults have 206 bones.|Babies have many more bony parts that fuse as they grow.|Patella",
"You are made of roughly 37 trillion cells|B|That is one well-known estimate, though the figure changes with the method used.|Scientists estimated about 37 trillion in 2013, though figures vary with the method used. Red blood cells are the most common type by number.|There are around 200 different kinds of cell in the body.|Cells vary hugely in size and shape.|Human_body",
"Your cornea has no blood vessels|B|It gets its oxygen directly from the air and from your tears.|Blood vessels would scatter light and cloud your vision, so the clear front of the eye does without them. The cornea does about two-thirds of the eye’s focusing.|Corneas can be transplanted.|They heal quickly after small scratches.|Cornea",
"Your stomach acid is strong, so the lining must keep renewing|B|It has a pH of roughly 1.5 to 3.5, strong enough to break down food and kill many germs.|A thick layer of mucus protects the stomach wall, and the lining cells are replaced every few days.|Stomach acid is mostly hydrochloric acid.|Ulcers can form when the protective layer fails.|Gastric_acid",
"The first computer mouse was made of wood|T|Douglas Engelbart and Bill English built it in the 1960s with a wooden shell and two wheels.|It was patented in 1970 and shown to the public in the famous 1968 demonstration that also featured video calls and hypertext. It got its name from the cord that looked like a tail.|It needed a large computer to run.|Mice only became common with personal computers in the 1980s.|Computer_mouse",
"The first message sent over the internet’s ancestor was just “LO”|T|In 1969 a computer at UCLA tried to send LOGIN to another computer, and the connection crashed after two letters.|It was sent over the ARPANET, a US research network that grew into the internet. The full word went through about an hour later.|The network started with just four connected computers.|The other end was at Stanford Research Institute.|ARPANET",
"Email is older than the web|T|Ray Tomlinson sent the first network email in 1971 and chose the @ sign for addresses.|The web did not appear until about 1989 to 1991. Email travelled across the ARPANET long before most people had heard of the internet.|The @ sign was a rarely used key on keyboards at the time.|Spam email is nearly as old, with a famous early example in 1978.|Email",
"The World Wide Web was invented at a physics lab|T|Tim Berners-Lee proposed it at CERN in 1989 to help scientists share information.|The first website went live in 1991. In 1993 CERN made the web’s software free for anyone to use, which helped it spread.|The web and the internet are not the same thing.|The internet is the network, and the web is a service that runs on it.|World_Wide_Web",
"The first .com domain was registered in 1985|T|It was symbolics.com, owned by a computer company.|Only a handful of .com names existed in the first year. Today there are more than 150 million .com domains.|Domain names turn into the numbers computers actually use.|The system that does this is called DNS.|Symbolics",
"Bluetooth is named after a Viking king|T|Harald Bluetooth united Danish tribes in the 10th century, like the technology unites devices.|The name was proposed as a placeholder during development, and it stuck. The logo combines the runes for his initials.|Bluetooth uses short-range radio waves.|It was created in the 1990s.|Bluetooth",
"Wi-Fi does not stand for anything|T|The name was chosen by a branding company in 1999 as a catchy label.|It was sometimes explained as wireless fidelity, but that was only a marketing line. Wi-Fi is based on a family of radio standards called IEEE 802.11.|Wi-Fi signals are radio waves.|The first version ran at just 2 megabits per second.|Wi-Fi",
"Touchscreens are older than most people think|T|The first capacitive touchscreen was invented in 1965 for air traffic control in the UK.|E. A. Johnson described it at the Royal Radar Establishment. Smartphones made touchscreens everyday objects after 2007.|Early touchscreens could only detect one touch at a time.|Modern phones can track several fingers at once.|Touchscreen",
"The oldest surviving photograph took hours to expose|T|Nicéphore Niépce took it around 1826 from a window in France.|He used a pewter plate coated with bitumen, and the exposure took many hours, so sunlight crossed the scene and lit buildings on both sides.|Photography became practical with the daguerreotype in 1839.|The photo is kept in Texas.|View_from_the_Window_at_Le_Gras",
"The word robot comes from a play|T|Czech writer Karel Čapek introduced it in the 1920 play R.U.R.|Robot comes from the Czech word robota, meaning forced labour. Čapek said his brother Josef suggested the word.|In the play the robots are made from synthetic matter, not metal.|R.U.R. stands for Rossum’s Universal Robots.|Robot",
"The Mona Lisa became world famous after it was stolen|U|In 1911 a former Louvre worker took the painting, and newspapers around the world covered the story.|Vincenzo Peruggia hid it for more than two years before being caught trying to sell it in Florence. It returned to the Louvre in 1913.|Leonardo da Vinci painted it in the early 1500s.|It is now kept behind bulletproof glass.|Mona_Lisa",
"Beethoven composed some of his greatest work while almost deaf|U|His Ninth Symphony premiered in 1824, when he could barely hear the applause.|Beethoven began losing his hearing in his twenties and was nearly deaf later in life. The Ninth’s final movement features the Ode to Joy.|The Ode to Joy melody is the anthem of the European Union.|He is said to have turned around to see the audience applauding.|Ludwig_van_Beethoven",
"The word quarantine comes from the number forty|U|It comes from Italian words meaning forty days, the time ships had to wait before landing during plague outbreaks.|Venetian authorities began using the practice in the 14th century. Isolation periods today are based on how long each disease takes to show itself.|The practice began with ships arriving in port.|The same root gives the word for forty in many languages.|Quarantine",
"The ancient Olympic Games lasted for over a thousand years|U|They began, by tradition, in 776 BCE at Olympia in Greece and ended around 393 CE.|Athletes competed in running, wrestling, chariot racing and more. The modern Olympics were revived in Athens in 1896.|Wars were paused for the games under a sacred truce.|The winners got olive wreaths, not gold medals.|Ancient_Olympic_Games",
"One of the oldest written songs is about 3,400 years old|U|Clay tablets from Ugarit in Syria record a Hurrian hymn, with notation scholars have tried to interpret.|The hymn is often called the oldest nearly complete piece of notated music, although how it sounded is debated.|It was written in cuneiform.|The tablets date to around 1400 BCE.|Hurrian_songs",
"Emoji began in Japan in 1999|U|Shigetaka Kurita designed the first set of 176 emoji for a mobile internet service.|The word emoji means picture character in Japanese. Emoji spread worldwide after Apple and Google added them to their phones.|The original emoji were just 12 by 12 pixels.|New emoji are approved by the Unicode Consortium.|Emoji",
"The Rubik’s Cube has about 43 quintillion positions|U|Hungarian inventor Ernő Rubik built the first one in 1974 as a teaching tool.|It was first called the Magic Cube and became a global craze after 1980. Any scrambled cube can be solved in at most 20 moves, which was proven in 2010.|Hundreds of millions of cubes have been sold.|The fastest solves take only a few seconds.|Rubik's_Cube",
"Sign languages are full languages, and they differ around the world|U|There are around 300 different sign languages, and they are not universal.|Each has its own grammar, vocabulary and regional variation. British and American Sign Language are quite different, even though both countries speak English.|Sign languages use handshapes, movement and facial expressions.|New sign languages can arise naturally when deaf people form communities.|Sign_language",
"The Tale of Genji is often called the first novel|U|Murasaki Shikibu wrote it in Japan around the year 1000.|The long story follows the life and loves of a prince at the imperial court. Some scholars call it the world’s first novel, although that title is debated.|The author was a court lady in Heian-era Japan.|It has more than 50 chapters.|The_Tale_of_Genji",
"The piano was invented around the year 1700|U|Bartolomeo Cristofori built it in Florence, Italy.|Earlier keyboards could not change volume with touch. Cristofori’s instrument could play soft and loud, so it was called the gravicembalo col piano e forte, which became the piano.|A modern piano has about 88 keys.|It has thousands of moving parts.|Piano",
"The Bermuda Triangle is not unusually dangerous|O|Investigations have found no evidence that ships and planes vanish there more than in other busy waters.|The legend grew from magazine stories in the 1950s and 1960s. Insurers and the US Coast Guard have found nothing unusual, and many cases had ordinary explanations such as storms.|The area is a rough triangle between Florida, Bermuda and Puerto Rico.|It is crossed by many ships and flights every day.|Bermuda_Triangle",
"Horseshoe crab blood protects medicines from bacteria|O|Their blue blood clots around bacterial toxins, which makes it useful for safety testing.|A substance from the blood is used to test vaccines and injectable drugs for contamination. Synthetic alternatives are now being adopted to reduce the harvest of wild crabs.|Horseshoe crabs are not true crabs and are related to spiders.|Their lineage goes back hundreds of millions of years.|Horseshoe_crab",
"Seagrass meadows store huge amounts of carbon|O|These underwater flowering plants cover a small part of the seabed but lock away carbon efficiently.|Seagrass traps carbon in the mud beneath it, and meadows also shelter young fish and protect coasts. They are among the ecosystems called blue carbon habitats.|Seagrasses are flowering plants, not seaweeds.|Many meadows are shrinking because of pollution and damage.|Seagrass",
"Tsunamis can travel as fast as a jet plane|O|In deep water they can move at around 800 km/h, yet be barely noticeable.|A tsunami is a long wave that grows taller as it reaches shallow water near the coast. They are most often caused by undersea earthquakes, though landslides and volcanoes can trigger them too.|A tsunami is a series of waves, not just one.|The first sign on the coast can be the sea draining away.|Tsunami",
"Monarch butterflies migrate over several generations|N|No single butterfly makes the whole round trip from Canada to Mexico and back.|Each autumn a special generation flies thousands of kilometres to oyamel fir forests in central Mexico, where they spend winter. Their children and grandchildren then fly north again.|Monarchs are poisonous to many predators because of milkweed.|Their orange and black wings warn birds to stay away.|Monarch_butterfly",
"Kyoto has recorded cherry blossom dates for over 1,200 years|N|Written records of when the blossoms peak go back to the 9th century.|Scientists use these records to study climate, since warm springs bring earlier blooms. In 2021 the blossoms peaked earlier than in any year in the record.|The blossoms usually peak in late March or early April.|Hanami is the Japanese custom of enjoying them.|Cherry_blossom",
"Some mushrooms glow in the dark|N|Dozens of fungus species make their own light, often a soft green glow.|The effect is called foxfire. It is made by a chemical reaction, and scientists think it may attract insects that spread the fungus’s spores.|Glowing wood was noticed by ancient writers.|Bioluminescent fungi are found in forests around the world.|Foxfire",
"Autumn leaves show colours that were hidden all summer|N|Yellow and orange pigments are always in the leaf, but green chlorophyll masks them until autumn.|When days shorten, the tree breaks down chlorophyll and the yellow carotenoids show through. Red colours come from anthocyanins, which many trees make fresh in autumn.|Weather affects how bright the colours are.|Evergreen trees keep their needles year-round.|Autumn_leaf_color",
"You have about 600 skeletal muscles|B|They make up roughly 40% of an adult’s body weight.|Skeletal muscles are attached to bones by tendons and pull on them to produce movement. The exact count depends on how muscles are defined, but around 600 is the usual figure.|The heart is a different type of muscle.|The largest muscle is the gluteus maximus.|Skeletal_muscle",
"Your blood vessels would stretch about 100,000 km|B|That is more than twice the distance around the Earth.|Arteries, veins and tiny capillaries form a network that reaches nearly every cell. Capillaries are so thin that red blood cells pass through them in single file.|Capillaries make up most of the length.|The heart pumps blood around the whole network in about a minute.|Blood_vessel",
"Your lungs contain hundreds of millions of tiny air sacs|B|Each air sac, called an alveolus, is where oxygen enters the blood.|An adult has roughly 300 to 500 million alveoli. Their thin walls and huge combined surface area let gases pass quickly between air and blood.|The alveoli are surrounded by tiny blood vessels.|A substance called surfactant stops them from collapsing.|Pulmonary_alveolus",
"Humans can hear sounds from about 20 Hz to 20,000 Hz|B|That range shrinks with age, especially for high pitches.|Young people can hear very low rumbles and high whistles. Hearing for high frequencies usually fades first, which is why some ringtones were designed for young ears only.|Dogs can hear higher pitches than humans.|Elephants can detect infrasound that people cannot.|Hearing_range",
"Hair grows about a centimetre a month|B|The rate varies with age, genes and body area.|Scalp hair grows in cycles, with a growth phase lasting years, a short resting stage and shedding. Most people lose roughly 50 to 100 scalp hairs a day.|Hair is made of keratin, the same protein as nails.|Each hair grows from a follicle in the skin.|Hair",
"You dream several times every night|B|Most vivid dreams happen during REM sleep, when the brain is highly active.|During REM, or rapid eye movement, sleep, your eyes move quickly and most muscles are temporarily relaxed. A night has several REM periods, and people often forget their dreams.|Adults typically spend about a quarter of their sleep in REM.|Dream research is still an active science.|Rapid_eye_movement_sleep",
"The first spam email was sent in 1978|T|A marketing manager emailed several hundred people on the ARPANET to advertise a computer.|Gary Thuerk of Digital Equipment Corporation sent the message, which angered some recipients. The word spam later came to describe unwanted messages, borrowing from a Monty Python sketch.|The term comes from a sketch about canned meat.|Spam now makes up a large share of all email.|Email_spam",
"The first video on YouTube is 19 seconds long|T|“Me at the zoo” was uploaded in April 2005 by co-founder Jawed Karim.|It shows him at the San Diego Zoo talking about elephants. It is not a polished video, but it marks the start of a platform that now hosts billions of videos.|YouTube was founded in 2005.|Google bought it in 2006.|Me_at_the_zoo",
"GPS was deliberately made less accurate for civilians until 2000|T|The US military limited signal quality with a feature called selective availability.|The government switched it off in May 2000, and civilian GPS accuracy improved from roughly 100 metres to a few metres overnight. This opened the door to satellite navigation in phones and cars.|Selective availability was added for security.|Modern phones can locate you to within a few metres.|Selective_availability",
"The save icon is a floppy disk|T|Many people who click it have never used one.|Floppy disks stored files on computers from the 1970s to the 2000s. The icon stuck, even though cloud storage and flash drives replaced them.|Floppy disks held about 1.44 MB.|The icon is an example of a skeuomorph, a design that imitates an old object.|Floppy_disk",
"One of the first video games was made in 1958|T|Physicist William Higinbotham built Tennis for Two for visitors at a US laboratory.|It ran on an analogue computer and was displayed on an oscilloscope. Visitors queued to play it, and it is often called one of the earliest video games.|It predates Pong by 14 years.|The game was shown at Brookhaven National Laboratory.|Tennis_for_Two",
"The first digital camera weighed about 3.6 kilograms|T|Kodak engineer Steven Sasson built it in 1975, and it took 23 seconds to record one photo.|It captured black and white pictures of 0.01 megapixels onto a cassette tape. Kodak’s management saw it as a curiosity.|The resolution was 100 by 100 pixels.|Kodak did not sell the idea for years.|Digital_camera",
"The first long-distance telegraph message was “What hath God wrought”|T|Samuel Morse sent it from Washington to Baltimore in 1844.|The line used electrical pulses and Morse code to carry messages almost instantly. The phrase comes from the Bible and was suggested by a young woman named Annie Ellsworth.|Morse code uses dots and dashes.|The telegraph made news travel much faster.|Samuel_Morse",
"Moore’s law predicted that chips would double in power regularly|T|In 1965 Gordon Moore noticed that the number of components on a chip was doubling about every year.|He later revised it to about every two years. For decades the pattern held, helping computers become smaller, faster and cheaper, though it is now slowing.|Moore co-founded Intel.|It was a prediction, not a law of nature.|Moore's_law",
"The oldest known cave art is about 51,000 years old|U|It was found on the Indonesian island of Sulawesi and shows people hunting animals.|The painting is among the oldest known scenes showing figures and a story. Researchers dated it by analysing mineral layers that formed over the paint.|The figures appear to be hunting pigs.|Other Sulawesi paintings are thousands of years older than European cave art.|Leang_Karampuang",
"Neapolitan pizza making is recognised by UNESCO|U|In 2017 the art of the Neapolitan pizzaiolo was added to its heritage list.|Traditional pizza from Naples has strict rules about its dough, tomatoes and cooking in a wood-fired oven at very high heat for about a minute or two.|Naples is considered the birthplace of pizza.|Margherita pizza is said to be named after a queen.|Neapolitan_pizza",
"Origami means folding paper|U|The Japanese word combines oru, to fold, and kami, paper.|Paper folding has been practised in Japan for centuries and also appears in China and Europe. Modern origami uses mathematics to design complex shapes.|The traditional crane is a symbol of peace.|Origami techniques help design foldable satellites.|Origami",
"Kintsugi repairs broken pottery with gold|U|The Japanese art highlights cracks instead of hiding them.|Broken pieces are joined with lacquer mixed with powdered gold, silver or platinum. The repair becomes part of the object’s history.|The word means golden joinery.|It is linked to the idea of finding beauty in imperfection.|Kintsugi",
"The word “OK” began as a joke in 1839|U|It came from a Boston newspaper fashion for misspelled abbreviations.|OK was a joke spelling of “all correct”, written as oll korrect. It caught on after being used in the 1840 US presidential campaign and is now understood almost everywhere.|It is one of the most widely used English words.|Other jokes of that fashion, such as KY and OW, did not survive.|Okay",
"Braille was invented by a teenager|U|Louis Braille developed his reading system for blind people at the age of fifteen.|He had lost his sight in childhood and improved a military code that used raised dots. His system uses six dots in different combinations to make letters, numbers and music notes.|It was first published in 1829.|Braille has versions for many languages.|Braille",
"The first Nobel Prizes were awarded in 1901|U|They were set up in the will of Alfred Nobel, the inventor of dynamite.|The prizes were first given in physics, chemistry, medicine, literature and peace, with economics added later in 1969. The ceremony takes place every December.|The first physics prize went to Wilhelm Röntgen.|Marie Curie won two Nobel Prizes.|Nobel_Prize",
"The Day of the Dead is a celebration of remembrance|U|In Mexico, families honour loved ones who have died with food, music and flowers.|The festival around 1 and 2 November blends indigenous traditions with Catholic ones. Families build altars with photos, marigolds and favourite foods.|UNESCO recognised it in 2008.|Sugar skulls are a common treat.|Day_of_the_Dead",
"Sperm whales can dive more than a kilometre deep|O|They hold their breath for over an hour while hunting squid in the dark.|They use echolocation clicks to find prey. Their bodies are adapted to pressure and low oxygen, storing oxygen in their blood and muscles.|They have the largest brain of any animal.|Sperm whales hunt giant squid.|Sperm_whale",
"Giant kelp can grow half a metre in a day|O|It is one of the fastest-growing organisms in the sea.|Kelp is a large brown seaweed that forms underwater forests along cool coasts. Giant kelp can reach 30 to 50 metres in length.|Kelp forests shelter many marine animals.|Kelp is used in food and other products.|Kelp",
"The Svalbard Global Seed Vault stores backup seeds in the Arctic|N|It holds duplicates of seeds from gene banks around the world, deep inside a frozen mountain.|Opened in 2008 on a Norwegian island, it is designed to protect crop diversity from disaster, war and mismanagement. Permafrost helps keep the seeds cold.|It holds millions of seed samples.|The vault is sometimes called the doomsday vault.|Svalbard_Global_Seed_Vault",
"Welwitschia is a desert plant that grows only two leaves|N|Its leaves keep growing for its whole life, which can last over a thousand years.|It lives in the Namib Desert, where it absorbs moisture from fog. The leaves split into strips and trail across the sand.|Some plants are thought to be over 1,000 years old.|It is related to conifers, not to flowering plants.|Welwitschia",
"Strangler figs begin life on top of other trees|N|They sprout in branches and send roots down to the ground.|Over time the roots thicken, wrap around the host and may eventually kill it, leaving a hollow fig tree. They are important food sources for rainforest animals.|Fig trees depend on tiny wasps for pollination.|Many animals eat their fruit.|Strangler_fig",
"The Stroop effect makes naming ink colours harder|P|It is slower to say the colour of the ink when the word spells a different colour.|In 1935 John Ridley Stroop showed that reading is so automatic that it interferes with naming ink colours. Say “blue” for a word printed in red ink and your brain has to override the habit of reading.|The test is used to study attention and mental control.|People are usually faster when the word and ink colour match.|Stroop_effect",
"Spreading out your study beats cramming|P|The spacing effect shows that memories last longer when learning is split over time.|Hermann Ebbinghaus found in the 1880s that people remember more from several short sessions than from one long one. Spaced review gives the brain time to forget a little and then strengthen the memory again.|Quizzing yourself also helps memory.|The effect has been found in many studies since.|Spacing_effect",
"About half of people miss the gorilla|P|In a famous 1999 test, many viewers counting basketball passes did not notice a person in a gorilla suit.|Daniel Simons and Christopher Chabris asked people to count passes in a video. About half failed to see the gorilla walk through, an example of inattentional blindness: we often miss what we are not looking for.|The study won an Ig Nobel Prize.|Attention is limited, even when we feel we see everything.|Inattentional_blindness",
"People are less likely to help when others are watching|P|This is called the bystander effect, and it appears in many experiments.|After the 1964 murder of Kitty Genovese in New York, psychologists John Darley and Bibb Latané studied why people hold back. Each person may assume someone else will act, which spreads responsibility thinly.|The original news story of the murder was exaggerated.|In real emergencies, people often do help, especially when the danger is clear.|Bystander_effect",
"We notice evidence that agrees with us|P|Confirmation bias makes people favour information that supports what they already believe.|People tend to search for, remember and believe facts that fit their views, and to dismiss ones that do not. It affects everyone, including scientists, which is why careful studies try to test ideas by looking for evidence against them.|Asking what would change my mind can help.|It is one of many biases studied by psychologists.|Confirmation_bias",
"We like things more the more we see them|P|The mere exposure effect shows that familiarity breeds liking.|Psychologist Robert Zajonc found in 1968 that people rated unfamiliar words, shapes and faces more positively after seeing them repeatedly. Seeing something again and again makes it feel safe and easy to process.|It helps explain why songs grow on you.|Advertisers use repeated exposure.|Mere-exposure_effect",
"We get used to good things quickly|P|Hedonic adaptation means happiness tends to drift back to a baseline after big changes.|People often feel a lift after good news, such as a pay rise or a new gadget, then gradually return to their usual mood. Psychologists call this the hedonic treadmill, although some changes, such as long-term relationships, can have lasting effects.|The idea was described in the 1970s.|Noticing what you have can slow the effect.|Hedonic_treadmill",
"The marshmallow test is less simple than it sounds|P|It suggested children who waited for a bigger treat did better later, but later research says the link is weaker.|Walter Mischel’s studies in the 1960s and 70s at Stanford offered children one marshmallow now or two if they waited. Later studies with larger, more varied groups found the link to later success was much weaker once family background was taken into account.|Children used tricks such as looking away to wait longer.|Self-control can be influenced by trust and circumstances.|Stanford_marshmallow_experiment",
"We judge experiences by their peak and their end|P|The peak–end rule says we remember the most intense moment and the ending, not the average.|In a 1993 experiment involving Daniel Kahneman, people held a hand in painfully cold water. They preferred a longer trial that ended slightly less painfully, because the ending coloured their memory.|Duration often matters less than we expect.|Good endings can improve how an experience is remembered.|Peak–end_rule",
"You can hear your name in a noisy room|P|The cocktail party effect lets you tune in to one voice among many.|Colin Cherry studied this in 1953. People can focus on a single conversation in a crowd, but still notice important words, such as their own name, from other voices.|It shows attention is selective, not total.|It helps explain how hearing and attention work together.|Cocktail_party_effect",
"Once you notice something, you see it everywhere|P|The frequency illusion, sometimes called the Baader–Meinhof phenomenon, is the feeling that something suddenly appears everywhere.|After you learn a new word or notice a car model, your brain pays more attention to it, so you spot it more often. It has not actually become more common, you are just noticing it more.|The name Baader–Meinhof came from a newspaper comment in 1994.|Linguist Arnold Zwicky called it the frequency illusion in 2006.|Frequency_illusion",
"We forget fast at first, then more slowly|P|Ebbinghaus’s forgetting curve shows memory fades quickly after learning, then levels off.|In the 1880s Hermann Ebbinghaus tested himself on nonsense syllables and measured how much he forgot over time. Most of the loss came soon after learning, and reviewing the material helped keep it.|His work launched the scientific study of memory.|Regular review flattens the curve.|Forgetting_curve",
"Ketchup was once sold as medicine|F|In the 1830s, tomato ketchup was marketed as a cure for stomach complaints.|An Ohio doctor, John Cook Bennett, promoted tomato extract pills in 1834, and some sellers made ketchup tonics. Tomatoes were then thought to have healing properties, and the idea faded when the pills proved useless.|Ketchup began as a fish sauce in southern China.|The word may come from a Hokkien word for fish sauce.|Ketchup",
"Peanuts are not nuts|F|They are legumes, related to peas and beans, and they ripen underground.|A peanut plant flowers above ground, then the stalk bends and pushes the developing pod into the soil. Botanically a nut has a hard shell that does not split open, whereas peanuts are the seeds of a pod, like peas.|Peanut allergies are among the most common food allergies.|Peanuts are native to South America.|Peanut",
"Raw cashews come in a toxic shell|F|The shell contains a caustic oil that can burn skin, so cashews are always processed before sale.|Cashews are related to poison ivy and mangoes, and the oil in the shell causes similar irritation. Workers roast or steam the nuts to remove the oil, which is why cashews are never sold in their shells.|The cashew nut hangs below a fruit called the cashew apple.|The cashew tree is native to Brazil.|Cashew",
"Birds cannot feel chilli heat|F|Capsaicin makes mammals feel burning, but birds are insensitive to it.|Capsaicin triggers a pain receptor that normally responds to heat. Birds lack the sensitivity, so they can eat chillies and spread the seeds. The plants probably evolved the chemical to deter mammals.|The Scoville scale measures chilli heat.|Milk helps ease the burn because it dissolves capsaicin.|Capsaicin",
"Coffee beans are seeds|F|They come from the red fruit of the coffee plant, called coffee cherries.|Inside each cherry are usually two seeds, which are dried, roasted and ground. Coffee plants are grown in tropical regions around the world, and they take several years to produce their first crop.|Coffee is one of the most traded commodities.|Legend says an Ethiopian goat herder discovered coffee.|Coffee",
"A pineapple takes about two years to grow|F|Each plant produces only one fruit at a time, after a long wait.|A pineapple plant takes around 18 to 24 months to produce its first fruit. The fruit is not a single fruit but many small berries fused together around a central core.|Pineapples contain an enzyme that breaks down proteins.|The plant is a member of the bromeliad family.|Pineapple",
"Vanilla is the second most expensive spice|F|Only saffron costs more, because vanilla needs so much careful hand labour.|Vanilla comes from an orchid whose flowers open for a single day, so growers pollinate them by hand. In 1841 a young enslaved boy on Réunion, Edmond Albius, discovered the method still used today.|Vanilla pods are cured for months.|Madagascar is the largest producer.|Vanilla",
"Saffron needs about 150 flowers per gram|F|It is the dried stigmas of a crocus, picked by hand.|Each saffron crocus flower has three red stigmas, which are picked and then dried. Making a single gram takes the stigmas from around 150 flowers, which is one reason it is so expensive.|The harvest is done in a few weeks each autumn.|Saffron gives paella and other dishes their golden colour.|Saffron",
"Most “wasabi” is horseradish|F|Real wasabi is a rare, hard-to-grow plant, so many restaurants use a green horseradish paste.|True wasabi grows in cool, shaded stream beds in Japan and is difficult to farm. The paste served with sushi is often horseradish mixed with mustard and green colouring.|Real wasabi is grated fresh on a rough surface.|Its heat fades within seconds.|Wasabi",
"Sourdough bread is raised by wild yeast and bacteria|F|A sourdough starter is a living mix of yeast and lactic-acid bacteria.|The starter ferments flour and water, producing gas that raises the dough and acids that give the tangy taste. Some starters are kept alive for decades by regular feeding.|Bread leavened this way is among the oldest in history.|Every starter has its own mix of microbes.|Sourdough",
"A court once ruled the tomato a vegetable|F|In 1893 the US Supreme Court decided that tomatoes should be taxed as vegetables.|Botanically a tomato is a fruit, but in Nix v. Hedden the court ruled that in everyday use it was a vegetable, since it is served with dinner. The ruling affected import tariffs.|The decision was unanimous.|In botanical terms the tomato is a berry.|Nix_v._Hedden",
"The potato was the first vegetable grown in space|F|Scientists grew potato plants on the space shuttle Columbia in 1995.|NASA and the University of Wisconsin tested whether tubers could grow in orbit, as part of research on feeding astronauts on long missions. The potato plants grew successfully, and the work helped plan future space farming.|Potatoes were first grown in the Andes.|They are now among the world’s biggest food crops.|Potato",
"The first number you hear sways your guess|P|This is anchoring, and it works even when the number is random.|In a famous 1974 experiment by Amos Tversky and Daniel Kahneman, people spun a rigged wheel before guessing the share of African countries in the United Nations. Those who saw a higher number on the wheel guessed higher.|Anchoring affects prices and negotiations.|Experts are influenced by it too.|Anchoring_effect",
"Losing hurts about twice as much as winning feels good|P|Loss aversion means we feel losses more strongly than equal gains.|Studies by Kahneman and Tversky found that people often need to be offered about twice as much to accept a risk of losing. The exact ratio varies, but the pattern appears in many choices about money and goods.|It helps explain why people keep things they no longer need.|Shops use it with free trials.|Loss_aversion",
"Placebos can help even when you know they are placebos|P|Some studies found that honest, open-label placebos relieved symptoms.|A placebo is a treatment with no active ingredient. In open-label trials, patients were told the pills were inert and still reported relief for conditions such as irritable bowel syndrome, though results are mixed and the effects are mainly on how symptoms feel.|Expectation and context shape the placebo effect.|It is not a replacement for medicine.|Placebo",
"Two equal lines can look different lengths|P|In the Müller-Lyer illusion, arrowheads make one line look longer.|Franz Müller-Lyer described the illusion in 1889. Lines with outward-pointing fins look shorter than lines with inward-pointing ones, even though they are the same length, and measuring shows it.|The illusion works even when you know the trick.|It shows that perception is an interpretation.|Müller-Lyer_illusion",
"Pavlov’s dogs learned to drool at a signal|P|Classical conditioning shows that a neutral signal can trigger a reflex.|Ivan Pavlov noticed that dogs began to salivate when they heard the person who fed them. He then paired food with a sound, and the dogs learned to drool at the sound alone. He won the Nobel Prize in 1904 for earlier work on digestion.|Pavlov used various signals, including a metronome.|Conditioning is used in therapy for phobias.|Classical_conditioning",
"Expecting more from people can change how they do|P|The Pygmalion effect is the idea that higher expectations can raise performance.|In a 1960s study, Robert Rosenthal and Lenore Jacobson told teachers that some pupils were about to bloom. Those pupils improved a little more, which was said to show expectation at work. Later work found smaller and less consistent effects.|Teachers’ attitudes can shape pupils’ confidence.|The finding is debated.|Pygmalion_effect",
"You remember the start and the end of a list best|P|The serial position effect shows we recall items at the beginning and end more easily.|The first items, the primacy effect, get more time to be stored, and the last ones, the recency effect, are still fresh in short-term memory. The middle items are the most often forgotten.|The effect appears in many memory tests.|It can guide how to order a talk.|Serial_position_effect",
"Flow is the feeling of being completely absorbed|P|Psychologist Mihaly Csikszentmihalyi described it as time seeming to melt away.|He found that people felt flow when a task was challenging but achievable, with clear goals and feedback. Examples include playing music, sport or coding, and flow is linked to enjoyment.|The name came from people describing being carried by a current.|It is not the same as being relaxed.|Flow_(psychology)",
"Multitasking is mostly switching between tasks|P|The brain handles one demanding task at a time, so switching costs time.|Studies of human multitasking suggest that moving between tasks slows people down and can increase errors. Simple, automatic tasks can run together, such as walking and chatting, but two demanding ones compete for attention.|Phones are a common distraction.|Some people feel more productive than they are.|Human_multitasking",
"Other people notice you less than you think|P|The spotlight effect is the belief that others pay more attention to us than they do.|In a 2000 experiment at Cornell, students wore an embarrassing T-shirt into a room and guessed that about half the others noticed. In fact only about a quarter did.|We tend to overestimate how much others notice our slips.|This can reduce social anxiety.|Spotlight_effect",
"Vague personality descriptions feel like they are about you|P|The Barnum effect explains why horoscope lines can seem personal.|In 1948 Bertram Forer gave students the same general description and asked them to rate how well it fitted them. They rated it highly, even though it applied to almost anyone.|The description used statements like you sometimes doubt yourself.|The effect is named after the showman P. T. Barnum.|Barnum_effect",
"Words can change what you remember seeing|P|Elizabeth Loftus showed that how a question is asked can alter memory.|In her 1970s studies, people who were asked how fast cars were going when they smashed into each other gave higher speeds than those asked about cars that hit. Some later reported seeing broken glass that did not exist.|Memories are reconstructed, not replayed.|The work has influenced how witnesses are questioned.|Misinformation_effect",
"IQ scores rose through the 20th century|P|The Flynn effect describes rising test scores across generations, about three points a decade.|James Flynn documented the rise in many countries. Explanations include better schooling, nutrition and health, and more familiarity with abstract problems. In some countries the trend has recently slowed or reversed.|IQ tests are regularly renormed to keep the average at 100.|The cause is still debated.|Flynn_effect",
"Left-brained and right-brained people are a myth|P|The two halves of the brain specialise in some tasks, but people are not ruled by one side.|Some functions, such as language, are mostly on one side. But imaging studies show that people use both hemispheres together, and there is no evidence that one side dominates a person’s personality.|The idea comes from simplified readings of split-brain research.|The two halves communicate constantly.|Lateralization_of_brain_function",
"What you see can change what you hear|P|In the McGurk effect, watching lips move changes the sound you think you heard.|In 1976 Harry McGurk and John MacDonald showed that a video of someone saying ga paired with the sound ba is often heard as da. The brain combines sight and sound into one experience.|Closing your eyes changes what you hear.|It shows that speech perception uses vision too.|McGurk_effect",
"Parmigiano Reggiano is made with only three ingredients|F|Milk, salt and rennet are all that go into this aged Italian cheese.|It is made in a small region of northern Italy, and must be aged for at least 12 months. Wheels are tested by tapping them, and good ones can age for two years or more.|The cheese is protected by European law.|Its rind is edible.|Parmigiano_Reggiano",
"Beer is one of the oldest drinks|F|A Sumerian hymn from around 1800 BCE praises the goddess of brewing.|The Hymn to Ninkasi includes a recipe for beer made from barley bread. People in Mesopotamia brewed beer thousands of years ago, and some archaeologists think brewing is even older.|Early beer was thick and drunk through straws.|Brewing is among the first uses of yeast.|Beer",
"Coca-Cola once contained coca leaf extract|F|The original recipe included extracts of the coca leaf and kola nut.|The drink was created in 1886 by pharmacist John Pemberton. The cocaine was removed from the recipe around the early 1900s, but a flavour extract from the leaf is still used.|The kola nut contains caffeine.|It was first sold as a medicinal tonic.|Coca-Cola",
"Ripe cranberries bounce|F|Tiny air pockets inside make them rebound off a surface.|A ripe cranberry has four small air chambers, which also let it float. Growers flood cranberry fields to harvest, and the floating berries are corralled together.|Growers sometimes test ripeness by bouncing them.|Cranberries grow on low vines.|Cranberry",
"Popcorn pops because of trapped steam|F|Each kernel has a tiny drop of water that turns to steam when heated.|The hard shell holds the pressure until it reaches around 180 degrees Celsius, when it bursts and the starch inside puffs out. Only some corn varieties pop.|Popcorn has been eaten for thousands of years.|Unpopped kernels are called old maids.|Popcorn",
"Rice is the main food for more than half the world|F|It feeds billions of people, especially in Asia.|Rice is grown on every continent except Antarctica, and Asia grows and eats most of it. It is a staple for more than half of the world’s population.|There are tens of thousands of varieties.|It grows well in flooded fields called paddies.|Rice",
"Fortune cookies are not Chinese|F|They are thought to have been developed in California in the early 1900s.|Similar crackers were made in Japan, and Japanese bakers in San Francisco are among those credited with popularising them. They became linked with Chinese restaurants in America and are unusual in China.|The fortunes were added later.|Fortune cookies are rare in China.|Fortune_cookie",
"Avocados ripen after they are picked|F|They stay hard on the tree and soften only once harvested.|The fruit makes the ripening hormone ethylene once picked. Leaving it in a bag with an apple or banana can speed it up. Avocados are technically large berries with a single seed.|Ripe avocados are best eaten within days.|They are native to Mexico and Central America.|Avocado",
"Almost every banana you eat is a clone|F|The Cavendish banana has no seeds and is grown from cuttings.|Cavendish replaced the Gros Michel variety in the 1950s after a fungus called Panama disease wiped it out. Because all Cavendish plants are identical, they are at risk from a new strain of the disease.|Banana plants are giant herbs.|Wild bananas have large hard seeds.|Cavendish_banana",
"Some oranges stay green when ripe|F|In warm tropical climates, ripe oranges can remain green on the outside.|Cool nights make the peel turn orange as chlorophyll breaks down, so in the tropics the fruit may stay green even though it is ripe inside. Growers sometimes treat fruit to make it orange for sale.|Oranges are a hybrid of pomelo and mandarin.|Orange juice is often sold from fruit grown in Brazil and Florida.|Orange_(fruit)"
];

const UP={"Your body makes about two million red blood cells every second": {"body": ["Red blood cells, or erythrocytes, are made in the bone marrow. A healthy adult produces roughly two million every second, which keeps pace with the loss of a similar number of worn-out cells. Each one circulates for about 120 days.", "Their job is to carry oxygen. Each cell is packed with haemoglobin, an iron-containing protein that picks up oxygen in the lungs and releases it in the tissues. Mature human red cells have no nucleus, which leaves more room for haemoglobin and gives them a flexible disc shape that squeezes through the narrowest capillaries."], "bg": "The figure of two million per second is an estimate that varies with age, health and altitude. When oxygen is low, as it is high in the mountains, the kidneys release a hormone called erythropoietin that tells the marrow to make more red cells.", "more": ["Old or damaged cells are removed mainly by the spleen and liver, where their iron is recycled into new haemoglobin. Breaking down haemoglobin also produces the yellow pigment bilirubin, which is one reason bruises change colour as they heal.", "Red cells make up roughly 40 to 50 percent of the volume of blood, a figure doctors report as the haematocrit. Having too few, a condition called anaemia, can leave people tired and breathless."], "why": "Understanding how red blood cells are made and renewed underpins treatments for anaemia, blood donation and transfusion, and the training advice given to athletes who prepare at altitude.", "dyk": ["Mature red blood cells have no nucleus.", "Red blood cells are the most common type of cell in the body by number.", "Blood is red because the iron in haemoglobin turns bright red when it carries oxygen."], "src": [["Britannica — Red blood cell", "https://www.britannica.com/science/red-blood-cell"], ["Wikipedia — Red blood cell", "https://en.wikipedia.org/wiki/Red_blood_cell"]]}, "The first webcam watched a coffee pot": {"body": ["In 1991, researchers in the Computer Laboratory at the University of Cambridge were tired of walking to the Trojan Room, a shared kitchen area, only to find the coffee pot empty. Quentin Stafford-Fraser and Paul Jardetzky set up a camera pointing at the pot and wrote software that sent a small, low-resolution picture to everyone’s computer screens, so people could check before they went down.", "In 1993, as the web began to grow, the camera was connected to it, and pictures of the pot became viewable by anyone in the world, refreshing a few times a minute. It attracted visitors from around the globe and is widely described as the first webcam."], "bg": "Claims about “firsts” in technology are often contested, and other camera systems existed earlier in different settings. The Trojan Room coffee pot is usually called the first webcam because it was one of the first cameras to put a live-ish picture on the web for the public.", "more": ["The camera was a simple video camera attached to a computer that grabbed frames. Early pictures were tiny and updated only every few seconds to minutes, but the novelty of watching a coffee machine from the other side of the planet made it a minor sensation.", "The camera was switched off in 2001, when the lab moved buildings. The Krups coffee machine it had been watching was sold on eBay for £3,350 to the German online magazine Spiegel Online, and it reportedly kept working after the sale."], "why": "It shows how many big internet ideas began as small, practical problems, and how quickly a convenience shared by a handful of people can turn into a global habit of watching and sharing live pictures.", "dyk": ["The original system, called XCoffee, ran before the web was involved.", "The pot was a Krups filter coffee machine.", "The camera ran for about ten years before being switched off in 2001."], "src": [["University of Cambridge — Story of the Trojan Room coffee pot (timeline)", "https://www.cl.cam.ac.uk/coffee/qsf/timeline.html"], ["Wikipedia — Trojan Room coffee pot", "https://en.wikipedia.org/wiki/Trojan_Room_coffee_pot"]]}, "Papua New Guinea has over 800 languages": {"body": ["Papua New Guinea is the most linguistically diverse country on Earth. Around nine to ten million people there speak more than 800 living languages, about one in every eight of the world’s languages. Many have only a few thousand speakers, and some far fewer.", "The reasons are largely geographical and historical. Mountains, rainforest and rivers kept communities apart for thousands of years, so each valley and island group developed its own way of speaking. Small farming communities that rarely merged also let languages multiply instead of blending together."], "bg": "Counts of languages depend on how a language is told apart from a dialect, so figures differ between sources, and many Papua New Guinean languages have only been briefly described. Some are endangered as younger people move towards larger languages.", "more": ["English, Tok Pisin and Hiri Motu are among the official languages. Tok Pisin, an English-based creole, works as the main common language between speakers of different tongues and is heard in parliament, on radio and in daily life.", "Language diversity is also a record of human history. Linguists find language families in the region with no known relatives elsewhere, which helps them explore how people moved through the area and how languages change over time."], "why": "Each language carries its own stories, knowledge of local nature and ways of thinking, so losing one means losing part of human heritage. Papua New Guinea is a key place for researchers documenting and protecting languages.", "dyk": ["Tok Pisin means “talk pidgin” and grew from contact between English speakers and local communities.", "Linguists estimate that around 7,000 languages are spoken in the world.", "Some Papua New Guinean languages have fewer than a thousand speakers."], "src": [["Ethnologue — Papua New Guinea", "https://www.ethnologue.com/country/PG/"], ["Wikipedia — Languages of Papua New Guinea", "https://en.wikipedia.org/wiki/Languages_of_Papua_New_Guinea"]]}, "Your gut holds about as many bacteria as you have human cells": {"body": ["The human gut, mostly the large intestine, is home to trillions of microbes including bacteria, archaea, viruses and fungi, together called the gut microbiome. For decades the textbook claim was that microbes outnumber human cells ten to one, but a 2016 reanalysis estimated the ratio is closer to 1:1, with roughly 38 trillion bacteria and about 30 trillion human cells in a typical adult.", "These microbes are not just passengers. They help break down fibre that our own enzymes cannot digest, producing short-chain fatty acids that feed the cells lining the gut. They make some vitamins, help train the immune system and can crowd out harmful germs."], "bg": "The estimate is for a 70 kg reference adult, not for everyone. Bacterial counts vary widely between people and across the day, and the numbers describe cells, not weight: the whole microbiome weighs only a few hundred grams at most.", "more": ["The mix of species differs from person to person and is shaped by diet, medicines such as antibiotics, age and where you live. Babies pick up their first microbes at birth and through early feeding, and the community usually settles in early childhood.", "Researchers are exploring links between the microbiome and conditions such as inflammatory bowel disease, allergies and obesity. Some uses are well supported, for example faecal microbiota transplants for severe Clostridioides difficile infections, but many claims in the media about gut health go further than the evidence."], "why": "Knowing that we carry roughly as many microbial cells as our own helps explain why antibiotics can upset digestion, and why scientists see the microbiome as part of human health.", "dyk": ["Most gut bacteria live in the large intestine, where oxygen is scarce.", "Bacteria make up a large part of the dry weight of stool.", "The old ten-to-one figure came from a rough estimate made in the 1970s."], "src": [["Sender, Fuchs & Milo — Revised estimates for the number of human and bacteria cells in the body (PLOS Biology, 2016)", "https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.1002533"], ["Wikipedia — Gut microbiota", "https://en.wikipedia.org/wiki/Gut_microbiota"]]}, "The first computer “bug” was a real moth": {"body": ["On 9 September 1947, operators of the Harvard Mark II, an early electromechanical computer, traced a fault to a moth trapped in a relay. They removed the insect and taped it into the logbook with a note recording the first actual case of a bug being found. The page is now held by the Smithsonian’s National Museum of American History.", "The joke only worked because “bug” was already engineering slang for a hidden fault. Thomas Edison used the word in the 1870s, and the logbook entry plays on that. The story is often linked with Grace Hopper, who worked on the Mark computers and helped popularise it, although she did not make the entry herself."], "bg": "Popular tellings say Hopper discovered the first computer bug, but the word was in use long before 1947, and accounts differ about who spotted the moth. What the logbook does show is a team using a ready-made joke to record a real insect.", "more": ["The Harvard Mark II was built for the US Navy and ran on thousands of electromechanical relays, switches that click open and shut. A moth could easily jam the contacts, which is why early computers needed so much cleaning and checking.", "Debugging became the standard word for finding and fixing errors in software. It now describes a huge part of a programmer’s work, even though modern bugs are logic mistakes, not insects."], "why": "The story captures a basic fact about technology: things fail in surprising ways, and recording and fixing faults carefully is how reliable systems get built.", "dyk": ["Grace Hopper later helped develop early programming languages and is credited with popularising the word “debugging”.", "The Mark II was a relay computer, not an electronic one.", "Edison wrote about finding “bugs” in his inventions in 1878."], "src": [["Smithsonian National Museum of American History — Log Book With Computer Bug", "https://americanhistory.si.edu/collections/object/nmah_334663"], ["Wikipedia — Software bug", "https://en.wikipedia.org/wiki/Software_bug"]]}, "Humans were playing flutes at least 35,000 years ago": {"body": ["In caves of the Swabian Jura in southern Germany, archaeologists have found some of the oldest musical instruments ever discovered: flutes carved from bird bone and mammoth ivory. A griffon vulture bone flute from Hohle Fels cave, found in 2008 and pieced together from a dozen fragments, is about 22 cm long and has five finger holes. It is dated to at least 35,000 years ago.", "Making one took skill. The maker had to hollow a thin bone, cut a precise V-shaped notch at the blowing end and drill finger holes at carefully chosen spots. Replicas can play real melodies, and the spacing of the holes suggests a deliberate musical scale."], "bg": "Dates come from radiocarbon dating of material around the finds, which carries a margin of error, and some reports give a range reaching back further for the Swabian flutes. Researchers cannot be sure what the instruments were used for, though music, ritual and storytelling are all possible.", "more": ["The same region has produced remarkable carved figures, including the Lion-Man from Stadel cave and the Venus of Hohle Fels, so it gives a window into early symbolic life. The flutes appeared not long after anatomically modern humans arrived in Europe.", "Some scientists see music as part of what held early groups together, helping them share songs, stories and ceremonies. Others think music is far older still, in forms that left no trace, since voices, clapping and drums do not survive in the ground."], "why": "These instruments show that music was part of daily life in the Ice Age, tens of thousands of years before writing, farming or cities.", "dyk": ["The Hohle Fels flute has five finger holes.", "Other very old flutes were carved from mammoth ivory, which is much harder to work than bone.", "The Swabian Jura caves are a UNESCO World Heritage Site."], "src": [["UNESCO — Caves and Ice Age Art in the Swabian Jura", "https://whc.unesco.org/en/list/1527"], ["Wikipedia — Hohle Fels", "https://en.wikipedia.org/wiki/Hohle_Fels"]]}, "Coast redwoods drink fog": {"body": ["Coast redwoods (Sequoia sempervirens) grow along a narrow strip of the Pacific coast in northern California and southern Oregon, where summer fog rolls in from the ocean. Fog supplies a significant share of the water these trees use in the dry summer months, by dripping from their needles to the ground and by being absorbed directly through the leaves.", "Fog drip is surprisingly effective. A tall redwood has an enormous surface area of needles, and in thick fog the tree combs droplets out of the air and sends them down to the soil. Research by the Berkeley biologist Todd Dawson estimated that fog supplies roughly 13 to 45 percent of the water the trees use each year, depending on the site."], "bg": "Absorbing water directly through leaves has been measured in redwoods, but how much it matters compared with fog dripping to the soil is still being studied. Fog patterns also change from year to year.", "more": ["Redwoods are the tallest trees on Earth, with the tallest living individual measured at about 116 metres. Lifting water to such heights is hard, and researchers suspect that the difficulty of doing it sets a limit on how tall trees can grow. Taking in water at the leaves may help the tops stay hydrated.", "Coastal fog has declined in parts of California over the last century, and scientists are studying how that could affect the forests. Redwoods are long-lived, with some individuals over 2,000 years old, so changes in water supply can matter for a very long time."], "why": "Redwood forests store large amounts of carbon and shelter many other species, so understanding how fog and drought affect them helps decide how to protect them.", "dyk": ["Coast redwoods can live for more than 2,000 years.", "The tallest known living tree, Hyperion, is a coast redwood.", "Redwoods can sprout new trunks from their base after fire or damage."], "src": [["US National Park Service — Redwood National and State Parks", "https://www.nps.gov/redw/"], ["Britannica — Redwood", "https://www.britannica.com/plant/redwood"]]}, "The tongue map is a myth": {"body": ["Many people learn at school that the tongue has separate zones: sweet at the tip, salty and sour at the sides, bitter at the back. It is not true. All five basic tastes, sweet, salty, sour, bitter and umami, can be detected wherever there are taste buds, though sensitivity varies slightly.", "The myth traces back to a 1901 German paper by D. P. Hänig that measured small differences in sensitivity across the tongue. Later, the psychologist Edwin Boring’s 1942 book was read as suggesting that each taste was confined to its own area, and the idea spread through textbooks. Modern research shows that each taste bud contains receptor cells for several of the tastes."], "bg": "There are small real differences in how sensitive different areas are, which is probably how the myth began, but they are slight and do not make a map. Taste buds also exist on the soft palate and the throat, not only on the tongue.", "more": ["Taste is only part of flavour. Most of what we call flavour comes from smell, as aromas travel from the mouth up to the nose, which is why food seems bland with a blocked nose. Texture, temperature and even the sound of food also play a part.", "Taste receptors are also found beyond the mouth. Cells in the gut and airways carry some of the same receptors, and researchers are studying whether they help the body respond to food and bacteria."], "why": "Clearing up the myth is a good example of how a simple diagram can mislead for generations, and of why checking the original research matters.", "dyk": ["Your tongue also senses texture, temperature and spice-related pain.", "Umami, the savoury taste, was identified by the Japanese scientist Kikunae Ikeda in 1908.", "Babies are born with about 10,000 taste buds, and taste cells are replaced regularly throughout life."], "src": [["NIDCD — Taste disorders", "https://www.nidcd.nih.gov/health/taste-disorders"], ["Wikipedia — Taste", "https://en.wikipedia.org/wiki/Taste"]]}, "The QWERTY keyboard layout dates from the 1870s": {"body": ["The QWERTY layout, named after the first six letters on its top row, was devised in the early 1870s by Christopher Latham Sholes, inventor of the first commercially successful typewriter, and sold by Remington from 1873. Almost 150 years later it is still the standard on keyboards and phone screens in many countries.", "A popular story says Sholes arranged the letters to stop the mechanical type bars jamming, by keeping common letter pairs apart. Historians disagree about how much that explains. Some argue the layout was also shaped by the needs of telegraph operators, who were among the first users, and by changes made across the early prototypes."], "bg": "The jam story is repeated so often that it is almost treated as fact, but the evidence is thin. Comparisons between QWERTY and alternatives such as Dvorak have also been contested, and claims of big speed gains for other layouts are not well supported.", "more": ["Once typists, schools and manufacturers had all learned QWERTY, switching became costly. Economists use it as a classic example of lock-in, where an early standard sticks even when something better might exist, although some argue the case is overstated.", "Different countries use variants. French keyboards use AZERTY, and German ones swap the Y and Z in QWERTZ, adapting the same idea to local languages. On touchscreens QWERTY survives mostly out of habit, because people already know where the letters are."], "why": "QWERTY shows how early choices can shape technology for generations, and why a design does not have to be the best to last.", "dyk": ["The word “typewriter” can be typed using only the top row of letters.", "Dvorak, designed in the 1930s, puts the most common letters on the home row.", "French keyboards use AZERTY and German keyboards use QWERTZ."], "src": [["Britannica — QWERTY", "https://www.britannica.com/technology/QWERTY"], ["Wikipedia — QWERTY", "https://en.wikipedia.org/wiki/QWERTY"]]}, "Chess began in India about 1,500 years ago": {"body": ["Chess grew from a game called chaturanga, played in India by around the 6th century CE. The name means “four divisions”, after the four parts of an Indian army: infantry, cavalry, elephants and chariots, which became the pawn, knight, bishop and rook. The aim was to capture the opposing king.", "The game travelled along trade routes to Persia, where it was called shatranj, and where the phrase shah mat, roughly “the king is helpless”, gave us the word checkmate. It then spread through the Islamic world and reached Europe around the 10th century, where the rules slowly changed again."], "bg": "Dates for early chess are uncertain because the evidence is sparse, and historians still debate details of where and how it began. The 6th century is the usual starting point because the earliest clear written references appear in Persian texts from around that time.", "more": ["In medieval Europe the weak counsellor piece became the powerful queen, and the bishop gained long diagonal moves, probably in the late 15th century. This made for a much faster game, and the modern rules were largely settled by the early 1500s.", "Chess became a competitive sport, with the first official world champion, Wilhelm Steinitz, recognised in 1886. In 1997 the IBM computer Deep Blue beat the reigning champion Garry Kaspar
