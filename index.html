ov in a match, a milestone in artificial intelligence."], "why": "Chess is one of the longest-lived games in history, and tracing how it spread shows how ideas, games and even words travel across cultures.", "dyk": ["The rook is named after a Persian word for chariot.", "Chess is played by hundreds of millions of people around the world.", "The number of possible chess games is far larger than the number of atoms in the observable universe."], "src": [["Britannica — Chess", "https://www.britannica.com/topic/chess"], ["Wikipedia — Chaturanga", "https://en.wikipedia.org/wiki/Chaturanga"]]}, "A Venus flytrap counts before it snaps shut": {"body": ["The Venus flytrap (Dionaea muscipula) is a carnivorous plant native to a small area of coastal bogs in North and South Carolina. Its leaves end in a hinged trap with stiff trigger hairs on the inner surface. When an insect touches two hairs within about twenty seconds, or one hair twice, the trap snaps shut in a fraction of a second.", "The counting matters. A single touch might be a raindrop or a piece of debris, and closing the trap costs energy. Needing two signals helps the plant avoid wasting effort. Once closed, the trap tightens if the prey keeps struggling, and the plant releases digestive fluid and absorbs nutrients over several days."], "bg": "Researchers have shown that the plant’s “memory” is electrical. Each touch produces an electrical signal called an action potential, and the trap closes when a second signal arrives before the first fades. Later work suggests that calcium levels rise with each touch, so the trap behaves as if it is counting.", "more": ["Flytraps grow in poor, acidic soil with little nitrogen or phosphorus, so catching insects, mostly ants and spiders rather than flies, gives them nutrients their roots cannot find. The plant still makes most of its energy by photosynthesis.", "In the wild the plant is threatened by habitat loss and poaching, and it is listed as vulnerable by the IUCN. Poaching wild plants is a crime in North Carolina, and most plants sold today are grown commercially."], "why": "The flytrap is a striking case of a plant using signals and a form of short-term memory to make a decision, which changes how people think about what plants can do.", "dyk": ["Most of its prey is ants and spiders, not flies.", "Each trap can close only a handful of times before it dies and is replaced.", "It grows wild only in a small region of the Carolinas."], "src": [["Britannica — Venus flytrap", "https://www.britannica.com/plant/Venus-flytrap"], ["Wikipedia — Venus flytrap", "https://en.wikipedia.org/wiki/Venus_flytrap"]]}, "Fingerprints form before you are born": {"body": ["Fingerprints begin to form in the womb during the first trimester, and the ridge patterns are essentially fixed by about the 17th week of pregnancy. After that they stay the same for life, growing larger as the body grows, apart from changes caused by injury or heavy wear.", "The patterns, the loops, whorls and arches, are shaped partly by genes and partly by the random conditions in the womb, such as the position of the fingers and the flow of fluid around them. That is why even identical twins, who share the same DNA, have different fingerprints."], "bg": "No two people have ever been shown to share a fingerprint, but that claim rests on experience, not proof, since nobody has compared every print. Courts and scientists have debated how reliable matching methods are, especially for partial prints, and error rates are studied.", "more": ["Fingerprints have been used to identify people for well over a century. Sir Francis Galton described their uniqueness in the 1890s, and Scotland Yard began using them in 1901. Today, scanners use them to unlock phones and check identities.", "Why humans have fingerprints at all is still debated. They may improve grip, increase touch sensitivity or help manage moisture, and research on the grip idea has had mixed results."], "why": "Fingerprints are a classic example of a feature shaped by both biology and chance, and they show how a small detail can become a way to tell people apart.", "dyk": ["Koalas have fingerprints that are very similar to human ones.", "Fingerprints can grow back after minor damage, usually in the same pattern.", "Some people are born without fingerprints, a rare condition called adermatoglyphia."], "src": [["Britannica — Fingerprint", "https://www.britannica.com/topic/fingerprint"], ["Wikipedia — Fingerprint", "https://en.wikipedia.org/wiki/Fingerprint"]]}, "The first text message said “Merry Christmas”": {"body": ["On 3 December 1992, a 22-year-old British engineer named Neil Papworth typed “Merry Christmas” on a computer and sent it to a mobile phone belonging to Richard Jarvis, a Vodafone director who was at a party. It is widely regarded as the first SMS sent over a mobile network.", "The phone could not reply, because early handsets had no way to type messages. SMS, or Short Message Service, was designed to let networks send short notices to phones, such as voicemail alerts, and it took years before people were texting each other."], "bg": "SMS messages are limited to 160 characters because of a design decision in the 1980s. Friedhelm Hillebrand, who helped design the standard, is reported to have found that most postcards and telex messages fit in about that length, so he set the limit there.", "more": ["The first phones that let people type and send texts arrived in the mid-1990s, and texting grew rapidly once networks allowed messages between different providers around 1999. By the 2000s billions of messages were sent every day.", "Apps such as WhatsApp and iMessage have since taken over much everyday messaging, but SMS is still widely used for security codes and appointment reminders because it works on any phone without an internet connection."], "why": "The first text was a tiny message with a big legacy, and its short length shaped the way people wrote, from abbreviations to emoji.", "dyk": ["Text messages were limited to 160 characters.", "The first message was sent from a computer, not a phone.", "In 2021 a digital token of the original message was sold at auction for about €107,000."], "src": [["Wikipedia — SMS", "https://en.wikipedia.org/wiki/SMS"], ["Wikipedia — Neil Papworth", "https://en.wikipedia.org/wiki/Neil_Papworth"]]}, "Esperanto was invented to be a common second language": {"body": ["Esperanto is a language built on purpose. L. L. Zamenhof, a Polish-Jewish eye doctor, published the first book about it in 1887 under the pen name “Doktoro Esperanto”, meaning “Doctor One Who Hopes”, and the language took its name from that pseudonym. He grew up in a town where people spoke several languages and often distrusted each other, and he hoped a shared neutral language would help communities understand one another.", "The language is designed to be easy to learn. Its grammar has sixteen basic rules with no exceptions, nouns end in -o, adjectives in -a and adverbs in -e, and words are built by adding prefixes and suffixes to roots drawn mainly from Romance and Germanic languages, with some Slavic ones."], "bg": "Estimates of how many people speak Esperanto vary widely, from tens of thousands of fluent speakers to a couple of million who have learned some, because there is no census. A small number of people, called denaskuloj, have grown up speaking it as a native language.", "more": ["The Esperanto movement has held its own world congresses since 1905, and the language has books, music, magazines and a Wikipedia of its own. It was suppressed in the 20th century, including in Nazi Germany and the Soviet Union under Stalin, partly because of its international character.", "Esperanto never became the world’s common second language as Zamenhof hoped, and English has largely taken that role. But it remains the most widely spoken planned language, and enthusiasts still teach and use it in many countries."], "why": "Esperanto is a fascinating experiment in whether a language can be designed to bring people together, and it helps explain how real languages are built.", "dyk": ["The word Esperanto means “one who hopes”.", "Its flag is green with a white square and a green star in the corner.", "People who learned Esperanto as a first language are called denaskuloj."], "src": [["Britannica — Esperanto", "https://www.britannica.com/topic/Esperanto"], ["Wikipedia — Esperanto", "https://en.wikipedia.org/wiki/Esperanto"]]}, "Some bamboo can grow almost a metre in a day": {"body": ["Bamboo is a giant grass, and some species are the fastest-growing plants on Earth. Certain giant timber bamboos have been recorded growing around 90 cm in a single 24-hour period, which works out at roughly a millimetre every minute.", "The secret is in the way it grows. A bamboo shoot emerges from the ground already close to its full width, with all its segments packed inside. Each segment then lengthens at the same time, like a telescope extending, instead of all the growth happening at the tip, so a shoot can reach its full height in a few months."], "bg": "The figure of about 91 cm in a day is a record cited for a Japanese timber bamboo, and it was measured under ideal conditions. Most bamboos grow more slowly, though many species still add several centimetres to tens of centimetres a day in their growing season.", "more": ["Bamboo spreads through underground stems called rhizomes, so a whole grove can be one connected plant. Many species flower only once every 60 to 120 years and then die back, producing huge seed crops that can cause rodent booms in some regions.", "Because it grows fast and regrows after cutting, bamboo is widely used for building, scaffolding, furniture, paper and food. Some bamboo has a tensile strength for its weight comparable with some steels, though that depends on how it is measured."], "why": "Bamboo’s speed makes it a promising renewable material, since a grove can be harvested again and again without replanting.", "dyk": ["Giant pandas eat mainly bamboo.", "Bamboo is a grass, not a tree.", "Scaffolding in Hong Kong is still often made of bamboo."], "src": [["Britannica — Bamboo", "https://www.britannica.com/plant/bamboo"], ["Wikipedia — Bamboo", "https://en.wikipedia.org/wiki/Bamboo"]]}, "The Pacific Ocean is larger than all of Earth’s land combined": {"body": ["The Pacific is the largest and deepest ocean on Earth, covering about 165 million square kilometres, more than the combined area of all the land on the planet, which is roughly 149 million. It holds about half of the open ocean’s water and stretches from the Arctic in the north to the Southern Ocean around Antarctica, and from Asia and Australia in the west to the Americas in the east.", "Its name comes from the Portuguese explorer Ferdinand Magellan, who called it Mar Pacífico, “peaceful sea”, after crossing it in calm weather in 1520. In other respects it is anything but peaceful: the Pacific is ringed by the Ring of Fire, where most of the world’s earthquakes and active volcanoes occur."], "bg": "Exact figures depend on where the borders with the Southern and Arctic Oceans are drawn, so sources quote slightly different areas. In every case, though, the Pacific is larger than all of the land put together.", "more": ["The Pacific contains the deepest place known on Earth, the Challenger Deep in the Mariana Trench, at roughly 10,900 metres below the surface. It also holds thousands of islands, more than any other ocean, from tiny coral atolls to large volcanic islands such as Hawaii.", "For thousands of years Pacific peoples crossed it in canoes, using the stars, swells and birds to navigate. Their voyages settled islands across a region larger than any other area of human settlement."], "why": "The Pacific shapes the world’s weather, including El Niño and La Niña, and changes in it affect fisheries, storms and rainfall far from its shores.", "dyk": ["The Pacific is getting slightly smaller, while the Atlantic is widening.", "It is about one and a half times the size of the Atlantic.", "The Mariana Trench is deeper than Mount Everest is tall."], "src": [["Britannica — Pacific Ocean", "https://www.britannica.com/place/Pacific-Ocean"], ["Wikipedia — Pacific Ocean", "https://en.wikipedia.org/wiki/Pacific_Ocean"]]}, "Mount Everest is still rising": {"body": ["Mount Everest, on the border of Nepal and Tibet, is still getting higher. The Indian tectonic plate is moving north at a few centimetres a year and pushing into the Eurasian plate, forcing the crust upwards. The Himalayas, including Everest, are rising by roughly 4 to 5 millimetres a year.", "Rising is not the same as growing taller by that much. Erosion by ice, wind and rivers wears the peaks down at the same time, so the net change is small and hard to measure. Everest’s official height was set at 8,848.86 metres in 2020 by a joint survey by Nepal and China."], "bg": "Measuring a mountain is harder than it sounds. Surveyors have to decide where sea level is, how to count the snow cap on the summit and how to correct for gravity, so the number changes with the method. The 2020 figure was about 86 centimetres higher than the 8,848 metres used for decades.", "more": ["The collision that built the Himalayas began roughly 50 million years ago, when the Indian plate ran into Asia. Both plates are too buoyant to sink, so the crust crumpled upwards, forming the highest mountain range on Earth and the Tibetan Plateau. Fossils of sea creatures are found near the summit, because the rocks began life on an ocean floor.", "The 2015 Nepal earthquake showed that the same forces are still active. Some measurements suggested that Kathmandu moved about a metre or more southwards, although Everest itself seems to have been little changed."], "why": "The mountain’s slow rise is a reminder that Earth’s surface is always on the move, and measuring it helps scientists understand earthquakes in one of the most seismically active regions in the world.", "dyk": ["The summit of Everest is made of marine limestone containing fossils.", "Everest is named after Sir George Everest, a British surveyor general of India.", "It is called Sagarmatha in Nepal and Chomolungma in Tibet."], "src": [["Britannica — Mount Everest", "https://www.britannica.com/place/Mount-Everest"], ["Wikipedia — Mount Everest", "https://en.wikipedia.org/wiki/Mount_Everest"]]}, "The smallest bone in your body is in your ear": {"body": ["The stapes, or stirrup bone, is the smallest bone in the human body. It is only about three millimetres long and weighs a few milligrams. It sits deep inside the middle ear, as one of a chain of three tiny bones that carry sound.", "When a sound wave hits the eardrum, the drum vibrates. The vibrations pass along the malleus (hammer), the incus (anvil) and finally the stapes, whose flat base presses on a membrane called the oval window, the doorway into the fluid-filled inner ear. There the vibrations are turned into nerve signals that the brain reads as sound."], "bg": "The three bones work as a pressure amplifier. Together with the difference in size between the large eardrum and the small oval window, the chain boosts sound pressure many times over, which helps sound pass from air into the fluid of the inner ear instead of bouncing off.", "more": ["If the stapes becomes stuck in place, usually through a condition called otosclerosis in which bone grows abnormally, hearing is gradually lost. Since the 1950s surgeons have been able to replace the stuck bone with a tiny prosthesis in an operation called a stapedectomy, which restores hearing in most patients.", "The hammer and anvil of mammals evolved from bones that once formed part of the jaw joint in reptile ancestors, and fossils of early mammal relatives show the stages of that change. A stapes-like bone is older still: birds and reptiles use a similar one to hear."], "why": "A bone this small plays an essential role in hearing, and its surgical replacement is a great example of how understanding anatomy can restore a sense.", "dyk": ["Its name is Latin for “stirrup”, which it resembles.", "The femur in the thigh is the longest bone in the body.", "The three ear bones are together called the ossicles."], "src": [["Britannica — Stapes", "https://www.britannica.com/science/stapes"], ["Wikipedia — Stapes", "https://en.wikipedia.org/wiki/Stapes"]]}, "The first item scanned with a barcode was a pack of chewing gum": {"body": ["On 26 June 1974, a cashier at a Marsh supermarket in Troy, Ohio, scanned a ten-pack of Wrigley’s Juicy Fruit chewing gum, the first retail product known to have been sold using a barcode scanner. The pack is now held by the Smithsonian’s National Museum of American History.", "A barcode is a pattern of bars and spaces that a scanner reads with a laser and turns into a number. The system used in the United States, the Universal Product Code (UPC), was chosen by the grocery industry in 1973 so that stores and manufacturers could share one standard, speeding up checkouts and stock control."], "bg": "The idea goes back to 1949, when Norman Joseph Woodland and Bernard Silver began working on a way to capture product information automatically. Woodland is said to have extended Morse code dots and dashes into lines while sitting on a beach. Their patent was granted in 1952, but it took lasers and cheap computers to make the idea practical.", "more": ["George Laurer, an IBM engineer, designed the rectangular UPC symbol that was chosen as the standard. The European version, the EAN, followed in the late 1970s, and today the combined system is managed by an organisation called GS1.", "Retailers were slow to adopt barcodes at first, partly because scanners were expensive and shoppers worried about prices no longer being marked on items. Over the years they spread to nearly every kind of product, and billions of scans now happen every day. Newer codes such as QR codes can hold much more information."], "why": "Barcodes quietly made modern retail, shipping and hospital supplies faster and more accurate, and they show how a small standard can change the way a whole industry works.", "dyk": ["The first barcode patent was granted in 1952.", "Barcodes are also used on library books, parcels and hospital wristbands.", "QR codes were invented in Japan in 1994 to track car parts."], "src": [["Britannica — Bar code", "https://www.britannica.com/technology/bar-code"], ["Wikipedia — Barcode", "https://en.wikipedia.org/wiki/Barcode"]]}, "Chocolate began as a bitter drink": {"body": ["Chocolate begins with the cacao tree, native to the rainforests of the Americas. Cacao use goes back at least 3,000 years in Mesoamerica, and evidence from Ecuador suggests people were using it more than 5,000 years ago. For most of its history chocolate was a drink: the seeds were roasted, ground and mixed with water, often with chilli, vanilla or other spices.", "The Maya and later the Aztecs prized it. Cacao beans were used as a form of money, and a frothy chocolate drink was served at ceremonies and to nobles and warriors. It was bitter, nothing like the sweet bars we know today."], "bg": "The origins are still being researched. Studies of residues on ancient pots point to cacao use in Ecuador earlier than in Mesoamerica, which suggests the tree may have been first domesticated in South America, although this is debated.", "more": ["Spanish explorers brought cacao to Europe in the 16th century, where it was sweetened with sugar and served hot, becoming fashionable at royal courts. The solid bar is a 19th-century invention: in 1828 the Dutch chemist Coenraad van Houten developed a press that separated cocoa butter from cocoa powder, and in 1847 the British firm Fry’s made the first moulded bar.", "Today most of the world’s cocoa is grown in West Africa, especially in Côte d’Ivoire and Ghana, often by smallholder farmers. Concerns about low incomes, child labour and deforestation have led to certification schemes and efforts to make the supply chain fairer."], "why": "Chocolate’s journey shows how a food can be transformed as it travels between cultures, and it raises questions about who benefits from the world’s favourite sweet.", "dyk": ["The tree’s scientific name, Theobroma cacao, means “food of the gods”.", "The Aztecs used cacao beans as money.", "Cocoa butter melts at close to body temperature, which is why chocolate melts in your mouth."], "src": [["Britannica — Chocolate", "https://www.britannica.com/topic/chocolate"], ["Wikipedia — Chocolate", "https://en.wikipedia.org/wiki/Chocolate"]]}, "Wombats make cube-shaped droppings": {"body": ["Wombats, stocky marsupials from Australia, are the only known animals that produce cube-shaped droppings, with around 80 to 100 left each night. Researchers found that the shape is made in the last stretch of the intestine, which has stiff and stretchy regions. As the droppings dry and are squeezed along, those regions shape them into cubes.", "The cubes are useful. Wombats leave their droppings on logs, rocks and tufts of grass to mark territory and send messages to other wombats. The flat faces stop the droppings from rolling away, so the message stays where it is put."], "bg": "The explanation was published in 2018 by a team led by Patricia Yang and David Hu at the Georgia Institute of Technology, who studied the intestines of wombats that had died in road accidents. Their work showed that the cube shape comes from the elastic properties of the intestine wall.", "more": ["Wombats digest slowly, taking around two weeks to process their food, which lets them extract as much water as possible from the dry grass they eat. The droppings are very dry, which is important for shaping and means they keep their form for a long time.", "The researchers suggested that a process that makes cubes without a mould could inspire new ways of manufacturing objects with square corners from soft materials."], "why": "The finding is a good example of curiosity about an odd detail leading to real science about how soft tissues shape materials, with possible uses in engineering.", "dyk": ["A wombat’s pouch faces backwards, which stops soil from getting in when it digs.", "Wombats can run at up to about 40 km/h in short bursts.", "A wombat’s rump is made of tough cartilage that it uses to block its burrow against predators."], "src": [["Britannica — Wombat", "https://www.britannica.com/animal/wombat"], ["Wikipedia — Wombat", "https://en.wikipedia.org/wiki/Wombat"]]}, "One fungus in Oregon covers about 10 square kilometres": {"body": ["Deep in the Malheur National Forest in the Blue Mountains of Oregon lives what is often called the largest known living organism by area: a honey fungus, Armillaria ostoyae, that covers about 9.6 square kilometres of forest, roughly 1,600 football fields. Most of it is hidden underground.", "What you see are only the honey-coloured mushrooms that sprout in autumn. The fungus itself is a vast network of threads called mycelium and black, rootlike strands called rhizomorphs, spreading through soil, wood and roots. It is thought to have grown from a single spore over many centuries."], "bg": "Its age is an estimate, commonly given as somewhere between about 2,000 and 8,000 years, based on how fast the fungus is known to grow. Other contenders, such as the Pando aspen colony in Utah, may be heavier, so “largest” depends on whether you measure area or weight.", "more": ["Armillaria is both a parasite and a decomposer. It spreads from tree to tree through its rhizomorphs and can kill conifers by attacking their roots and wood, a problem known as root rot. In managed forests it causes real damage, and forestry researchers study how to control it.", "It is also an important recycler in natural forests, breaking down dead wood and returning nutrients to the soil. The decaying wood it colonises can sometimes glow faintly, an effect known as foxfire."], "why": "The fungus shows that the biggest living things are not always the most visible, and that much of the life of a forest happens out of sight, underground.", "dyk": ["Honey fungi get their name from the colour of their mushrooms.", "The Oregon fungus was first reported in 1998 after trees began dying in the forest.", "Honey mushrooms can be eaten when cooked, but they must be identified carefully."], "src": [["Wikipedia — Armillaria ostoyae", "https://en.wikipedia.org/wiki/Armillaria_ostoyae"], ["Wikipedia — Humongous fungus", "https://en.wikipedia.org/wiki/Humongous_fungus"]]}, "Most of the seafloor had not been mapped to modern standards until recently": {"body": ["Despite centuries of exploration, most of the world’s seafloor has still not been mapped in detail. Seabed 2030, a project of the Nippon Foundation and GEBCO, the General Bathymetric Chart of the Oceans, aims to produce a complete map of the ocean floor by 2030. In recent reports only about a quarter of the seafloor had been mapped to modern standards.", "Satellites can estimate the shape of the seabed from tiny bumps in the sea surface, but only at a coarse resolution of several kilometres. High-resolution maps need ships with sonar, which measures how long sound takes to bounce back from the bottom. Because the oceans are enormous, mapping them by ship alone takes a very long time."], "bg": "The percentage mapped has been rising as more data is collected and shared, so the exact figure depends on the year of the report. What counts as “mapped” is also about resolution: the standard is a grid of about 100 metres in deep water, much finer than satellite estimates.", "more": ["Seabed 2030 gathers data from research ships, commercial vessels, governments and companies, and some comes from ordinary ships carrying simple sonar. Autonomous boats and underwater robots are being used to reach remote areas.", "Better maps matter. They help ships navigate safely, show where undersea cables can be laid, reveal how tsunamis may travel and help scientists find habitats such as seamounts where wildlife gathers. The shape of the seabed also affects ocean currents and climate."], "why": "Mapping the seafloor is a basic step in understanding an ocean that covers most of the planet and influences climate and life, yet remains less known in detail than the surfaces of the Moon and Mars.", "dyk": ["Satellite maps of the seabed are made from tiny differences in sea-surface height caused by gravity.", "The deepest known point, the Challenger Deep, is about 10,900 metres down.", "Sonar maps the seabed by timing sound echoes."], "src": [["Seabed 2030", "https://seabed2030.org"], ["Wikipedia — Seabed 2030", "https://en.wikipedia.org/wiki/Seabed_2030"]]}, "Canada has the longest coastline of any country": {"body": ["Canada has the longest coastline of any country, at about 243,000 kilometres, if you count the coasts of its many islands. That is long enough to wrap around the Earth more than six times. It borders three oceans: the Atlantic to the east, the Pacific to the west and the Arctic to the north.", "Most of that length comes from islands. Canada has an enormous Arctic archipelago of thousands of islands, many of them large and deeply cut by inlets and fjords. Without the islands, the mainland coast would be a fraction of the total."], "bg": "Coastline length is not a fixed number. The measured length depends on the scale of the map and how closely you trace every inlet and bay, an effect known as the coastline paradox. Different countries measure differently, so figures vary, but Canada comes out on top under most methods.", "more": ["The Arctic coast is frozen for much of the year, and the Northwest Passage through the islands has become more accessible as sea ice thins. This has increased interest in shipping, resources and sovereignty questions in the region.", "Canada’s coasts are very varied: rocky shores and fjords in British Columbia, tidal flats and some of the highest tides in the world in the Bay of Fundy, and the cold, icy waters of Labrador and the Arctic. Most Canadians live well inland, but coastal communities depend heavily on fishing and shipping."], "why": "Canada’s coastline shapes its economy, climate and culture, and its length is a good way to see how hard it can be to measure something as simple as the edge of a country.", "dyk": ["The coastline paradox shows that coastlines get longer the more closely you measure them.", "The Bay of Fundy has tides of up to around 16 metres.", "Canada is the second-largest country in the world by area."], "src": [["Britannica — Canada", "https://www.britannica.com/place/Canada"], ["Wikipedia — Canada", "https://en.wikipedia.org/wiki/Canada"]]}, "You blink about 15 to 20 times a minute": {"body": ["The average adult blinks about 15 to 20 times a minute, although the figure varies. Each blink is quick, lasting roughly a tenth to a third of a second, and each one spreads a thin film of tears across the front of the eye, keeping it moist, clean and clear.", "Most blinks are automatic, controlled by the brain without conscious thought. Others are deliberate, and some are reflexes, such as the blink that happens when something flies towards your eye. Blinking rates change with what you are doing: people blink less when concentrating hard, for example when reading or looking at a screen, and more when talking."], "bg": "The figure of 15 to 20 is an average at rest. Studies have found that rates can fall by half or more during screen use, which is one reason long screen sessions can leave eyes feeling dry and tired. Blinks also tend to happen at natural pauses in speech, reading or attention, as if the brain uses them as tiny breaks.", "more": ["The tear film has three layers: an oily outer layer that slows evaporation, a watery middle layer and a mucus layer that helps it cling to the eye. Blinking spreads all three evenly and pushes tears towards drainage channels at the inner corner of the eye.", "Babies blink much less than adults, and some conditions change blinking patterns. Doctors sometimes look at blink rate because it can be reduced in conditions such as Parkinson’s disease and increased by stress or tiredness."], "why": "Understanding blinking explains why long periods on screens leave eyes dry, and why simple habits such as taking breaks and blinking fully can help.", "dyk": ["Most people blink millions of times a year without noticing.", "Babies blink much less often than adults.", "A blink closes the eyelid in a fraction of a second."], "src": [["Wikipedia — Blinking", "https://en.wikipedia.org/wiki/Blinking"], ["Wikipedia — Tears", "https://en.wikipedia.org/wiki/Tears"]]}, "The Apollo Moon landings were guided by a tiny computer": {"body": ["The Apollo Guidance Computer (AGC) helped navigate the Apollo spacecraft to the Moon and back. Built at MIT’s Instrumentation Laboratory, it had about 2,048 words of erasable memory (roughly 4 kilobytes) and 36,864 words of fixed memory (roughly 72 kilobytes), and carried out tens of thousands of instructions per second. A modern smartphone has millions of times more memory and is vastly faster.", "Despite its size, the AGC did a huge amount. It calculated the spacecraft’s position, controlled the engines and helped land the lunar module on the Moon. Astronauts talked to it using a simple keypad and display called the DSKY, entering two-digit codes for verbs and nouns to start programs."], "bg": "Comparisons with phones are fun but can mislead: the AGC was built for one job and was extremely reliable. It used a clever kind of memory, core rope, in which programs were literally woven into wires threaded through magnetic cores, which made the software impossible to change once it was made.", "more": ["During the first Moon landing in 1969, the AGC flashed “1202” and “1201” alarms as Apollo 11 descended. The computer was overloaded with tasks, but its design let it drop less important ones and keep running the vital ones, and ground controllers judged that the landing could continue.", "Margaret Hamilton led the MIT team that wrote the onboard flight software. Her team’s approach to priority scheduling and error handling was influential, and she is credited with helping to shape the field of software engineering, a term she helped popularise."], "why": "The AGC shows that careful design and reliability can matter more than raw power, and it paved the way for the use of computers in safety-critical systems.", "dyk": ["The AGC was one of the first computers to use integrated circuits.", "Its software was woven by hand into core rope memory, nicknamed “LOL memory” for little old ladies.", "The Apollo 11 flight software has since been published online."], "src": [["Wikipedia — Apollo Guidance Computer", "https://en.wikipedia.org/wiki/Apollo_Guidance_Computer"], ["Wikipedia — Margaret Hamilton", "https://en.wikipedia.org/wiki/Margaret_Hamilton_(software_engineer)"]]}, "Tea was first grown and drunk in China": {"body": ["Tea comes from the leaves of Camellia sinensis, an evergreen shrub native to southern China and neighbouring regions. Tradition says it was discovered around 2737 BCE by the legendary emperor Shennong, when leaves blew into his pot of boiling water. That is a legend, but tea has certainly been grown and drunk in China for thousands of years.", "Tea spread slowly. Buddhist monks carried it to Japan, traders took it along the Silk Road and by sea, and it reached Europe in the 1600s through Portuguese and Dutch merchants. It became hugely popular in Britain, and was later grown in India and Sri Lanka, sometimes at great cost to local workers and communities."], "bg": "The story of Shennong is folklore and cannot be verified, so historians prefer written records and archaeology. Chinese texts mention tea from around the Han dynasty, and tea leaves have been found in a tomb from the 2nd century BCE. Experts still debate exactly where and when it was first cultivated.", "more": ["All true teas, whether white, green, oolong or black, come from the same plant. The differences come from how the leaves are processed: green tea is heated to stop oxidation, black tea is fully oxidised and oolong falls in between. Drinks called herbal teas come from other plants.", "Tea is one of the most widely drunk beverages in the world after water, and production is led by China and India. The tea trade also helped shape history, from the Boston Tea Party in 1773 to the Opium Wars between Britain and China."], "why": "Tea’s journey from a Chinese shrub to a global habit shows how a single plant can shape trade, culture, everyday rituals and politics across continents.", "dyk": ["The English word “tea” comes from the Hokkien word te, while “cha” comes from Mandarin and Cantonese.", "Black, green and white tea all come from the same plant.", "Tea contains caffeine, usually less per cup than coffee."], "src": [["Britannica — Tea", "https://www.britannica.com/topic/tea"], ["Wikipedia — Tea", "https://en.wikipedia.org/wiki/Tea"]]}, "You shed tens of thousands of skin cells every minute": {"body": ["Your skin is constantly renewing itself. The outer layer, the epidermis, is made of cells that start deep down and slowly move upwards over about four weeks, flattening and hardening as they go. When they reach the surface they die and flake off, and the body sheds tens of thousands of these cells every minute.", "This process, called desquamation, is normally invisible. The barrier of dead cells protects the body from germs, water loss and ultraviolet light, and replacing it keeps it in good condition. Over a year the body sheds an estimated half a kilogram to a kilogram of skin."], "bg": "The figure of 30,000 to 40,000 a minute is widely repeated, but exact numbers vary with age, health and body area. A related myth is that house dust is mostly dead skin. Studies show that dust is a mix of soil, fibres and other particles, with skin as only one part of it.", "more": ["The epidermis has several layers. Cells begin in the basal layer, where stem cells divide, then move through layers where they make a tough protein called keratin, until they reach the outermost layer, the stratum corneum, which is made of flat, dead cells.", "Skin renewal slows with age, which is one reason older skin heals more slowly and looks thinner. Products that exfoliate speed up shedding for a while, but dermatologists warn that doing it too aggressively can damage the skin barrier."], "why": "Knowing how skin renews helps explain how wounds heal, why skin changes with age and why gentle care matters.", "dyk": ["Skin is the body’s largest organ.", "The outer layer of skin takes about a month to renew.", "Most household dust is not mainly dead skin."], "src": [["Britannica — Skin", "https://www.britannica.com/science/skin"], ["Wikipedia — Desquamation", "https://en.wikipedia.org/wiki/Desquamation"]]}, "The first computer mouse was made of wood": {"body": ["The first computer mouse was built in the early 1960s by Douglas Engelbart and his colleague Bill English at the Stanford Research Institute. It was a small wooden block with a button on top and two metal wheels underneath, one for each direction. It was patented in 1970 as an “X-Y position indicator for a display system”.", "It was shown to the public in 1968 in a famous presentation, later nicknamed “the mother of all demos”, in which Engelbart showed video conferencing, hypertext links and collaborative editing. The mouse got its name because its cord looked like a tail."], "bg": "Other pointing devices existed, and Engelbart’s team tested several, including light pens and joysticks. They found the mouse was faster and more accurate. The patent was held by SRI, and Engelbart reportedly made little money from it before it expired and mice became common.", "more": ["The mouse stayed a laboratory device for years until Xerox PARC built it into the Alto computer in the 1970s. Apple made it popular with the Lisa in 1983 and the Macintosh in 1984, and Microsoft Windows later made it a standard accessory for personal computers.", "Mice have changed a lot. Ball mice were replaced by optical and laser versions that track movement with light. Touchpads and touchscreens now rival the mouse, but it remains common for design, gaming and office work."], "why": "The mouse helped make computers approachable to people who did not know command languages, an idea that shaped the way almost everyone uses technology today.", "dyk": ["The original mouse had one button and two wheels.", "Engelbart’s 1968 demonstration also showed an early video call.", "Apple’s 1984 Macintosh brought the mouse to a mass audience."], "src": [["Britannica — Douglas Engelbart", "https://www.britannica.com/biography/Douglas-Engelbart"], ["Wikipedia — Computer mouse", "https://en.wikipedia.org/wiki/Computer_mouse"]]}, "The Mona Lisa became world famous after it was stolen": {"body": ["The Mona Lisa was painted by Leonardo da Vinci in the early 1500s and has hung in the Louvre in Paris since the French Revolution. Today it is one of the most famous paintings in the world, but that was not always so. It became a global celebrity largely because of a theft.", "On 21 August 1911, a former Louvre worker, Vincenzo Peruggia, hid in the museum and walked out with the painting under his coat. The theft was discovered the next day, and newspapers around the world covered the story. The painting stayed missing for more than two years before Peruggia tried to sell it to an art dealer in Florence and was caught. It returned to the Louvre in 1914."], "bg": "Peruggia claimed he stole it to return it to Italy, believing Napoleon had taken it, though in fact Leonardo brought it to France himself. He received a short prison sentence. Historians say the publicity from the theft turned a respected work into a global icon.", "more": ["Leonardo worked on the portrait for years, using thin layers of translucent paint in a technique known as sfumato, which softens outlines and gives the face its subtle expression. The sitter is generally thought to be Lisa Gherardini, wife of a Florentine silk merchant.", "Today the painting is protected by bulletproof glass and attracts millions of visitors a year. It is smaller than many people expect, at about 77 by 53 centimetres."], "why": "The story shows how fame can be made by events outside an artwork itself, and how a single news story can change a painting’s place in popular culture.", "dyk": ["The Louvre closed for a week after the theft.", "The painting is about 77 centimetres tall.", "Its Italian name is La Gioconda."], "src": [["Britannica — Mona Lisa", "https://www.britannica.com/topic/Mona-Lisa-painting"], ["Wikipedia — Mona Lisa", "https://en.wikipedia.org/wiki/Mona_Lisa"]]}, "Bats are the only mammals capable of true flight": {"body": ["Bats are the only mammals capable of true, sustained flight. Other mammals, such as flying squirrels and sugar gliders, can glide, but only bats can flap their wings to gain height and manoeuvre in the air. Their wings are modified hands: four long finger bones support a thin, stretchy membrane of skin, with the thumb left free as a small claw.", "This hand-wing gives bats extraordinary agility. They can turn sharply, hover and even scoop up insects with their wing membranes. Many bats hunt at night using echolocation, sending out high-pitched calls and listening to the echoes to build a picture of their surroundings."], "bg": "Bats are not flying mice or birds. They form their own group of mammals, the Chiroptera, whose name means “hand-wing”. Not all bats use echolocation: large fruit bats mostly rely on eyesight and smell. And bats are not blind, since many see well.", "more": ["There are more than 1,400 species of bat, making up roughly a fifth of all mammal species. They live on every continent except Antarctica and eat insects, fruit, nectar, fish and, in a few cases, blood. Many plants rely on bats to pollinate their flowers or spread their seeds, including the agave used to make tequila.", "Insect-eating bats are powerful pest controllers, with some colonies eating tonnes of insects each night. Yet many species are threatened by habitat loss, wind turbines and diseases such as white-nose syndrome in North America."], "why": "Bats pollinate plants, spread seeds and control insects, so protecting them supports ecosystems and agriculture, and studying how they fly and sense the world inspires new technology.", "dyk": ["Bats make up about a fifth of all mammal species.", "The smallest bat, the bumblebee bat, weighs about as much as a small coin.", "Some bats can live for over 30 years."], "src": [["Britannica — Bat", "https://www.britannica.com/animal/bat-mammal"], ["Wikipedia — Bat", "https://en.wikipedia.org/wiki/Bat"]]}, "A grove of aspens in Utah is a single organism": {"body": ["In Utah’s Fishlake National Forest stands a grove of quaking aspens called Pando, Latin for “I spread”. It looks like a forest of about 47,000 separate trees, but the trunks are all stems of a single organism, connected by one enormous underground root system. All the stems are genetically identical clones.", "Pando covers about 43 hectares and is estimated to weigh around 6,000 tonnes, making it one of the heaviest known organisms. Aspens spread by sending up new shoots from their roots, so one tree can slowly become a whole grove. Each stem lives for a few decades, but the root system persists."], "bg": "How old Pando is has been hard to pin down. Estimates range from a few thousand years to far more, and claims of up to 80,000 years are widely doubted. There is also some debate about whether every stem is part of one individual, although genetic studies strongly support it.", "more": ["Pando is in trouble. Studies show that few young stems are surviving, because deer and cattle graze on new shoots, and parts of the clone are thinning. Fences and other protections have been used to give young aspens a chance to grow.", "Pando is sometimes compared with the Oregon honey fungus, another giant organism. The fungus is larger by area, while Pando is often described as the heaviest, but both show that the largest living things are not always the tallest."], "why": "Pando shows that what looks like many individuals can be one living thing, and it is an urgent example of why protecting forests from overgrazing and climate stress matters.", "dyk": ["Pando means “I spread” in Latin.", "It is also called the Trembling Giant.", "Its leaves flutter in the slightest breeze, which is how quaking aspen got its name."], "src": [["Wikipedia — Pando (tree)", "https://en.wikipedia.org/wiki/Pando_(tree)"], ["Wikipedia — Quaking aspen", "https://en.wikipedia.org/wiki/Quaking_aspen"]]}, "Phytoplankton make about half of Earth’s oxygen": {"body": ["Phytoplankton are microscopic organisms that drift in the sunlit surface layers of oceans, lakes and rivers. Like plants, they use sunlight, water and carbon dioxide to make food and release oxygen through photosynthesis. Scientists estimate that they produce roughly half of the oxygen in Earth’s atmosphere, with land plants producing most of the rest.", "The main groups include diatoms, dinoflagellates and cyanobacteria. Each is tiny, but there are so many of them that blooms can cover thousands of square kilometres and can be seen from space as swirls of green and blue in satellite images."], "bg": "The “half of our oxygen” figure is a rough estimate and is often misunderstood. Much of the oxygen produced is used up again when organisms, including the plankton themselves, respire and decay, so the net contribution to the air we breathe is smaller. Even so, phytoplankton are a major part of the global oxygen and carbon cycles.", "more": ["Phytoplankton sit at the base of most marine food webs. They are eaten by zooplankton such as krill, which are eaten by fish, seabirds and whales, so changes in their numbers ripple up to fisheries. They also pull carbon dioxide out of the atmosphere, and when they die some of that carbon sinks to the deep sea.", "Satellites track phytoplankton by measuring the chlorophyll in the water. Scientists are studying how warming, ocean acidification and changes in nutrient supply affect them, because a shift could affect both marine life and the climate."], "why": "Phytoplankton link the ocean, the atmosphere and the food we eat, so understanding them helps predict how fisheries and the climate may change.", "dyk": ["Phytoplankton blooms can be seen from space.", "Cyanobacteria, once called blue-green algae, helped create Earth’s oxygen-rich atmosphere billions of years ago.", "Krill feed on phytoplankton and are in turn eaten by whales."], "src": [["NASA Earth Observatory — Phytoplankton", "https://earthobservatory.nasa.gov/features/Phytoplankton"], ["Wikipedia — Phytoplankton", "https://en.wikipedia.org/wiki/Phytoplankton"]]}, "The Sahara was once green": {"body": ["The Sahara, the largest hot desert in the world, was not always dry. Between roughly 11,000 and 5,000 years ago, in a period called the African Humid Period, much of North Africa had grasslands, lakes and rivers. Fossils, rock paintings and ancient lake beds show that hippos, crocodiles, giraffes and cattle herders once lived in what is now desert.", "The cause was a slow change in Earth’s orbit. A wobble in the tilt of Earth’s axis increased summer sunshine in the Northern Hemisphere, strengthening the African monsoon and pushing rain far north into the Sahara. As the orbital pattern shifted back, the rains retreated."], "bg": "The change from green to desert was not a single event. Evidence suggests that the drying happened faster in some places than in others, and plants and people may have helped amplify it. Scientists still debate how quickly it happened and what role vegetation and dust played.", "more": ["Rock art in places such as Tassili n’Ajjer in Algeria shows swimmers, cattle and giraffes, painted when the region was wetter. Early herders and fishers lived near lakes, including a huge one that once filled the Chad basin, known as Lake Mega-Chad.", "As the desert grew, people moved to places with water, including the Nile valley. Some historians link the concentration of people along the Nile to the rise of ancient Egyptian civilisation."], "why": "The green Sahara shows how a small change in Earth’s orbit can transform a landscape, and it gives scientists a natural experiment for understanding rainfall and climate change.", "dyk": ["The Sahara covers an area about the size of the United States.", "Ancient rock paintings in the Sahara show swimmers and giraffes.", "Dust from the Sahara helps fertilise the Amazon rainforest."], "src": [["Britannica — Sahara", "https://www.britannica.com/place/Sahara-desert-Africa"], ["Wikipedia — African humid period", "https://en.wikipedia.org/wiki/African_humid_period"]]}, "A day on Mars is about 37 minutes longer than a day on Earth": {"body": ["A day on Mars is very close to a day on Earth. Mars takes about 24 hours and 37 minutes to rotate once relative to the stars, and about 24 hours and 40 minutes from one noon to the next. A Martian day is called a sol, and it is a little under 40 minutes longer than a 24-hour Earth day.", "The similarity is a coincidence, but a useful one for mission teams. Mars is tilted by about 25 degrees, close to Earth’s 23.5, so it also has seasons, although each lasts almost twice as long because a Martian year is about 687 Earth days."], "bg": "The exact figure depends on how a day is defined. The 24 hours 37 minutes figure is the rotation period measured against distant stars, while the sol, from one noon to the next, is about 24 hours 40 minutes. That is why sources quote slightly different differences from an Earth day.", "more": ["Teams working on some NASA rovers have lived on Mars time to match the working day of their robot. Their schedule slid by about 40 minutes later each day compared with Earth time, and they used special watches and sol numbering to keep track.", "The Martian day affects everything from solar power to temperature. Mars has a thin atmosphere and swings between mild days and extremely cold nights. Future astronauts would need to adapt to the slightly longer day, and studies suggest people can adjust well."], "why": "Knowing the length of a Martian day is essential for running rovers and planning human missions, and it shows how much Mars resembles Earth in some ways and how different it is in others.", "dyk": ["A Martian year lasts about 687 Earth days.", "Mars’s axial tilt is about 25 degrees, close to Earth’s.", "Some mission teams wore watches that ran on Martian time."], "src": [["NASA — Mars facts", "https://science.nasa.gov/mars/facts/"], ["Wikipedia — Timekeeping on Mars", "https://en.wikipedia.org/wiki/Timekeeping_on_Mars"]]}, "Your liver can grow back": {"body": ["The liver is the only major internal organ that can regrow itself. If part of it is removed or damaged, the remaining liver cells can divide and rebuild the lost tissue, and the organ can grow back towards its original size within weeks to months. This ability is why living donors can give a portion of their liver to someone else, and both livers can regrow.", "The liver is the body’s largest internal organ, weighing around 1.5 kilograms in adults. It filters blood from the gut, makes bile for digesting fats, stores energy and breaks down many drugs and toxins. Because it does so many jobs, being able to repair itself is especially valuable."], "bg": "Regeneration has limits. The liver can recover from surgery or short-term injury, but long-term damage, such as cirrhosis from alcohol, viral hepatitis or fatty liver disease, replaces healthy tissue with scar tissue that cannot regrow. After partial removal the liver regains its volume, but not always its exact original shape.", "more": ["In regeneration, the main liver cells, called hepatocytes, usually do the work by dividing. If they are badly damaged, other cell types can help. Researchers study the signals that start the process in the hope of finding treatments for liver failure.", "The Greek myth of Prometheus, whose liver was eaten each day by an eagle and grew back each night, is sometimes cited as an early hint that people knew about the organ’s regrowth, although that is speculation."], "why": "Understanding liver regeneration helps make living-donor transplants safer and may lead to better treatments for liver disease, a major cause of illness around the world.", "dyk": ["The liver weighs about 1.5 kilograms in adults.", "It carries out hundreds of functions, including making bile.", "Living donors can give part of their liver to a patient in need."], "src": [["Britannica — Liver", "https://www.britannica.com/science/liver"], ["Wikipedia — Liver regeneration", "https://en.wikipedia.org/wiki/Liver_regeneration"]]}, "The first message sent over the internet’s ancestor was just “LO”": {"body": ["On 29 October 1969, a graduate student named Charley Kline at the University of California, Los Angeles tried to log in to a computer at the Stanford Research Institute, hundreds of miles away. He typed the word LOGIN, one letter at a time, over a new network called the ARPANET, while a colleague at Stanford confirmed each letter by phone.", "The first two letters, L and O, went through. Then the system crashed, so the first message ever sent between the computers was “LO”. About an hour later the system was repaired and the full word went through."], "bg": "The story is often retold as “lo and behold”, but that is a joke. Those involved say they simply meant to type LOGIN, and the computer at the other end crashed after two letters. Details such as the exact time differ between accounts, but the date and the two letters are well documented.", "more": ["The ARPANET was funded by the US Department of Defense’s Advanced Research Projects Agency. At first it linked only four sites: UCLA, the Stanford Research Institute, the University of California, Santa Barbara and the University of Utah, using specialised computers to route data in small packets.", "The network grew through the 1970s and introduced ideas such as packet switching and email. In 1983 it adopted the TCP/IP protocols that still underpin the internet, and it was later retired as the internet expanded."], "why": "The first message shows that even world-changing technologies begin with small, imperfect tests, and the ARPANET’s design choices still shape how data moves around the world.", "dyk": ["Only four computers were on the network at first.", "The ARPANET started in 1969, long before the web.", "Packet switching splits messages into small chunks that travel separately."], "src": [["Britannica — ARPANET", "https://www.britannica.com/topic/ARPANET"], ["Wikipedia — ARPANET", "https://en.wikipedia.org/wiki/ARPANET"]]}, "Beethoven composed some of his greatest work while almost deaf": {"body": ["Ludwig van Beethoven began losing his hearing in his late twenties, and by the time he wrote his final works he was almost completely deaf. Yet he kept composing. His Ninth Symphony, premiered in Vienna in 1824, is one of the best-loved pieces of music ever written, and he could barely hear the applause at the first performance.", "He wrote about his despair in a famous document known as the Heiligenstadt Testament, in which he describes his suffering but decides to go on for the sake of his art. To cope with his hearing loss he used ear trumpets and conversation books, in which people wrote down what they wanted to say to him."], "bg": "The cause of Beethoven’s deafness is not known for certain. Suggestions include illnesses, lead poisoning and an inner-ear condition, and the debate continues. It is also uncertain how far deafness shaped his style, although many listeners hear a bolder, more inward quality in his late works.", "more": ["The Ninth’s final movement adds a choir and soloists singing words from Friedrich Schiller’s poem Ode to Joy. The melody was later adopted as the anthem of the European Union, and the symphony is performed around the world as a message of unity.", "Composing without hearing was possible because Beethoven had a lifetime of experience. He could imagine sounds in his head, and he is said to have felt vibrations through the piano. His late string quartets are admired for their depth."], "why": "Beethoven’s story shows how creativity can continue in the face of hardship, and it reminds us that music is more than what the ears can hear.", "dyk": ["The Ninth Symphony was Beethoven’s last complete symphony.", "The Ode to Joy melody is the anthem of the European Union.", "Beethoven used conversation books to communicate when he could no longer hear."], "src": [["Britannica — Ludwig van Beethoven", "https://www.britannica.com/biography/Ludwig-van-Beethoven"], ["Wikipedia — Ludwig van Beethoven", "https://en.wikipedia.org/wiki/Ludwig_van_Beethoven"]]}, "The Nile flows north": {"body": ["The Nile flows north, from its sources in East Africa and the Ethiopian highlands to the Mediterranean Sea in Egypt, which makes it one of the few great rivers that run that way. At about 6,650 kilometres it is usually listed as one of the two longest rivers on Earth, along with the Amazon, although which one is longer is debated.", "It has two main branches. The White Nile rises in the lakes region of central Africa, with Lake Victoria as its largest source, and the Blue Nile starts at Lake Tana in the Ethiopian highlands. They meet at Khartoum in Sudan. Because the river runs downhill towards the sea, Egypt, nearest the Mediterranean, is at the low end: Upper Egypt is in the south and Lower Egypt is in the north."], "bg": "The Nile is not unique in flowing north, since many rivers do, including the Rhine and the Red River in North America. Rivers flow downhill, not in any compass direction, so the Nile’s direction only seems surprising because maps put north at the top. Which river is the longest is also disputed, as some measurements make the Amazon longer.", "more": ["Ancient Egyptian civilisation grew up along the Nile because of its yearly flood. Each summer, rain in the Ethiopian highlands raised the river and spread fertile silt over the valley, so farmers could grow crops in an otherwise desert land. The Egyptians even based their calendar on the flood seasons.", "Today the flood is controlled by the Aswan High Dam, finished in 1970, which provides electricity and a steady water supply but has stopped fresh silt from reaching the fields. A newer dam in Ethiopia, the Grand Ethiopian Renaissance Dam, has caused tension between countries that rely on the river."], "why": "The Nile supports hundreds of millions of people, so how its water is shared affects farming, power and politics across northeastern Africa.", "dyk": ["The Nile basin is shared by about eleven countries.", "The Nile delta is one of the most densely populated farming regions in the world.", "The ancient Egyptians called the river Iteru, meaning great river."], "src": [["Britannica — Nile River", "https://www.britannica.com/place/Nile-River"], ["Wikipedia — Nile", "https://en.wikipedia.org/wiki/Nile"]]}, "Your retina has about 126 million light sensors": {"body": ["The retina is a thin layer of light-sensing tissue lining the back of each eye. It holds about 126 million photoreceptors of two main kinds. Roughly 120 million are rods, which work in dim light but see only shades of grey, and about 6 million are cones, which work in bright light and give us colour vision and fine detail.", "Cones are packed most densely in a tiny central pit called the fovea, where your sight is sharpest, which is why you have to look straight at a word to read it. Rods are mostly spread around the edges, which is why a faint star is often easier to see out of the corner of your eye."], "bg": "The numbers are estimates and vary between people. Humans have three kinds of cones, tuned to long, medium and short wavelengths of light, and the brain compares their signals to produce the sensation of colour. Colour blindness usually involves a difference in one or more of these cone types.", "more": ["The retina does more than detect light. Several layers of nerve cells begin processing the signal before it leaves the eye, and about a million nerve fibres in the optic nerve carry it to the brain. The place where they leave the eye has no photoreceptors, creating a natural blind spot that the brain fills in.", "Adapting to darkness takes time. In bright light the rods are overwhelmed, and after you move into a dark room they need around 20 to 30 minutes to reach full sensitivity. Red light affects them least, which is why it is used to preserve night vision."], "why": "Understanding the retina helps doctors treat conditions such as macular degeneration and retinal detachment, which are leading causes of sight loss, and it has inspired technology such as digital camera sensors.", "dyk": ["The fovea contains only cones and no rods.", "Each eye has a blind spot where the optic nerve leaves the retina.", "Owls have far more rods than humans and see well in the dark."], "src": [["Britannica — Retina", "https://www.britannica.com/science/retina"], ["Wikipedia — Retina", "https://en.wikipedia.org/wiki/Retina"]]}, "Coral reefs cover under 1% of the ocean floor but host about a quarter of marine species": {"body": ["Coral reefs cover less than one percent of the ocean floor, but they support roughly a quarter of all marine species, an enormous share for such a small area. They are built by tiny animals called polyps, relatives of jellyfish, which make hard limestone skeletons. Over thousands of years those skeletons pile up to form reefs, the largest structures made by living things.", "The polyps live in partnership with microscopic algae inside their tissues. The algae use sunlight to make food and share it with the coral, and in return the coral gives them shelter. That is why reef-building corals grow in clear, shallow, sunlit tropical waters, and why the algae help give reefs their bright colours."], "bg": "The “quarter of marine species” figure is widely quoted, but it is an estimate, because many reef species have not yet been described. It is best treated as a rough guide. What is clear is that reefs are among the most biodiverse habitats on the planet.", "more": ["When the water gets too warm, corals expel their algae and turn white, an event called coral bleaching. A bleached coral is not dead and can recover if conditions improve, but long or repeated heatwaves can kill it. Mass bleaching events have become more frequent in recent decades as the oceans have warmed.", "Reefs also protect coasts by absorbing wave energy, support fisheries and attract tourism, providing food and income for hundreds of millions of people. Cold-water corals, which do not need sunlight, also exist in the deep sea."], "why": "Coral reefs shelter fish, protect shorelines and support millions of livelihoods, so their health is a key sign of how the oceans are coping with warming and pollution.", "dyk": ["The Great Barrier Reef is the largest coral reef system in the world.", "Corals are animals, not plants.", "Some corals live in cold, dark water far below the surface."], "src": [["NOAA — What is a coral reef?", "https://oceanservice.noaa.gov/facts/coral_reef.html"], ["Wikipedia — Coral reef", "https://en.wikipedia.org/wiki/Coral_reef"]]}, "Email is older than the web": {"body": ["Email is older than the World Wide Web. In 1971 the American programmer Ray Tomlinson sent what is regarded as the first email between two computers on a network, the ARPANET, and chose the @ symbol to separate the user’s name from the computer’s name. The web did not appear until about 1989 to 1991, so email was in use for almost two decades before most people had heard of the internet.", "Early email was used by researchers and military contractors, and it quickly became the most popular use of the ARPANET. People soon invented ways to organise messages, such as replying, forwarding and mailing lists, which are still part of email today."], "bg": "Tomlinson was not the first to send messages between users on the same computer, since early time-sharing systems already had simple mail programs. His innovation was making mail work between different computers on a network, and choosing the @ sign, which has lasted. He later said he could not remember what the first test message said, probably something like QWERTYUIOP.", "more": ["The first widely noticed unwanted bulk message was sent in 1978 by a marketing manager at Digital Equipment Corporation, who emailed hundreds of ARPANET users to advertise a new computer. The word spam came later, from a sketch by the British comedy group Monty Python.", "Email standards developed over the years, such as SMTP for sending and later IMAP and POP for receiving, are still the basis for how most email works. Despite chat apps and social media, billions of emails are still sent every day."], "why": "Email shows how a simple idea on a small research network became a tool used by billions, and its history is a reminder that the internet existed long before the web.", "dyk": ["The @ sign was a rarely used key on keyboards in 1971.", "Ray Tomlinson was inducted into the Internet Hall of Fame.", "The first spam email was sent in 1978."], "src": [["Britannica — Ray Tomlinson", "https://www.britannica.com/biography/Ray-Tomlinson"], ["Wikipedia — Email", "https://en.wikipedia.org/wiki/Email"]]}, "The word quarantine comes from the number forty": {"body": ["The word quarantine comes from the Italian quaranta giorni, meaning forty days. The practice began in the 14th century, when plague repeatedly swept through Europe. Port cities such as Venice and Ragusa, now Dubrovnik, made ships arriving from infected places wait offshore before anyone could land, at first for thirty days and later for forty.", "The forty-day period was long enough for most signs of illness to appear in people or cargo, and it was also a number with religious meaning in Christian culture. Ships waited at anchor, and the sick were kept in separate buildings known as lazarettos."], "bg": "People in the 14th century did not know that germs cause disease, and they blamed bad air or other causes. Even so, keeping possible carriers apart did slow the spread of plague, which shows that methods for controlling disease can work before the science behind them is understood.", "more": ["The earliest known rule of this kind was made in 1377 in Ragusa, which ordered that people arriving from plague-affected areas wait thirty days in isolation. Venice followed, and the period was later extended to forty days. The word entered English in the 1600s.", "Modern quarantine is based on how long each disease takes to show itself, called its incubation period, so the length varies from days to weeks. Quarantine separates people who may have been exposed but are not yet ill, while isolation separates people who are known to be sick."], "why": "The history of quarantine shows how public health measures developed long before modern medicine, and the same ideas were used again during recent pandemics.", "dyk": ["The first known quarantine law was passed in Ragusa in 1377.", "A lazaretto was a place where sick travellers and ships’ crews were kept apart.", "In Italian, forty is quaranta."], "src": [["Britannica — Quarantine", "https://www.britannica.com/topic/quarantine"], ["Wikipedia — Quarantine", "https://en.wikipedia.org/wiki/Quarantine"]]}, "Iceland is splitting apart": {"body": ["Iceland sits on the Mid-Atlantic Ridge, the boundary between the North American and Eurasian tectonic plates, which are slowly pulling apart at about two centimetres a year. Iceland is one of the few places where this ridge rises above sea level, so you can see the plates separating on land.", "At Þingvellir National Park a valley has formed between the two plates, with cliffs on either side. Visitors can walk through the rift, and in the Silfra fissure they can even snorkel between the continents in clear glacial water. As the plates pull apart, magma rises to fill the gap, building new crust and causing frequent volcanic eruptions and earthquakes."], "bg": "Iceland sits on both the ridge and a mantle plume, or hotspot, which makes it much more volcanically active than most of the mid-ocean ridge. This extra supply of magma is why the ridge rises above the sea there, while elsewhere it lies beneath the waves.", "more": ["Þingvellir is also where Iceland’s parliament, the Althing, first met in 930 CE, and it is a UNESCO World Heritage Site. The spreading is slow but real: it amounts to a couple of centimetres a year across Iceland’s rift zone.", "Iceland uses its volcanic heat for energy. Geothermal power heats most homes, and nearly all of its electricity comes from renewable sources such as hydropower and geothermal energy."], "why": "Iceland gives scientists a rare place to study plate tectonics directly, and it shows how geology can become a source of clean energy.", "dyk": ["The Althing, founded in 930 CE, is one of the oldest parliaments in the world.", "Iceland has around 30 active volcanic systems.", "Most Icelandic homes are heated with geothermal energy."], "src": [["Britannica — Iceland", "https://www.britannica.com/place/Iceland"], ["UNESCO — Þingvellir National Park", "https://whc.unesco.org/en/list/1152"]]}, "Goosebumps are a leftover reflex": {"body": ["Goosebumps, the small bumps that rise on your skin when you are cold, scared or moved, are caused by tiny muscles at the base of each hair, called arrector pili. When these muscles contract they pull the hair upright and make the skin around it bunch into a little bump. The reaction is automatic and is controlled by the sympathetic nervous system, part of the body’s fight-or-flight response.", "In furry animals the effect is useful. Upright fur traps a layer of air that insulates against the cold, and a bristling coat can make an animal look bigger to a threat. Humans have far less body hair, so for us it does very little, which is why goosebumps are often described as a leftover, or vestigial, reflex."], "bg": "Goosebumps may still do a little in humans, but the effect is slight. Research in mice has linked the muscle and nerve involved to the stem cells that regrow hair, which suggests the reflex may do more than puff up fur, although it is not known how far this applies to people.", "more": ["Goosebumps also happen with strong emotions such as awe, fear or the thrill of music, a response sometimes called frisson. People differ in how easily they get them, and some research suggests that people who feel them in response to music have stronger links between the brain’s auditory and emotional areas.", "The name comes from the resemblance of the skin to that of a plucked goose. The medical term is piloerection, and the old Latin name, cutis anserina, also means goose skin."], "why": "Goosebumps are a small clue to our evolutionary past, and they show how the body’s automatic responses link the nervous system to the skin and hair.", "dyk": ["The medical term for goosebumps is piloerection.", "Many animals, including cats and porcupines, raise their hair or quills when threatened.", "Music can give some people goosebumps, a feeling sometimes called frisson."], "src": [["Britannica — Goose bumps", "https://www.britannica.com/science/goose-bumps"], ["Wikipedia — Goose bumps", "https://en.wikipedia.org/wiki/Goose_bumps"]]}, "Most deep-sea animals make their own light": {"body": ["Bioluminescence, light made by living things, is extremely common in the deep sea. Studies suggest that a large majority of the animals living in the open ocean below a few hundred metres, including fish, squid, jellyfish and crustaceans, can make their own light. Sunlight does not reach these depths, so making light has become one of the main ways to communicate, hunt and hide.", "The light comes from a chemical reaction. A molecule called luciferin reacts with oxygen, usually with the help of an enzyme called luciferase, and releases energy as light, often blue or green because those colours travel farthest through seawater. Some animals make light themselves, while others, such as many anglerfish, host glowing bacteria in special organs."], "bg": "The claim that most deep-sea animals glow is based on surveys that found a large share of the animals in the water column are bioluminescent, with estimates of around 70 to 80 percent. Numbers vary with the depth and region sampled, and animals living on the seafloor are less well studied.", "more": ["Light is used in several ways. Anglerfish dangle a glowing lure to attract prey. Some squid and shrimp release glowing clouds to confuse predators, like a smoke screen. Others use counter-illumination, producing a faint glow on their undersides that matches the light from above, so their silhouette cannot be seen from below.", "Near the surface, glowing plankton can make waves sparkle blue at night, and some creatures flash to attract mates. Scientists also use the glow in medicine and biology: a glowing protein from a jellyfish, green fluorescent protein, became a vital tool for labelling cells, and its discoverers won a Nobel Prize in 2008."], "why": "Because most of the ocean is dark, understanding how animals use light helps us understand how the largest habitat on Earth works, and it has also produced tools used in medical research.", "dyk": ["Fireflies are also bioluminescent, but they live on land.", "Many deep-sea animals make blue light because it travels farthest through water.", "Some glowing plankton light up when waves disturb them."], "src": [["Britannica — Bioluminescence", "https://www.britannica.com/science/bioluminescence"], ["NOAA — What is bioluminescence?", "https://oceanservice.noaa.gov/facts/biolum.html"]]}, "The World Wide Web was invented at a physics lab": {"body": ["The World Wide Web was invented by Tim Berners-Lee, a British scientist working at CERN, the European particle physics laboratory near Geneva. In March 1989 he proposed a system that would let researchers share documents across different computers using linked pages. By the end of 1990 he had written the first web browser and web server, and the first website went live in 1991.", "The web rests on three ideas that Berners-Lee designed: addresses for pages (URLs), a way for computers to request and send them (HTTP) and a language for writing the pages (HTML). Linking one page to another with a click, called hypertext, is what made it feel like a web."], "bg": "The web and the internet are not the same thing. The internet is the global network of connected computers, which existed from the late 1960s. The web is a service that runs on it, alongside others such as email. The two words are often used interchangeably, but the web is only one of the things the internet carries.", "more": ["In April 1993 CERN announced that the web’s technology would be free for anyone to use, with no fees. That decision is widely seen as crucial to its rapid spread. Early browsers such as Mosaic, released in 1993, added pictures to pages and made the web friendly to non-experts.", "Berners-Lee later founded the World Wide Web Consortium, which develops open web standards, and he has campaigned for an open and free web. He has also raised concerns about privacy and the concentration of power on today’s web."], "why": "The web changed how people share knowledge, shop, learn and talk to each other, and its open design is a main reason it grew so fast.", "dyk": ["The first website explained what the World Wide Web was and how to use it.", "CERN released the web’s software free of charge, and Berners-Lee did not patent it.", "The first web server was a NeXT computer labelled with a note telling people not to switch it off."], "src": [["CERN — A short history of the web", "https://home.cern/science/computing/birth-web/short-history-web"], ["Wikipedia — World Wide Web", "https://en.wikipedia.org/wiki/World_Wide_Web"]]}, "The ancient Olympic Games lasted for over a thousand years": {"body": ["The ancient Olympic Games were held at Olympia, a sacred site in southern Greece, in honour of Zeus. By tradition they began in 776 BCE, the date of the first recorded winner, and continued every four years until about 393 CE, when the Roman emperor Theodosius I is traditionally said to have ended them. That is more than a thousand years.", "The games were a religious festival as well as a sporting one. Events included running races, wrestling, boxing, the pentathlon, chariot racing and a brutal combined sport called pankration. Only free Greek men competed, and the winners received a wreath of olive leaves and lasting fame in their home cities."], "bg": "The traditional date of 776 BCE comes from lists of victors compiled centuries later, and historians think the games probably began earlier. Details such as the end date of 393 CE and the idea that an emperor ended them in a single decree are uncertain, and the games may have faded gradually.", "more": ["A sacred truce was announced before each festival so that athletes and spectators could travel safely to Olympia even if their cities were at war. It did not stop wars, but it guaranteed safe passage to the games and was widely respected for centuries.", "The modern Olympics were revived by Pierre de Coubertin, with the first modern games held in Athens in 1896. Today’s games have many more sports, and the Winter Games began in 1924, but they still borrow the ancient idea of a festival that brings nations together."], "why": "The Olympics show how a sporting festival can endure across cultures, and the idea of a truce for sport still inspires attempts to link sport with peace.", "dyk": ["Winners received an olive wreath, not a gold medal.", "Athletes at the ancient games competed without clothes.", "The first modern Olympics in 1896 had athletes from 14 nations."], "src": [["Britannica — Olympic Games", "https://www.britannica.com/sports/Olympic-Games"], ["Wikipedia — Ancient Olympic Games", "https://en.wikipedia.org/wiki/Ancient_Olympic_Games"]]}, "Sunflower seed spirals follow Fibonacci numbers": {"body": ["The seeds in the centre of a sunflower are arranged in two sets of spirals, one turning clockwise and the other anticlockwise. If you count them, the numbers are very often neighbouring numbers from the Fibonacci sequence, such as 34 and 55, or 55 and 89. The sequence begins 1, 1, 2, 3, 5, 8, 13, and each number is the sum of the two before it.", "The pattern comes from the way the flower grows. New seeds form at the centre and are pushed outwards, each placed at a fixed angle of about 137.5 degrees from the one before, known as the golden angle. That angle packs the seeds tightly and evenly with no gaps, so the head can hold as many seeds as possible."], "bg": "Fibonacci spirals are very common in plants, but not universal. Real flowers vary, and some sunflower heads show other numbers. The golden angle is linked to the golden ratio, but the mathematics is really about efficient packing, not any magical property of the numbers.", "more": ["The arrangement of leaves, petals and seeds around a stem is called phyllotaxis. Pinecones, pineapples and cauliflower florets all show similar spirals, and the same ideas help explain why many flowers have petal counts such as 3, 5, 8 or 13.", "The mathematician Alan Turing studied how such patterns form. In 2012 and 2013 a project called Turing’s Sunflowers asked people to grow and photograph sunflowers to test how closely real flowers follow the Fibonacci pattern."], "why": "Sunflower spirals show how simple growth rules can produce patterns that look like mathematics, and they help explain how plants pack structures
