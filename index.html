 efficiently.", "dyk": ["The golden angle is about 137.5 degrees.", "Pinecones and pineapples also show Fibonacci spirals.", "Each Fibonacci number is the sum of the two before it."], "src": [["Britannica — Fibonacci number", "https://www.britannica.com/science/Fibonacci-number"], ["Wikipedia — Phyllotaxis", "https://en.wikipedia.org/wiki/Phyllotaxis"]]}, "Crows remember human faces": {"body": ["Crows can recognise individual human faces and remember them for years. In experiments led by John Marzluff at the University of Washington, researchers wearing a particular rubber mask trapped and banded wild American crows. Afterwards, crows scolded and swooped at anyone wearing that mask, including people who had never been involved, while ignoring people in other masks.", "Even more strikingly, the grudge spread. Crows that had not been caught also began to scold the mask, apparently learning from other crows, and some young crows that were not even alive at the time joined in. This suggests crows can pass information about threats within their community."], "bg": "The studies show learned recognition, not a human-style grudge. Crows are social animals that live in family groups and are good at spotting patterns, and knowing which people are a threat or a source of food is useful for birds that live near humans. The results come from a small number of field experiments, and similar abilities have been shown in other corvids such as magpies.", "more": ["Crows and their relatives, the corvids, are among the most intelligent animals. They use tools, with New Caledonian crows shaping twigs into hooks to extract insects, and they can solve multi-step puzzles. Some crows have even been seen dropping nuts onto roads for cars to crack, although how common that is is debated.", "Their brains are small but packed with neurons, especially in a region that supports planning and problem solving. Studies show crows can count small numbers and plan ahead."], "why": "Crows show that intelligence and memory are not unique to mammals, and understanding how they live alongside people can help us share cities with wildlife.", "dyk": ["The study used rubber masks to test whether crows could tell people apart.", "New Caledonian crows make hooked tools from twigs.", "A group of crows is called a murder."], "src": [["Britannica — Crow", "https://www.britannica.com/animal/crow-bird"], ["Wikipedia — Crow", "https://en.wikipedia.org/wiki/Crow"]]}, "The Eiffel Tower grows taller in summer": {"body": ["The Eiffel Tower is made of wrought iron, and like most materials iron expands when it is heated. On a hot day the iron warms and swells, making the tower up to around 15 centimetres taller than on a cold winter day. That is a small change for a structure about 330 metres tall, but it is real.", "The tower was built for the 1889 World’s Fair in Paris by the engineering company of Gustave Eiffel. It was meant to stand for only twenty years, but its usefulness as a radio antenna saved it. Heat can also make the top move sideways by a few centimetres, because the side facing the Sun warms more than the shaded side."], "bg": "The 15 centimetre figure is an approximate value. The exact change depends on the temperature of the iron, which can be much hotter than the air when the Sun is on it, and on how the height is measured. The effect is a simple example of thermal expansion, which engineers must allow for in bridges, railways and buildings.", "more": ["Engineers deal with expansion by building in gaps. Bridges have expansion joints, and railway tracks leave tiny gaps between sections so they do not buckle on hot days. Without them, the forces could crack concrete or bend steel.", "The Eiffel Tower is repainted about every seven years, using around 60 tonnes of paint, to protect the iron from rust. It is painted in three slightly different shades, getting lighter towards the top so that the tower looks uniform against the sky."], "why": "The tower’s changing height is a clear example of why engineers must plan for temperature changes in every large structure.", "dyk": ["The tower was meant to stand for only twenty years.", "It is repainted about every seven years.", "It was the world’s tallest structure until 1930."], "src": [["Britannica — Eiffel Tower", "https://www.britannica.com/topic/Eiffel-Tower-Paris"], ["Wikipedia — Eiffel Tower", "https://en.wikipedia.org/wiki/Eiffel_Tower"]]}, "The Atacama Desert has places that almost never see rain": {"body": ["The Atacama Desert in northern Chile is often described as the driest non-polar desert on Earth. Some weather stations in its core have gone years without recording meaningful rain, and in the driest parts the average yearly rainfall is only a few millimetres.", "The reason is geography. The desert lies between the Andes to the east, which block moisture coming from the Amazon basin, and the Pacific coast to the west, where the cold Humboldt Current cools the air and stops rain clouds from forming. Together they create a rain shadow and a very stable, dry climate."], "bg": "“Driest” depends on how it is measured. Antarctica’s Dry Valleys are drier, but they are cold deserts, which is why the Atacama is called the driest non-polar desert. The driest spots may have recorded almost no rain for centuries, but the desert as a whole has varied conditions and gets occasional storms.", "more": ["Fog plays a big role for life. A coastal fog called the camanchaca drifts inland from the Pacific, and some plants, insects and even communities collect its droplets with nets. After rare heavy rains, parts of the desert burst into flower in an event called the desierto florido.", "The dry, high, clear skies make the Atacama one of the best places in the world for astronomy, with major observatories such as ALMA. Scientists also use parts of the desert as a stand-in for Mars, because its soils have very few microbes, to test instruments and rovers."], "why": "The Atacama shows how extreme dryness shapes life and gives astronomers and planetary scientists a natural laboratory, and it is also a source of minerals such as copper and lithium.", "dyk": ["The Atacama stretches for well over 1,000 kilometres along the Chilean coast.", "Some plants and animals there survive on moisture from fog.", "It is home to some of the world’s largest telescopes."], "src": [["Britannica — Atacama Desert", "https://www.britannica.com/place/Atacama-Desert"], ["Wikipedia — Atacama Desert", "https://en.wikipedia.org/wiki/Atacama_Desert"]]}, "You are slightly taller in the morning": {"body": ["Most people are about a centimetre or two taller when they wake up than at the end of the day. Between each pair of vertebrae in your spine is a soft, cushion-like disc made of tough cartilage with a gel-like centre. During the day, gravity and your own weight gradually squeeze water out of the discs and compress them slightly. While you lie down at night the pressure is lower, so the discs absorb fluid again and expand.", "Because there are many discs, the small changes add up to a measurable difference. Studies find that most of the height is lost in the first hour or two after getting up, and the spine loses roughly one percent of its length by the evening."], "bg": "The size of the effect varies between people and with age, activity and posture. This is why height is best measured at the same time of day, and why doctors and recruiters sometimes specify a time. The effect is normal and does not mean anything is wrong with the spine.", "more": ["The discs act as shock absorbers, spreading the load when you walk, run and jump. With age they lose water and become thinner, which is one reason people lose a little height as they get older.", "Astronauts experience the opposite effect. In microgravity there is no weight pressing on the spine, so the discs expand and astronauts can grow taller by a few centimetres, then return to normal height after they come back to Earth. Some feel back pain during the stretch."], "why": "Knowing that your height changes through the day explains why measurements vary, and it shows how the discs in your spine act as soft shock absorbers.", "dyk": ["The spine has 24 movable vertebrae.", "Astronauts can grow a few centimetres in space.", "The discs make up roughly a quarter of the length of the spine."], "src": [["Wikipedia — Human height", "https://en.wikipedia.org/wiki/Human_height"], ["Wikipedia — Intervertebral disc", "https://en.wikipedia.org/wiki/Intervertebral_disc"]]}, "The ocean is salty because of rocks": {"body": ["The ocean is salty mainly because of rocks on land. Rain is slightly acidic from dissolved carbon dioxide, and as it falls and runs over the land it slowly breaks down rocks, releasing minerals as dissolved ions. Rivers carry these ions to the sea. When seawater evaporates the water leaves but the dissolved salts stay behind, so over hundreds of millions of years the sea has become salty.", "The average salinity of seawater is about 3.5 percent, or roughly 35 grams of dissolved salts in every kilogram of water. Most of it is sodium and chloride, the two ions in ordinary table salt, but seawater also contains magnesium, sulfate, calcium and potassium."], "bg": "Salinity has stayed fairly stable for a very long time because salt is removed as well as added. Some ions are used by living things, for example to build shells, some are locked into seafloor sediments, and some are removed in chemical reactions at undersea volcanic vents. The balance keeps the ocean’s saltiness roughly constant.", "more": ["Salinity varies from place to place. It is lower where large rivers or melting ice add fresh water, as in the Baltic Sea, and higher in hot, dry seas with lots of evaporation, such as the Red Sea. The Dead Sea, which has no outlet, is about ten times as salty as the ocean.", "Salinity also affects how ocean water moves. Cold, salty water is dense and sinks, helping to drive the slow circulation that carries heat around the globe, so changes in salinity can affect climate."], "why": "Salt levels shape marine life, ocean currents and climate, and tracking changes in salinity helps scientists understand shifts in rainfall and ice melt.", "dyk": ["Sea salt can be made by letting seawater evaporate in shallow ponds.", "The Dead Sea is about ten times saltier than the ocean.", "Most of the salt in seawater is sodium chloride."], "src": [["NOAA — Why is the ocean salty?", "https://oceanservice.noaa.gov/facts/whysalty.html"], ["Wikipedia — Seawater", "https://en.wikipedia.org/wiki/Seawater"]]}, "The first .com domain was registered in 1985": {"body": ["On 15 March 1985 a computer company called Symbolics registered symbolics.com, the first .com domain name. Domain names are the human-friendly addresses of websites, such as example.com. They exist because computers on a network actually use numbers, called IP addresses, and people find words easier to remember than strings of digits.", "The Domain Name System, or DNS, works like a phone book. When you type a name into your browser, a DNS server looks up the number that goes with it and tells your computer where to go. The .com ending, short for commercial, was one of the first top-level domains, along with .edu, .gov, .mil and .org."], "bg": "Symbolics.com was the first .com name to be registered, but the web did not exist yet, so early domain names were used for email and other network services. Registration was slow at first, with only a handful of names in the first couple of years.", "more": ["By the mid-1990s the web had made domain names valuable, and a registration business grew. Today there are well over 150 million .com domains, and many other endings exist, including country codes such as .uk and .jp and newer ones such as .app.", "Symbolics itself made specialised computers for the Lisp programming language, and it went out of business in the 1990s. The domain was later bought by an investment firm and is now kept as a historical curiosity."], "why": "Domain names are part of the invisible plumbing that makes the internet usable, and their history shows how a simple naming system grew into a worldwide marketplace.", "dyk": ["The Domain Name System turns names into IP addresses.", "The first domain names appeared in 1985, years before the web.", "There are now well over 150 million .com domains."], "src": [["Wikipedia — Symbolics", "https://en.wikipedia.org/wiki/Symbolics"], ["Wikipedia — Domain Name System", "https://en.wikipedia.org/wiki/Domain_Name_System"]]}, "One of the oldest written songs is about 3,400 years old": {"body": ["Among the clay tablets found at the ancient city of Ugarit, on the coast of modern Syria, is a set that includes a hymn written in the Hurrian language, with signs added that appear to be musical notation. The hymn, known as Hurrian Hymn No. 6, is dated to around 1400 BCE, which makes it about 3,400 years old. It is often described as the oldest nearly complete piece of notated music.", "The tablets were found in the 1950s, and scholars have worked since the 1970s to interpret the notation. The hymn is addressed to Nikkal, a goddess associated with orchards. Several musical versions have been proposed and some have been recorded, but they are modern reconstructions."], "bg": "How the hymn actually sounded is uncertain. The notation seems to refer to intervals and strings of a lyre-like instrument, but experts disagree about how to read it, so there are several competing reconstructions. It is called the oldest nearly complete notated melody, but some scholars question how much of it can be recovered.", "more": ["The tablets were written in cuneiform, a script made by pressing a reed stylus into wet clay. Cuneiform was used across Mesopotamia and nearby regions for about 3,000 years to record everything from laws and trade to poetry. The Hurrians were a people of the ancient Near East who spoke a language unrelated to most of their neighbours.", "Ugarit was a wealthy trading city that was destroyed around 1200 BCE, in the upheavals at the end of the Bronze Age. Its archive of texts tells historians about religion, language and daily life, and is one of the great finds of Near Eastern archaeology."], "why": "The hymn shows that people were writing down music thousands of years ago, and that the urge to record songs is as old as writing itself.", "dyk": ["The hymn was written in cuneiform on clay tablets.", "The hymn is dedicated to the goddess Nikkal.", "Ugarit was destroyed around 1200 BCE."], "src": [["Britannica — Ugarit", "https://www.britannica.com/place/Ugarit"], ["Wikipedia — Hurrian songs", "https://en.wikipedia.org/wiki/Hurrian_songs"]]}, "The corpse flower smells like rotting meat": {"body": ["The corpse flower, Amorphophallus titanum, is famous for producing one of the largest and smelliest flower clusters in the world. When it blooms, the central spike can reach about three metres tall, surrounded by a huge frilly wrapper called a spathe that is deep red inside. It is native to the rainforests of Sumatra in Indonesia.", "The stench is a trick. The flower gives off a smell like rotting meat, caused by sulphur-containing chemicals, to attract flies and carrion beetles that normally lay their eggs in dead animals. The insects crawl around inside the flower and carry pollen from one flower to another. The plant also warms its spike, which helps spread the smell."], "bg": "The corpse flower is often called the world’s largest flower, but botanically it is a cluster of thousands of tiny flowers on a spike, called an inflorescence. The title of the largest single flower belongs to Rafflesia arnoldii. The titan arum has the largest unbranched inflorescence of any plant.", "more": ["Blooms are rare. A plant grows a single huge leaf for years, storing energy in an underground tuber that can weigh over 50 kilograms, and only occasionally produces a flower. In cultivation it may bloom once every several years, and each bloom lasts only a day or two, so botanical gardens often announce them and draw crowds.", "The plant is endangered in the wild because of the loss of rainforest. Botanic gardens help conserve it by growing plants and sharing pollen between them, and hand pollination is common when a bloom opens."], "why": "The corpse flower shows how plants have evolved clever tricks to attract pollinators, and its rare blooms help raise awareness of rainforest conservation.", "dyk": ["The first bloom in cultivation was at Kew Gardens in 1889.", "Its single leaf can grow as tall as a small tree.", "The spike warms up to close to body temperature when the flower opens."], "src": [["Britannica — Titan arum", "https://www.britannica.com/plant/titan-arum"], ["Wikipedia — Amorphophallus titanum", "https://en.wikipedia.org/wiki/Amorphophallus_titanum"]]}, "The mantis shrimp has one of the fastest punches in nature": {"body": ["Mantis shrimp, which are not true shrimp but their own group of crustaceans, have some of the fastest strikes in nature. Smasher species hit with club-like claws, accelerating them in a few thousandths of a second to speeds of around 23 metres per second from a standing start, an acceleration comparable with a small-calibre bullet. They use the strike to smash the shells of crabs, snails and clams.", "The speed comes from a spring-like mechanism. The animal slowly bends part of its arm like a bow, locks it with a latch and then releases the stored energy in a flash. The club moves so fast that it makes the water around it boil into tiny bubbles, called cavitation, and when the bubbles collapse they produce a second shock wave that adds to the damage."], "bg": "Mantis shrimp punches are often compared with bullets, but it is the acceleration, not the top speed, that is similar. The clubs reach around 23 metres per second, which is very fast for an animal in water, where drag is strong.", "more": ["Mantis shrimp also have extraordinary eyes. Each eye moves independently and has many types of colour receptor, up to 12 to 16 compared with three in humans, and some species can see polarised light. How they use all that information is still being studied, and recent work suggests they may not tell colours apart as finely as the number of receptors implies.", "Their clubs are made of materials that resist impact, with a structure that has inspired research into stronger, lighter materials for armour and aircraft. Aquarium keepers sometimes find that a mantis shrimp has cracked the glass of its tank."], "why": "The mantis shrimp’s strike shows how animals can store and release energy to beat the limits of muscle, and it has inspired research into tougher engineering materials.", "dyk": ["Mantis shrimp eyes have many types of colour receptor.", "Some mantis shrimp can see polarised light.", "The collapse of cavitation bubbles adds a second blow to the strike."], "src": [["Britannica — Mantis shrimp", "https://www.britannica.com/animal/mantis-shrimp"], ["Wikipedia — Mantis shrimp", "https://en.wikipedia.org/wiki/Mantis_shrimp"]], "lead": "Its club-like claws accelerate as fast as a small-calibre bullet."}, "Water has a “triple point” where it is ice, liquid and vapour at once": {"body": ["Water can exist as a solid, a liquid and a gas, and at one particular combination of temperature and pressure all three can exist together in balance. This is called the triple point. For water it occurs at 0.01 degrees Celsius and a very low pressure of about 0.006 of an atmosphere, or 611.657 pascals.", "At the triple point, ice, liquid water and water vapour coexist stably. If you slightly raise the temperature the ice melts, and if you slightly lower it the liquid freezes, but at exactly this point none of the three phases takes over. Every pure substance has its own triple point, which makes it a useful fixed reference."], "bg": "The triple point is not the same as the usual freezing point of 0 °C that we know at normal air pressure. The freezing point shifts slightly with pressure and dissolved air, so the triple point, at 0.01 °C in a sealed vessel of pure water, is more precisely defined and was chosen as a scientific standard.", "more": ["Until 2019, the kelvin, the unit of temperature, was defined as 1/273.16 of the temperature of the triple point of water. Scientists used special sealed glass cells of very pure water to reproduce the temperature. In 2019 the kelvin was redefined using a fixed value of the Boltzmann constant, a basic physical constant, so it no longer depends on any substance.", "Triple points explain some real phenomena. On Mars, where air pressure is close to the triple-point pressure of water, liquid water is hard to maintain and ice can turn straight into vapour. Carbon dioxide’s triple point lies at much higher pressure, which is why solid dry ice turns directly into gas in normal air."], "why": "The triple point helped define temperature for decades and helps explain why water behaves as it does on other planets such as Mars.", "dyk": ["The triple point of water is at 273.16 kelvin.", "The kelvin was redefined in 2019 using a fixed physical constant.", "Dry ice skips the liquid stage because normal air pressure is below carbon dioxide’s triple point."], "src": [["Britannica — Triple point", "https://www.britannica.com/science/triple-point"], ["Wikipedia — Triple point", "https://en.wikipedia.org/wiki/Triple_point"]]}, "Venice is built on wooden piles": {"body": ["Venice is built on a lagoon of soft mud and sand, so its buildings rest on a huge number of wooden piles driven deep into the ground. Builders used timber trunks, often alder, oak and larch, and hammered them close together through the soft upper layers until they reached a hard layer of compacted clay called caranto. A platform of planks and stone was then built on top of the piles.", "The wood has lasted for centuries because it is buried under water and mud with very little oxygen, so the bacteria and fungi that cause rot cannot do their work. Many buildings, including famous churches and palaces, still stand on their original piles, and the Rialto Bridge is said to rest on thousands of them."], "bg": "Popular tales exaggerate the number of piles or say that the wood has turned to stone. In fact the piles are still wood, kept sound by being buried in mud, and engineers monitor them, because exposure to air or to marine borers can damage them.", "more": ["Venice spreads over about 118 small islands, linked by more than 400 bridges and separated by canals. The islands were gradually extended and joined by drainage and building, and the city’s long history as a trading power paid for its large stone buildings.", "The city faces a serious threat from flooding, known as acqua alta, because the ground is slowly sinking while sea levels rise. A system of mobile barriers called MOSE, which began operating in 2020, can be raised to protect the lagoon from the highest tides."], "why": "Venice’s foundations are a lesson in clever engineering, and its flooding problems show how historic cities must adapt to a changing climate.", "dyk": ["Venice has more than 400 bridges.", "Much of the city sits on wooden piles driven into mud.", "The MOSE flood barriers began operating in 2020."], "src": [["Britannica — Venice", "https://www.britannica.com/place/Venice"], ["Wikipedia — Venice", "https://en.wikipedia.org/wiki/Venice"]]}, "Angel Falls is the tallest waterfall in the world": {"body": ["Angel Falls in Venezuela is the world’s tallest uninterrupted waterfall, with a total height of 979 metres and an unbroken drop of about 807 metres. It plunges from the edge of Auyán-tepui, a flat-topped mountain in Canaima National Park, in the Guiana Highlands in the south-east of the country.", "The water falls so far that much of it breaks into spray and mist before reaching the bottom, especially in the dry season when the flow is lower. The falls were named after the American aviator Jimmie Angel, who flew over them in 1933 and landed on top of Auyán-tepui in 1937, bringing them to world attention."], "bg": "The falls were known to local people long before Angel. The local Pemon name is Kerepakupai Merú, and in 2009 Venezuela’s president said the falls should be called by that name, although Angel Falls remains the name most used internationally. “Tallest uninterrupted” refers to the longest single drop, not the highest total fall.", "more": ["Reaching the falls is an adventure. They are in a remote area of jungle, and visitors usually fly in and then travel upriver by boat and walk through rainforest. The best time to see them is the rainy season, from roughly June to December, when the flow is strongest.", "Canaima National Park is a UNESCO World Heritage Site. It is known for tepuis, tall flat-topped mountains with sheer cliffs that have been isolated for millions of years, and many plants and animals found there live nowhere else. The tepuis helped inspire Arthur Conan Doyle’s novel The Lost World."], "why": "Angel Falls is a symbol of the wild landscapes of the Guiana Highlands, and the tepuis around it are natural laboratories for studying isolated ecosystems.", "dyk": ["The unbroken drop of about 807 metres is nearly 16 times the height of Niagara Falls.", "Canaima National Park is a UNESCO World Heritage Site.", "Auyán-tepui means mountain of the devil in the Pemon language."], "src": [["Britannica — Angel Falls", "https://www.britannica.com/place/Angel-Falls"], ["UNESCO — Canaima National Park", "https://whc.unesco.org/en/list/701"]]}, "O negative blood can be given to almost anyone in an emergency": {"body": ["Blood types are based on markers called antigens on the surface of red blood cells. The two main systems are ABO, with types A, B, AB and O, and Rh, which is positive or negative. Type O negative red cells have none of the A, B or Rh markers, so the immune system of almost any patient is unlikely to attack them. That is why O negative is called the universal donor type for red cells.", "In an emergency, when there is no time to test a patient’s blood type, doctors can give O negative red cells to almost anyone. Hospitals and ambulance services keep it in stock for this reason, so it is in constant demand even though only a small share of people have it, around 7 percent in the United States and often less elsewhere."], "bg": "It is the red cells that are universal, not the whole blood. Plasma, the liquid part of blood, follows the opposite rules, and AB plasma is the universal type for plasma. Matching is still preferred whenever possible, because there are many other blood group systems and rare reactions can occur.", "more": ["Karl Landsteiner discovered the ABO blood groups in 1901, which made safe transfusions possible, and he received the Nobel Prize in Physiology or Medicine in 1930. Before this, transfusions were risky and often caused serious reactions.", "People with AB positive blood are the opposite: they are called universal recipients for red cells, because they can receive red cells of any ABO and Rh type. The Rh factor, named after rhesus monkeys, was identified between 1937 and 1940."], "why": "Understanding blood groups makes transfusions safe, and it shows why regular blood donation, especially of the rarer types, saves lives.", "dyk": ["Karl Landsteiner won the Nobel Prize for discovering blood groups.", "AB positive people can receive red cells from any type.", "O negative blood is often used in emergencies."], "src": [["Britannica — Blood group", "https://www.britannica.com/science/blood-group"], ["Wikipedia — Blood type", "https://en.wikipedia.org/wiki/Blood_type"]]}, "The Gulf Stream warms northwest Europe": {"body": ["The Gulf Stream is a powerful warm ocean current that starts in the Gulf of Mexico, flows around Florida and up the east coast of North America, then crosses the Atlantic towards Europe, where it continues as the North Atlantic Drift. It carries enormous amounts of warm water, many times more than all the world’s rivers combined, in a stream tens of kilometres wide.", "The current moves heat from the tropics towards the north. Winters in places such as the United Kingdom, Ireland and Norway are noticeably milder than at similar latitudes on the other side of the Atlantic, such as Labrador. The ocean current is one reason, along with prevailing winds that carry its warmth to land."], "bg": "The idea that the Gulf Stream alone makes Europe mild is an oversimplification. Studies suggest that the prevailing westerly winds and the way the atmosphere carries heat play a major role too, and the Gulf Stream’s contribution is smaller than often claimed. It remains an important part of how the ocean moves heat.", "more": ["The Gulf Stream is part of a larger system, the Atlantic Meridional Overturning Circulation, in which warm water flows north near the surface and cold, dense water sinks and flows south in the deep. Scientists are studying whether climate change and melting ice could weaken this circulation, which could affect weather around the Atlantic, although how much and how quickly is uncertain.", "Benjamin Franklin helped to map the current in the 1770s by collecting reports of ship speeds. Sailors had long used it to speed their journeys from America to Europe, and avoided it going the other way."], "why": "The Gulf Stream is a vital part of Earth’s climate system, and research on how it may change helps predict weather, sea levels and fisheries.", "dyk": ["The Gulf Stream moves far more water than all the world’s rivers combined.", "Benjamin Franklin helped chart it in the 1770s.", "Its warm water shows up clearly in satellite images."], "src": [["Britannica — Gulf Stream", "https://www.britannica.com/place/Gulf-Stream"], ["NOAA — What is the Gulf Stream?", "https://oceanservice.noaa.gov/facts/gulfstream.html"]]}, "Bluetooth is named after a Viking king": {"body": ["Bluetooth, the wireless technology that connects phones to headphones, speakers and cars, is named after a Danish king. Harald Gormsson, known as Harald Bluetooth, ruled Denmark in the 10th century and is remembered for uniting the Danish tribes and spreading Christianity. The technology was meant to unite devices from different makers, so the name fitted.", "The name was suggested in the 1990s by Jim Kardach, an engineer at Intel, who had been reading about Vikings. It was supposed to be a temporary code name until a catchier one was chosen, but it stuck. The Bluetooth logo combines two runes, Hagall and Bjarkan, the initials of Harald Bluetooth, into a single symbol."], "bg": "Why Harald was called Bluetooth is uncertain. One theory is that he had a dead tooth that looked dark blue, and another is that the nickname came from a word meaning dark-skinned. Historians do not agree, and the story of the name for the technology is partly folklore, although Kardach has told it himself.", "more": ["Bluetooth uses short-range radio waves in the 2.4 gigahertz band, the same band used by many Wi-Fi networks and microwave ovens, and it hops between channels to avoid interference. It is designed for low power, so a small battery can last for days or months.", "The Bluetooth Special Interest Group, formed in 1998 by companies including Ericsson, Intel, Nokia and IBM, manages the standard. It is now built into billions of devices, from headphones to fitness trackers and medical sensors, and newer versions have increased range and cut energy use."], "why": "Bluetooth shows how a shared standard lets devices from different makers work together, and its name is a reminder of how history can end up in everyday technology.", "dyk": ["Bluetooth uses short-range radio waves.", "It was developed in the 1990s, starting at Ericsson in Sweden.", "Harald Bluetooth lived about 1,000 years ago."], "src": [["Wikipedia — Bluetooth", "https://en.wikipedia.org/wiki/Bluetooth"], ["Wikipedia — Harald Bluetooth", "https://en.wikipedia.org/wiki/Harald_Bluetooth"]]}, "Emoji began in Japan in 1999": {"body": ["Emoji began in Japan in 1999, when Shigetaka Kurita, who worked on the mobile internet service i-mode for the phone company NTT DoCoMo, designed a set of 176 small pictures. Each was just 12 by 12 pixels and showed things such as weather, traffic, technology and feelings, so that people could send them in short messages without using many characters.", "The word emoji is Japanese: e means picture and moji means character. The resemblance to the English word emotion is a coincidence. Emoji spread outside Japan after Apple and Google added them to their phones, and they are now used worldwide in billions of messages every day."], "bg": "Kurita’s set is often called the first emoji, but earlier pictograph sets existed, including one made by another Japanese company in the 1990s. The 1999 NTT DoCoMo set is the earliest to spread widely, and the original 176 are held in the Museum of Modern Art in New York.", "more": ["Emoji are now part of Unicode, the international standard that gives every character a code number so that it can be shown on any device. Anyone can propose a new emoji, but it must be approved by the Unicode Consortium, which considers whether it is likely to be widely used and different from existing ones.", "Emoji have become a kind of global language, though not an exact one. A symbol may mean different things in different cultures or age groups, and companies draw the same emoji differently, so a message can look different on different phones. Researchers study emoji to learn how people express tone online."], "why": "Emoji show how a tiny design choice for one mobile network grew into a worldwide way of adding feelings to written messages.", "dyk": ["The original 176 emoji were each only 12 by 12 pixels.", "New emoji are approved by the Unicode Consortium.", "The original set is held at the Museum of Modern Art in New York."], "src": [["Britannica — Emoji", "https://www.britannica.com/topic/emoji"], ["Wikipedia — Emoji", "https://en.wikipedia.org/wiki/Emoji"]]}, "The sensitive plant folds its leaves when touched": {"body": ["The sensitive plant, Mimosa pudica, folds its leaflets and droops its leaves within a second or two of being touched, shaken or heated. The leaves reopen after a few minutes. It is native to Central and South America, grows as a weed in many warm parts of the world, and is popular as a houseplant because of this behaviour.", "The movement is caused by sudden changes in water pressure. A touch triggers an electrical signal that travels through the leaf, causing cells in swollen joints at the base of each leaflet, called pulvini, to lose water quickly. The cells go limp and the leaflets fold up. When the cells refill with water, the leaf opens again."], "bg": "Why the plant does this is not certain. It may startle or deter hungry insects and grazing animals, or reduce water loss in wind, or make the plant look smaller and less appealing. Experiments suggest it may help protect against damage, but the exact benefit is still debated.", "more": ["In 2014 an Australian researcher, Monica Gagliano, reported that Mimosa plants could learn to ignore harmless drops. Plants dropped repeatedly from a short height stopped folding their leaves while still reacting to other stimuli, and the effect lasted for weeks. The study is widely discussed, although some scientists question whether it shows learning in the same sense as in animals.", "The plant has long been used to study how signals travel in plants. Its quick, visible response made it a classic experiment in the 17th and 18th centuries, when it fascinated early scientists who wondered whether plants could feel."], "why": "The sensitive plant reminds us that plants sense and respond to their world, and it is a handy model for studying how signals travel in plants.", "dyk": ["Mimosa pudica is native to Central and South America.", "In one experiment, plants stopped reacting to repeated harmless drops.", "It is sometimes called the touch-me-not."], "src": [["Britannica — Mimosa", "https://www.britannica.com/plant/mimosa"], ["Wikipedia — Mimosa pudica", "https://en.wikipedia.org/wiki/Mimosa_pudica"]]}, "Sloths grow algae in their fur": {"body": ["Sloths are slow-moving mammals that spend nearly all their lives in the trees of Central and South American rainforests, and their fur can be a garden. The long outer hairs have tiny grooves and cracks that trap moisture, and green algae grow in them. The algae can give the animals a greenish tinge that may help them blend in with the leaves, hiding them from predators such as harpy eagles and jaguars.", "Sloths move slowly, groom themselves little and spend long periods hanging still, which gives the algae time to settle. Their fur is also home to a small ecosystem of moths, beetles and fungi. A sloth moth lives in the fur and lays its eggs in sloth droppings, and sloths may also eat some of the algae as a snack."], "bg": "How much the algae help the sloth is still being studied. The camouflage idea is plausible but not proven, and some studies suggest that fungi in the fur may have antibiotic or anti-parasite properties that could benefit the animal. The sloth moth relationship is better documented than some claims about the algae.", "more": ["Sloths have an extremely slow metabolism and digest their leafy diet over days to weeks. That leaves them very little energy, so they move slowly and sleep a lot. They come down from the trees about once a week to defecate, a risky trip that exposes them to predators. Scientists are still debating why they do it, and one idea is that it feeds the moths in their fur.", "Despite their reputation, sloths are good swimmers and can hold their breath for a long time by slowing their heart rate. Three-toed sloths have extra neck vertebrae, which lets them turn their heads through a very wide angle."], "why": "The sloth’s fur is a window onto how animals form partnerships with other species, and sloths show how a slow, low-energy life can be a successful strategy.", "dyk": ["Sloths have a very slow metabolism.", "Three-toed sloths can turn their heads through a very wide angle.", "Sloths are good swimmers."], "src": [["Britannica — Sloth", "https://www.britannica.com/animal/sloth"], ["Wikipedia — Sloth", "https://en.wikipedia.org/wiki/Sloth"]]}, "Hot water sometimes freezes faster than cold, but nobody is sure why": {"body": ["The Mpemba effect is the claim that, under some conditions, hot water can freeze faster than colder water. It is named after Erasto Mpemba, a Tanzanian schoolboy who noticed in 1963 that a hot ice-cream mixture froze before a cold one, and who pursued the question with the physicist Denis Osborne. They published a paper in 1969.", "It sounds impossible, because the hot water has to cool to the cold water’s temperature first. Yet the effect has been reported in some experiments, and several explanations have been proposed, including evaporation, dissolved gases, convection currents and differences in how supercooling occurs. No single explanation has been accepted."], "bg": "Many scientists doubt that the effect is a real, reliable phenomenon. Careful experiments have often failed to reproduce it, and results depend on details such as how the end of freezing is defined, the container, and how much the water supercools. A 2016 study by Henry Burridge and Paul Linden found no evidence of the effect when the measurements were carefully controlled.", "more": ["Interest has since spread beyond water. In 2020, researchers reported Mpemba-like effects in other systems, such as tiny particles suspended in liquid, where a system that starts further from equilibrium can sometimes reach it faster. This suggests the idea can apply to other materials, even if the original water claim remains disputed.", "The observation is much older than Mpemba. Aristotle, Francis Bacon and René Descartes each wrote about water that seemed to freeze faster after being heated, although their observations are hard to interpret."], "why": "The Mpemba effect is a good example of how a surprising claim can start good science, even when the answer is that the effect is rare or unreliable.", "dyk": ["Erasto Mpemba was a schoolboy in Tanzania when he noticed it.", "Aristotle wrote about a similar idea over 2,000 years ago.", "Scientists have also searched for Mpemba-like effects in other materials."], "src": [["Wikipedia — Mpemba effect", "https://en.wikipedia.org/wiki/Mpemba_effect"], ["Wikipedia — Erasto Mpemba", "https://en.wikipedia.org/wiki/Erasto_Mpemba"]]}, "The Great Wall of China is not visible from space with the naked eye": {"body": ["The idea that the Great Wall of China can be seen from space with the naked eye is a popular myth. The wall is very long, but it is generally only about 5 to 9 metres wide, and its materials of earth, stone and brick are close in colour to the land around it. From low Earth orbit, a few hundred kilometres up, it is extremely hard to pick out with the unaided eye.", "Astronauts say the same. China’s first astronaut, Yang Liwei, said after his 2003 flight that he could not see the wall, and other astronauts have reported that they could not make it out without help, although a few say that in perfect conditions and with a zoom lens it can be photographed. Other human-made features, such as cities, airports and roads, are easier to see."], "bg": "The myth is much older than spaceflight. Claims that the wall could be seen from the Moon appeared in print in the 18th century and again in the 1930s, long before anyone had left the ground in a rocket. Repeated in textbooks, it became a well-known fact. It is not true from the Moon either, where nothing human-made is visible.", "more": ["The Great Wall is not a single wall but a series of walls built by different dynasties over about 2,000 years. The best-known sections, made of brick and stone, were built mainly under the Ming dynasty from the 14th to 17th centuries, while earlier sections used rammed earth. A 2012 survey by China’s government reported the total length of all the walls, including trenches and natural barriers, as about 21,000 kilometres.", "The wall was built to defend against raids and to control borders and trade. Soldiers lived and worked in watchtowers and garrisons, and beacon fires on the towers sent warning signals along its length."], "why": "The Great Wall myth shows how a catchy claim can last for centuries, and it is a reminder to check popular facts before repeating them.", "dyk": ["The wall is mostly only a few metres wide.", "Yang Liwei, China’s first astronaut, said he could not see it from orbit.", "It was built by many dynasties over about 2,000 years."], "src": [["Britannica — Great Wall of China", "https://www.britannica.com/topic/Great-Wall-of-China"], ["Wikipedia — Great Wall of China", "https://en.wikipedia.org/wiki/Great_Wall_of_China"]]}, "A teaspoon of neutron star would weigh billions of tonnes": {"body": ["A neutron star is the collapsed core of a massive star, left behind after a supernova. It packs more mass than our Sun, typically around 1.4 to 2 times the Sun’s mass, into a ball only about 20 kilometres across, roughly the size of a city. The material inside is so dense that a teaspoonful would weigh several billion tonnes on Earth, comparable with a mountain.", "When a massive star runs out of fuel, its core collapses under its own gravity. The pressure is so great that protons and electrons are squeezed together to form neutrons, and the result is a dense ball made largely of neutrons. Only black holes are known to be denser."], "bg": "Estimates of the density depend on what is inside, which is still debated, because matter at these extremes cannot be recreated in laboratories. Scientists use observations of neutron stars, including their masses and sizes, to test theories of nuclear matter. The figures quoted for a teaspoon range from around a billion tonnes to ten billion tonnes or more.", "more": ["Many neutron stars spin rapidly and send out beams of radio waves from their magnetic poles, which sweep across space like a lighthouse beam. When the beam crosses Earth we detect pulses, and these stars are called pulsars. Some spin hundreds of times a second, and they keep time so accurately that astronomers use them like clocks.", "In 2017 astronomers detected gravitational waves from two neutron stars crashing together, and telescopes saw the explosion in light. The event, called a kilonova, showed that such collisions help create heavy elements such as gold and platinum."], "why": "Neutron stars let scientists test the laws of physics under conditions found nowhere on Earth, and their collisions help explain where heavy elements come from.", "dyk": ["The first pulsar was discovered in 1967 by Jocelyn Bell Burnell.", "Some neutron stars spin hundreds of times a second.", "Neutron stars have extremely strong magnetic fields."], "src": [["Britannica — Neutron star", "https://www.britannica.com/science/neutron-star"], ["Wikipedia — Neutron star", "https://en.wikipedia.org/wiki/Neutron_star"]]}, "Vatican City is the smallest country in the world": {"body": ["Vatican City is the smallest independent country in the world, covering only about 0.44 square kilometres, around the size of a large park, with a population of fewer than a thousand people. It is a walled city-state entirely surrounded by Rome, Italy, and it is the centre of the Roman Catholic Church and the home of the Pope.", "Despite its size it has most of the features of a country. It has its own post office and stamps, a radio station, a newspaper, a railway station, a pharmacy and a bank, as well as its own flag and anthem. The Swiss Guard, a small force of soldiers that has protected the Pope since 1506, is its best-known security force."], "bg": "Vatican City became an independent state in 1929 under the Lateran Treaty between the Holy See and Italy. Technically it is the Holy See, the Pope’s governing body, that is the sovereign power and has diplomatic relations with other countries, while Vatican City is the territory it uses, so some people distinguish between the two.", "more": ["Within its walls are some of the world’s most famous buildings and artworks, including St Peter’s Basilica, the Sistine Chapel with Michelangelo’s ceiling and the Vatican Museums. Millions of visitors come every year, and tourism and the sale of stamps, coins and souvenirs are important sources of income.", "Few people are citizens, and citizenship usually comes from working for the Church rather than from birth. Most residents are clergy, Swiss Guards or other staff, and many workers commute in from Rome. Italian is the language of daily administration, while Latin is used for official Church documents."], "why": "Vatican City shows how a country can be defined by an institution rather than by size, and it is a unique meeting point of religion, art and politics.", "dyk": ["Vatican City has a population of fewer than a thousand people.", "The Swiss Guard has protected the Pope since 1506.", "The Sistine Chapel ceiling was painted by Michelangelo."], "src": [["Britannica — Vatican City", "https://www.britannica.com/place/Vatican-City"], ["Wikipedia — Vatican City", "https://en.wikipedia.org/wiki/Vatican_City"]]}, "Babies are born with soft cartilage kneecaps": {"body": ["Babies are born with kneecaps, or patellae, that are made mostly of soft cartilage and not yet bone. Over the first few years of childhood the cartilage gradually hardens into bone in a process called ossification. Small areas of bone usually begin to appear between about three and five years old, and the kneecap is not fully bony until later in childhood or adolescence.", "The kneecap sits in front of the knee joint, held in a tendon that links the thigh muscles to the shin. It works like a pulley, increasing the leverage of the thigh muscles when you straighten your leg, and it protects the joint. A flexible cartilage kneecap is well suited to the bumps and falls of a baby learning to crawl and walk."], "bg": "The exact age at which ossification begins varies from child to child. The pattern is normal, because many of a baby’s bones begin as cartilage and are gradually replaced by bone as the child grows.", "more": ["Babies have around 300 bones at birth, many of them partly cartilage, while adults have 206 because many bones fuse together as we grow. The skull, for example, has soft gaps between its plates, which allow the head to pass through the birth canal and the brain to grow, and these close during early childhood.", "Bone growth in children takes place at growth plates, areas of cartilage near the ends of long bones that gradually turn into bone. When growth is finished in late adolescence the plates close, which is why X-rays can help doctors estimate a child’s age or remaining growth."], "why": "Knowing how bones develop helps doctors spot growth problems and understand why children’s injuries and recovery differ from adults’.", "dyk": ["The kneecap is the largest sesamoid bone in the body.", "Babies have around 300 bones, but adults have 206.", "X-rays of growth plates can help estimate a child’s age."], "src": [["Britannica — Patella", "https://www.britannica.com/science/patella"], ["Wikipedia — Patella", "https://en.wikipedia.org/wiki/Patella"]]}, "The Sargasso Sea has no coastline": {"body": ["The Sargasso Sea is a region of the North Atlantic Ocean, east of Bermuda, and it is the only sea in the world with no coastline. Instead of land, it is bounded by ocean currents that circle it clockwise: the Gulf Stream to the west, the North Atlantic Current to the north, the Canary Current to the east and the North Atlantic Equatorial Current to the south. Together they form the North Atlantic Gyre.", "It is named after sargassum, a floating brown seaweed that drifts in large mats on the surface. The seaweed provides food and shelter for many animals, including fish, crabs, shrimp, turtles and seabirds, and some species found there live nowhere else. The water is also unusually clear, deep blue and warm, with few nutrients."], "bg": "Because it is defined by currents, the Sargasso Sea has no fixed borders, and its edges shift. Its area is often given as about 3.5 million square kilometres, but that varies. The seaweed mats are not solid islands, as old sailing stories suggested, and ships were not trapped, although calm winds in the region could slow them.", "more": ["The Sargasso Sea is the breeding ground of both European and American eels. Adults travel thousands of kilometres from rivers in Europe and North America to spawn there, and their tiny, leaf-shaped larvae drift back on ocean currents. For a long time the eels’ life cycle was a mystery, until the Danish biologist Johannes Schmidt traced the smallest larvae to the Sargasso Sea in the early 1900s. No one has ever seen the eels spawn in the wild.", "The region also faces threats from pollution, including floating plastic collected by the gyre, and from shipping. In 2014 several governments signed a declaration to protect the Sargasso Sea, a rare attempt to protect a large area of ocean beyond national waters."], "why": "The Sargasso Sea shows that an ocean habitat can be defined by moving water, and it is an important nursery and a reminder of how pollution gathers in ocean gyres.", "dyk": ["It is the only sea with no coastline.", "Eels travel there from Europe and North America to breed.", "Christopher Columbus recorded the floating seaweed in 1492."], "src": [["Britannica — Sargasso Sea", "https://www.britannica.com/place/Sargasso-Sea"], ["Wikipedia — Sargasso Sea", "https://en.wikipedia.org/wiki/Sargasso_Sea"]]}, "Wi-Fi does not stand for anything": {"body": ["Wi-Fi is the name for the wireless technology that connects phones, laptops and other devices to the internet, usually through a router. It is based on a family of radio standards called IEEE 802.11, created by the Institute of Electrical and Electronics Engineers. The name Wi-Fi was chosen in 1999 by a branding company, Interbrand, as a catchy label for the technology.", "Many people think Wi-Fi stands for wireless fidelity, as a play on hi-fi. But the Wi-Fi Alliance, the industry group that owns the brand, has said that it does not stand for anything. Early marketing used the phrase The Standard for Wireless Fidelity, which helped the explanation spread, but it was only a tagline."], "bg": "It is true that Wi-Fi is not an abbreviation, but the history is slightly messy. For a while the Wi-Fi Alliance itself used the phrase wireless fidelity in its materials, which is why the explanation became so widespread. It later dropped the tagline, and people involved have confirmed that the name was just a brand.", "more": ["Wi-Fi uses radio waves, usually in the 2.4 and 5 gigahertz bands and, more recently, 6 gigahertz. Data is carried by changing the radio signal in ways the receiver can read. Newer versions have brought much higher speeds, from 2 megabits per second in 1997 to several gigabits per second today.", "A key early step was research by Australia’s national science agency, CSIRO, which developed methods to make indoor wireless data more reliable. Its patents were used in the standard, and the organisation later won settlements from technology companies. The story shows how scientific research can underpin everyday devices."], "why": "Wi-Fi shows how a simple name and a shared standard can make a technology part of everyday life, and it is a good example of how technology myths spread.", "dyk": ["The first version of the standard, in 1997, ran at 2 megabits per second.", "Wi-Fi uses radio waves in the same bands as some microwave ovens.", "The Wi-Fi Alliance certifies devices that follow the standards."], "src": [["Britannica — Wi-Fi", "https://www.britannica.com/technology/Wi-Fi"], ["Wikipedia — Wi-Fi", "https://en.wikipedia.org/wiki/Wi-Fi"]]}, "The Rubik’s Cube has about 43 quintillion positions": {"body": ["The Rubik’s Cube has 43,252,003,274,489,856,000 possible positions, about 43 quintillion, and only one of them is solved. The cube was invented in 1974 by Ernő Rubik, a Hungarian architecture professor, who built it as a teaching tool to help students understand three-dimensional movement. He was surprised when he could not solve it himself, and it took him about a month to work out how.", "It was first called the Magic Cube in Hungary and was licensed to the Ideal Toy Corporation, which renamed it Rubik’s Cube in 1980. It became a worldwide craze, and hundreds of millions have been sold. Each of the six faces is made of nine coloured squares, and the puzzle is solved when each face is a single colour."], "bg": "The number of positions comes from counting all the ways the pieces can be arranged while obeying the cube’s mechanical limits. Only one in twelve of all conceivable arrangements can actually be reached by turning the faces. Larger cubes, such as the 4x4x4 and 5x5x5, have vastly more positions.", "more": ["In 2010 a team of mathematicians and computer scientists, using computer time donated by Google, proved that any position can be solved in at most 20 moves, a number nicknamed God’s number. The calculation took about 35 years of computer time.", "Speedcubing is a sport. Competitors solve the cube in a few seconds using memorised sequences of moves, and there are separate records for one-handed and blindfolded solving."], "why": "The Rubik’s Cube shows how a simple object can contain huge complexity, and studying it has led to advances in mathematics, computing and problem solving.", "dyk": ["Ernő Rubik invented the cube in 1974.", "Any scrambled cube can be solved in at most 20 moves.", "The world record for solving it is only a few seconds."], "src": [["Britannica — Rubik’s Cube", "https://www.britannica.com/topic/Rubiks-Cube"], ["Wikipedia — Rubik's Cube", "https://en.wikipedia.org/wiki/Rubik%27s_Cube"]]}, "Young sunflowers follow the Sun": {"body": ["Young sunflowers follow the Sun. During the day the growing flower heads and leaves turn slowly from east to west, tracking its path across the sky, then swing back to face east during the night so they are ready for sunrise. The movement is called heliotropism, from the Greek words for sun and turning.", "The movement is driven by an internal body clock and by growth in the stem. Cells on the east side of the stem grow faster in the daytime and cells on the west side grow faster at night, bending the stem back and forth. A study in 2016 by researchers at the University of California, Davis showed that the plants kept moving in a regular cycle even in constant light, which suggests a built-in clock."], "bg": "Only young, growing sunflowers do this. Once the flower reaches maturity and the stem stops growing, the head stops moving and faces east for good. A common myth is that mature sunflower heads still follow the Sun all day, which is not the case.", "more": ["Facing east has a benefit. The study found that east-facing mature flowers warm up faster in the morning and attract more bees than flowers that were turned to face west, so they get more visits from pollinators. The warmth probably makes the flowers more attractive.", "Other plants also respond to the Sun or open and close with the light, in different ways. Many flowers open in the day and close at night, and some leaves fold at night, which are examples of plants’ daily rhythms."], "why": "Sunflowers show that plants have their own internal clocks, and research on them may help improve crop growth and pollination.", "dyk": ["The word heliotropism comes from Greek words for sun and turning.", "Mature sunflowers face east and stop moving.", "Sunflowers originated in North America."], "src": [["Britannica — Sunflower", "https://www.britannica.com/plant/sunflower-plant"], ["Wikipedia — Heliotropism", "https://en.wikipedia.org/wiki/Heliotropism"]]}, "Argentine ants built a supercolony that spans thousands of kilometres": {"body": ["The Argentine ant, native to South America, has built supercolonies on several continents, huge networks of nests in which ants from different nests treat one another as friends. A study published in 2009 found that a single supercolony stretches for about 6,000 kilometres along the Mediterranean coast, from Italy through France to Spain. Ants from far apart accepted each other, while they attacked ants from other supercolonies.", "Normally ants from different colonies fight, because they recognise nestmates by smell. In the supercolonies, however, the ants are so genetically similar that they all smell alike, so they cooperate instead of fighting. That lets them share food and workers and build millions of nests."], "bg": "Argentine ants have low genetic variation in their introduced range, because small founding groups carried only some of the original population’s diversity. That lack of variety may be one reason they stop fighting each other. In their native Argentina, colonies are smaller and do fight one another.", "more": ["Supercolonies help the ants outcompete native species. They can overwhelm native ants, and they tend aphids and scale insects for their honeydew, which can harm plants. The Argentine ant is now classed as one of the world’s worst invasive species and is a pest in homes and gardens.", "A similar supercolony in California stretches roughly 900 kilometres. Together these huge colonies show how one species, helped by people moving it around the world, can change the rules of ant society."], "why": "Supercolonies show how invasive species can change the rules of social behaviour, and they are a major challenge for farmers and conservationists.", "dyk": ["Argentine ants are native to South America.", "They have become invasive on several continents.", "Ants recognise nestmates by smell."], "src": [["Britannica — Argentine ant", "https://www.britannica.com/animal/Argentine-ant"], ["Wikipedia — Argentine ant", "https://en.wikipedia.org/wiki/Argentine_ant"]]}, "Bananas are slightly radioactive": {"body": ["Bananas are slightly radioactive because they are rich in potassium, and a tiny fraction of all natural potassium is a radioactive form called potassium-40. About 0.012 percent of potassium atoms are this isotope, which decays very slowly and gives off a small amount of radiation. Many foods containing potassium, such as potatoes, beans and nuts, also give off tiny amounts.", "The amount is far too small to matter. A banana gives a dose of roughly 0.1 microsieverts, much less than the natural background radiation a person receives every day from rocks, soil, the air and cosmic rays. The body also keeps its potassium levels steady, so eating more bananas does not make the dose add up."], "bg": "The banana equivalent dose is an informal unit, mostly used to explain radiation levels in a friendly way. It is not an official unit, and scientists point out that comparisons using it can be misleading, because the potassium in food is balanced by the body and is not the same as exposure from outside.", "more": ["Your own body is also radioactive. It contains potassium-40 and carbon-14, giving a typical adult thousands of radioactive decays every second, which is normal and harmless. Natural radioactivity has been present throughout the history of life.", "Potassium-40 has a half-life of about 1.25 billion years, so it has lasted since Earth formed. It is also used to date rocks: scientists measure how much has decayed into argon to work out how old volcanic rocks are."], "why": "Understanding natural radioactivity helps people put radiation risks in perspective, and the banana is a friendly way to see why tiny doses are part of everyday life.", "dyk": ["Potassium-40 makes up about 0.012% of natural potassium.", "Your own body contains potassium-40 too.", "Potassium-40 is used to date rocks."], "src": [["Britannica — Potassium", "https://www.britannica.com/science/potassium"], ["Wikipedia — Banana equivalent dose", "https://en.wikipedia.org/wiki/Banana_equivalent_dose"]]}, "The oldest known writing is about 5,000 years old": {"body": ["The oldest known writing is about 5,000 years old. It appeared in the ancient city of Uruk in Sumer, in what is now southern Iraq, around 3400 to 3200 BCE. It began as simple pictures and marks pressed into soft clay with a reed, used to keep track of goods such as grain, livestock and workers’ rations.", "Over time the signs developed into cuneiform, which means wedge-shaped, after the marks made by the reed. The signs came to stand for sounds as well as objects, so the script could record language and not just numbers. Many cultures used it, including the Akkadians, Babylonians and Assyrians, and it stayed in use for about 3,000 years."], "bg": "Writing may have been invented independently in several places, including Egypt, China and Mesoamerica, and the exact order is debated. Cuneiform is usually described as the oldest, but the earliest Egyptian hieroglyphs are almost as old. The earliest tablets are accounting records that are hard to read, so some scholars place the start of true writing slightly later.", "more": ["Cuneiform was used for far more than accounts. Clay tablets record laws such as the Code of Hammurabi, letters between kings, medical advice, mathematics and the Epic of Gilgamesh, one of the oldest works of literature. Hundreds of thousands of tablets survive in museums, and many are still unread.", "The script was lost for centuries and deciphered in the 1800s, thanks to a three-language inscription carved by the Persian king Darius I at Behistun, in what is now Iran. Scholars such as Henry Rawlinson copied it and used the Old Persian text to unlock the others."], "why": "Writing allowed knowledge to be stored and shared across time and distance, and cuneiform tablets give us direct voices from some of the first cities.", "dyk": ["Cuneiform means wedge-shaped.", "Scribes used reed styluses on wet clay.", "The Epic of Gilgamesh was written in cuneiform."], "src": [["Britannica — Cuneiform", "https://www.britannica.com/topic/cuneiform"], ["Wikipedia — Cuneiform", "https://en.wikipedia.org/wiki/Cuneiform"]]}, "You dream several times every night": {"body": ["Most people have several dreams every night, though they remember only a few, usually the last one before waking. Dreams happen in various stages of sleep, but the most vivid, story-like ones are mostly linked to REM sleep, short for rapid eye movement, when the brain is highly active and the eyes move quickly beneath the lids.", "A night of sleep runs through cycles of about 90 minutes, each with lighter and deeper stages and a spell of REM. Early cycles have short REM periods and later ones are longer, so the longest and most vivid dreams tend to happen in the morning. During REM most of your muscles are temporarily relaxed, which stops you acting out your dreams."], "bg": "How often we dream is hard to measure, because it relies on people’s reports and many dreams are forgotten. People woken from non-REM sleep also report dreams, though these tend to be shorter and less vivid. Scientists still debate why we dream, and there are several theories rather than one agreed answer.", "more": ["Theories include that dreaming helps the brain process emotions, consolidate memories or rehearse responses to threats, while others suggest it is a by-product of brain activity during sleep. Evidence supports links between sleep and memory, but the exact role of dreams is unproven.", "Rare conditions show why the muscle relaxation of REM matters. In REM sleep behaviour disorder, people physically act out their dreams, and doctors now recognise it as an early warning sign of some brain conditions, so it is an active area of research."], "why": "Understanding dreams and sleep stages helps researchers study memory, emotion and mental health, and shows why regular sleep matters.", "dyk": ["Adults typically spend about a quarter of their sleep in REM.", "Babies spend about half of their sleep in REM.", "Most people forget most of their dreams within minutes of waking."], "src": [["Wikipedia — Dream", "https://en.wikipedia.org/wiki/Dream"], ["Wikipedia — Rapid eye movement sleep", "https://en.wikipedia.org/wiki/Rapid_eye_movement_sleep"]]}, "The Stroop effect makes naming ink colours harder": {"body": ["The Stroop effect is a classic finding in psychology: it takes longer, and is harder, to name the colour of ink when the word printed in it spells a different colour. If the word “green” is printed in red ink, most people hesitate or make mistakes when asked to say the ink colour, because they cannot help reading the word.", "It was described in 1935 by the American psychologist John Ridley Stroop. Reading is so well practised that it happens automatically, while naming a colour needs more deliberate attention. When the two clash, the brain has to suppress the automatic response, and that takes a moment."], "bg": "The effect is very robust, but it does not mean that reading and colour naming are processed in a simple race. Researchers still debate how best to explain it, with theories involving attention, automatic processing and competition between responses.", "more": ["The Stroop test is used in research and in clinics as a measure of attention and cognitive control. Performance can be affected by tiredness, ageing and some conditions, and speed on the test is often used as a measure of how well people ignore distractions.", "Variants exist in other languages and with other tasks. People reading in a second language they know less well show a weaker effect in that language, which suggests that how automatic reading is plays a key role."], "why": "The Stroop effect shows how automatic habits can interfere with what we are trying to do, which matters for understanding attention and self-control.", "dyk": ["Stroop described the effect in 1935.", "People are faster when the word and the ink colour match.", "The test is still widely used in psychology."], "src": [["Wikipedia — Stroop effect", "https://en.wikipedia.org/wiki/Stroop_effect"], ["Wikipedia — John Ridley Stroop", "https://en.wikipedia.org/wiki/John_Ridley_Stroop"]]}, "Spreading out your study beats cramming": {"body": ["The spacing effect is one of the most reliable findings in memory research: information is remembered longer when study is spread over several sessions than when it is crammed into one. The German psychologist Hermann Ebbinghaus first described the pattern in the 1880s after testing his own memory with lists of nonsense syllables.", "Spacing works because forgetting a little between sessions forces the brain to work harder to retrieve the memory, which strengthens it. Studying for the same total time in several short, well-spaced sessions typically leads to better recall weeks or months later than one long session."], "bg": "Cramming can still work for a test the next day, which is why many students use it. The benefit of spacing shows up in long-term memory, not in how well something is known right after studying. The best gap depends on how long you need to remember the material.", "more": ["Spacing is often combined with retrieval practice, which means testing yourself instead of rereading. Both are described as desirable difficulties, because they feel harder but lead to better learning. Flashcard apps use algorithms to space reviews based on how well you knew each item.", "Research shows the effect in children and adults, with facts, vocabulary and skills, and in classrooms as well as laboratories. A practical rule is to review soon after learning and then at gradually widening intervals."], "why": "Knowing about the spacing effect can help anyone learn more efficiently, whether revising for exams or learning a language or a new skill.", "dyk": ["Ebbinghaus tested himself on nonsense syllables.", "Testing yourself helps more than rereading.", "Many flashcard apps use spaced repetition."], "src": [["Britannica — Hermann Ebbinghaus", "https://www.britannica.com/biography/Hermann-Ebbinghaus"], ["Wikipedia — Spacing effect", "https://en.wikipedia.org/wiki/Spacing_effect"]]}, "About half of people miss the gorilla": {"body": ["In 1999 psychologists Daniel Simons and Christopher Chabris made a short video of two teams passing basketballs, one in white shirts and one in black, and asked viewers to count the passes made by the white team. During the video a person in a gorilla suit walked into the middle of the scene, thumped their chest and walked off. About half of the viewers did not notice the gorilla at all.", "The result is a famous example of inattentional blindness: when attention is focused on one task, people can miss even large, unexpected things in plain view. It happens because we do not see everything in front of us. We see what we pay attention to, and attention is limited."], "bg": "The share who missed the gorilla depends on how difficult the counting task is and on the details of the video. In the original study about half missed it. The result does not mean that people are careless: it is a normal feature of attention, and it applies to experts too.", "more": ["Inattentional blindness has real-world effects. Studies of driving, aviation and medicine show that people can miss obvious things when focused on something else. In one study, expert radiologists searching a scan for lung nodules often missed a picture of a gorilla that had been added to it.", "The same researchers described related effects, such as change blindness, where people fail to notice changes in a scene that happen during a distraction. Both show that our sense of seeing the whole scene is partly an illusion built by the brain."], "why": "Understanding inattentional blindness explains how accidents can happen even to careful people, and why distractions such as phones can be so dangerous.", "dyk": ["The study won an Ig Nobel Prize in 2004.", "Around half of the viewers missed the gorilla in the original study.", "Expert radiologists have missed a gorilla image on a scan."], "src": [["Wikipedia — Inattentional blindness", "https://en.wikipedia.org/wiki/Inattentional_blindness"], ["Wikipedia — The Invisible Gorilla", "https://en.wikipedia.org/wiki/The_Invisible_Gorilla"]]}, "People are less likely to help when others are watching": {"body": ["The bystander effect is the finding that people are less likely to help someone in need when other people are present. It was studied by psychologists John Darley and Bibb Latané in the 1960s, after the 1964 murder of Kitty Genovese in New York, which was widely reported as having been witnessed by dozens of neighbours who did nothing.", "In their experiments, people who thought they were the only witness to an emergency, such as a seizure, were much more likely to help than those who thought others were also present. The explanation is diffusion of responsibility: each person assumes someone else will act, or looks to others to judge whether it is really an emergency."], "bg": "The Genovese story was exaggerated. Later research found that fewer people saw the attack than was reported, and some did call the police. The bystander effect is also not universal: a large analysis of real-life CCTV footage of public conflicts found that bystanders intervened in the great majority of cases, and more bystanders made help more likely.", "more": ["Experiments show the effect is strongest when a situation is ambiguous. If an emergency is clear and dangerous, people are more likely to act, and being part of a group whose members know each other also makes help more likely.", "Training can help. Studies suggest that teaching people about the bystander effect makes them more likely to step in, and some programmes teach safe ways to intervene, such as calling for help, distracting the aggressor or checking in with the person."], "why": "Knowing about the bystander effect can help people recognise the pull to wait for others and choose to act, and its history shows how a famous story can be simplified.", "dyk": ["Darley and Latané ran their first experiments in 1968.", "A study of CCTV footage found that most bystanders do step in during conflicts.", "Asking a specific person for help makes it more likely they will act."], "src": [["Wikipedia — Bystander effect", "https://en.wikipedia.org/wiki/Bystander_effect"], ["Wikipedia — Kitty Genovese", "https://en.wikipedia.org/wiki/Kitty_Genovese"]]}, "We notice evidence that agrees with us": {"body": ["Confirmation bias is the tendency to look for, notice and remember information that supports what we already believe, while ignoring or downplaying information that does not. It happens to everyone and often works without our noticing, which is why it is one of the most studied biases in psychology.", "It shows up in everyday choices. People tend to read news that matches their views, to ask questions likely to bring agreeable answers, and to treat evidence for their position as stronger than evidence against it. Experiments from the 1960s by Peter Wason showed it even in simple logic puzzles."], "bg": "Confirmation bias is not the same as lying or stubbornness, and it is not always irrational: using existing knowledge to interpret evidence is often sensible. The problem is that it can stop people from updating their views when evidence changes. Psychologists distinguish between searching selectively, interpreting selectively and remembering selectively.", "more": ["It can have serious effects. In science, researchers can see patterns they expect, which is why blinded studies and peer review are used. In investigations, early suspicions can shape how evidence is read, and in medicine a first diagnosis can colour how later results are seen.", "Some methods can reduce it. Deliberately looking for evidence that would prove you wrong, asking others to challenge your view and writing down predictions in advance all help. Awareness alone is not enough, so structured habits matter."], "why": "Recognising confirmation bias helps people make fairer decisions, weigh evidence better and understand why disagreements can be hard to resolve.", "dyk": ["Peter Wason studied the bias in the 1960s.", "Scientists use blinded experiments to reduce it.", "Looking for evidence against your own view helps."], "src": [["Wikipedia — Confirmation bias", "https://en.wikipedia.org/wiki/Confirmation_bias"], ["Wikipedia — Peter Wason", "https://en.wikipedia.org/wiki/Peter_Cathcart_Wason"]]}, "Neapolitan pizza making is recognised by UNESCO": {"body": ["In 2017 UNESCO added the art of the Neapolitan pizzaiuolo, the craft of making pizza in Naples, to its list of the intangible cultural heritage of humanity. The listing recognises the skills and traditions behind the pizza, not the food itself: the kneading and shaping of the dough by hand and the cooking in a wood-fired oven.", "Traditional Neapolitan pizza follows strict rules set out by an association in Naples and by European protected-status labels. The dough uses wheat flour, water, salt and yeast, is shaped by hand without a rolling pin, and is baked for only about a minute or two at around 450 to 500 degrees Celsius, which gives a soft centre and a charred, puffy edge."], "bg": "Pizza-like flatbreads were eaten around the Mediterranean for centuries, so Naples did not invent the idea of bread with toppings. The tomato topping only became common in the 1700s, after tomatoes brought from the Americas were accepted as food. The Margherita story, in which a pizza maker made a pizza for Queen Margherita in 1889, is often told, but historians doubt parts of it.", "more": ["Pizza became a world food in the 20th century. Italian emigrants took it to the United States, where it grew into many regional styles, from New York slices to Chicago deep dish. After the Second World War it spread across the world.", "The UNESCO listing was backed by a petition with hundreds of thousands of signatures. It also recognises the skills of the pizza maker, passed from generation to generation in the pizzerias of Naples through apprenticeships."], "why": "The listing shows that cultural heritage includes skills and everyday food traditions, not only monuments, and it helps keep craft knowledge alive.", "dyk": ["The classic Margherita is topped with tomato, mozzarella and basil.", "Authentic Neapolitan pizza is baked for about 60 to 90 seconds.", "UNESCO added the art of the pizzaiuolo in 2017."], "src": [["UNESCO — Art of Neapolitan ‘Pizzaiuolo’", "https://ich.unesco.org/en/RL/art-of-neapolitan-pizzaiuolo-00722"], ["Wikipedia — Neapolitan pizza", "https://en.wikipedia.org/wiki/Neapolitan_pizza"]]}, "Ketchup was once sold as medicine": {"body": ["Ketchup was once sold as medicine. In the 1830s an Ohio doctor, John Cook Bennett, began promoting tomato extract as a cure for digestive troubles, and in 1834 he published recipes for what he called tomato pills. Soon other sellers were advertising pills and tonics made from tomatoes, claiming they could cure everything from indigestion to jaundice.", "The craze did not last. The pills had no proven effect, and the fashion faded within a decade or so. Ketchup itself, however, stayed on the table and became a condiment, and in 1876 Heinz began selling bottled tomato ketchup."], "bg": "The tomato pills story is true but sometimes exaggerated. Bennett did promote tomato as a medicine, but claims that he sold millions of pills are not well supported. The word ketchup also did not begin with tomatoes: early English ketchups were made from mushrooms, walnuts or fish.", "more": ["The sauce has an unusual history. It began in southern China as a fermented fish sauce, probably called koe-chiap in the Hokkien language. British sailors brought it to Europe in the 1700s, where cooks made versions with mushrooms and walnuts, and tomato versions appeared in the United States in the early 1800s.", "Ketchup is now one of the best-selling condiments in the world. Its flavour comes from tomatoes, vinegar, sugar and spices, and it is rich in umami, the savoury taste, which may explain why it goes with so many foods."], "why": "The story is a reminder that foods and health claims have changed through history, and it shows how a modern condiment began as something quite different.", "dyk": ["The word may come from the Hokkien koe-chiap, meaning fish sauce.", "Early ketchups were made from mushrooms and walnuts.", "Heinz began selling tomato ketchup in 1876."], "src": [["Britannica — Ketchup", "https://www.britannica.com/topic/ketchup"], ["Wikipedia — Ketchup", "https://en.wikipedia.org/wiki/Ketchup"]]}};

(()=>{const ANCHOR="2026-11-22",FORCE={},cats=Object.keys(CATS),seenT=new Set();
  /* safety: never keep two facts with the same title */
  for(let i=FACTS.length-1;i>=0;i--){const k=FACTS[i].t.toLowerCase();if(seenT.has(k))FACTS.splice(i,1);else seenT.add(k)}
  const PRIO=c=>c==="Psychology"?0:c==="Food & Drink"?1:2,fixed=FACTS.filter(f=>f.d<ANCHOR),pool=FACTS.filter(f=>f.d>=ANCHOR),by={},shown={},tot={},out=[];
  cats.forEach(c=>shown[c]=0);fixed.forEach(f=>shown[f.c]=(shown[f.c]||0)+1);
  pool.forEach(f=>{(by[f.c]=by[f.c]||[]).push(f);tot[f.c]=(tot[f.c]||0)+1});
  const d=parse(ANCHOR);
  while(out.length<pool.length){const k=key(d);let c=FORCE[k];
    if(!c||!by[c]||!by[c].length)c=cats.filter(x=>by[x]&&by[x].length).sort((x,y)=>shown[x]-shown[y]||PRIO(x)-PRIO(y)||tot[x]-tot[y]||cats.indexOf(x)-cats.indexOf(y))[0];
    const f=by[c].shift();f.d=k;shown[c]++;out.push(f);d.setDate(d.getDate()+1)}
  FACTS.length=0;FACTS.push(...fixed,...out)})();

/* Daily fact: exact date match, else a clearly labelled archive fallback */
function todaysFact(){
  const t=todayKey(),f=byId(t);if(f)return{f,mode:"daily"};
  const first=FACTS[0].d,last=FACTS[FACTS.length-1].d;
  if(t<first)return{f:FACTS[0],mode:"early"};
  if(t<=last)return{f:published()[0],mode:"archive"};
  /* Past the last scheduled date: stay on the latest fact until new ones are added (nothing repeats) */
  return{f:FACTS[FACTS.length-1],mode:"end"}}
const isToday=d=>todaysFact().f.d===d;

/* Reading streak */
function dayBack(k,n){const d=parse(k);d.setDate(d.getDate()-n);return key(d)}
function streakCount(days,t){let n=0;while(days.includes(dayBack(t,n)))n++;return n}
function updateStreak(){
  const t=todayKey();let days=store.get("cur_days",null);
  if(!days){days=[];const o=store.get("cur_streak",null);if(o&&o.last){for(let i=0;i<o.n;i++)days.push(dayBack(o.last,i))}}
  const first=!days.includes(t);
  if(first){days.push(t);days=days.slice(-1000);store.set("cur_days",days)}
  const n=streakCount(days,t),txt="Reading streak: "+n+(n===1?" day":" days");
  $("#streak").textContent=txt;$("#streak2").textContent=txt;return{n,first}}
function showStreak(){
  if($("#skov"))return;
  const t=todayKey(),days=store.get("cur_days",[]),n=streakCount(days,t),dow=(parse(t).getDay()+6)%7,L=["M","T","W","T","F","S","S"];

  const close=()=>{o.style.transition="opacity .2s";o.style.opacity=0;setTimeout(()=>o.remove(),200);document.removeEventListener("keydown",esc)},esc=e=>{if(e.key==="Escape")close()};
  o.addEventListener("click",e=>{if(e.target===o||e.target.id==="skgo")close()});document.addEventListener("keydown",esc);document.body.appendChild(o)}
