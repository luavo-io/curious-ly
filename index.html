 dyk:["Plaster casts of voids left in the hardened ash show the shapes of some victims.","Pompeii is estimated to have had roughly ten to twelve thousand residents.","Archaeologists are still excavating parts of the site today."],
 src:[["Britannica — Pompeii","https://www.britannica.com/place/Pompeii"],["Britannica — Mount Vesuvius","https://www.britannica.com/place/Mount-Vesuvius"]]},
{d:"2026-12-07",t:"The largest animal ever eats creatures a few centimetres long",c:"Animals",
 lead:"The blue whale outweighs any known dinosaur, and lives on krill.",
 body:["Blue whales reach around 30 metres in length and weigh well over 100 tonnes, making them larger than any known dinosaur. Yet they feed on tiny animals called krill, which they filter from the water using baleen plates instead of teeth.","During feeding season a blue whale can eat several tonnes of krill a day. It lunges, gulps an enormous volume of water and krill, then pushes the water out through its baleen, trapping the food."],
 more:["Their calls are among the loudest sounds made by any animal and are mostly very low in pitch. Low-frequency sounds travel far in water, and scientists think blue whales may be able to communicate over long distances, though how far depends on ocean conditions.","Commercial whaling nearly wiped them out in the twentieth century. Hundreds of thousands were killed before an international ban on hunting in 1966, and populations are recovering slowly but remain far below their historic numbers.","Calves are huge from birth. A newborn is thought to be about seven metres long and to gain weight at a remarkable rate while nursing on rich milk.","Blue whales are also long-distance travellers, moving between cold, krill-rich feeding grounds and warmer waters, though the details of their migrations vary between populations. Satellite tags and listening devices on the seafloor are helping researchers follow these journeys."],
 bg:"Size records for blue whales are based on limited measurements and whaling records, so the largest individuals may have been somewhat larger or smaller than reported.",
 why:"Whales help move nutrients around the ocean, and their recovery from whaling is a case study in conservation.",
 dyk:["Blue whales are mammals: they breathe air through blowholes and nurse their young.","Their blow can rise several metres above the surface.","There are several subspecies, including the Antarctic blue whale and the smaller pygmy blue whale."],
 src:[["Britannica — Blue whale","https://www.britannica.com/animal/blue-whale"]]},
{d:"2026-12-08",t:"Four teenagers and a dog found a cave of 17,000-year-old paintings",c:"History",
 lead:"The Lascaux cave in France holds some of the best-known art of the Ice Age.",
 body:["The Lascaux cave in south-west France contains hundreds of paintings and engravings, most of them animals such as horses, deer, bulls and aurochs. They are thought to have been made around 17,000 years ago by Upper Palaeolithic people, using mineral pigments such as ochre and manganese.","The cave was found in 1940, when four teenage boys followed a dog into a hole left by a fallen tree, and it soon became famous for the scale and vividness of its Great Hall of the Bulls."],
 more:["Visitors damaged it. After the cave opened to the public, carbon dioxide from breath, humidity and light encouraged algae, fungus and mineral deposits, and it was closed to visitors in 1963 to protect the art.","A replica, Lascaux II, opened nearby in 1983, and later more complete replicas followed, so people can see the art without harming the original.","Researchers still debate what the paintings were for. Suggestions include hunting magic, storytelling, ritual or even astronomy, but there is no consensus, and the true meaning may never be known.","The artists were skilled. They used scaffolding to reach high surfaces, mixed pigments with care and made use of the natural shape of the rock to give the animals a sense of movement."],
 bg:"The date of about 17,000 years comes from radiocarbon dating of material in the cave, so it carries uncertainty. Lascaux is one of many painted caves, and some in Europe and Indonesia are older.",
 why:"Cave art shows that people in the Ice Age made complex images and shared symbolic ideas.",
 dyk:["The cave is in the Vézère valley, in the Dordogne region of France.","Chauvet Cave in France contains paintings thought to be over 30,000 years old.","Lascaux is part of a UNESCO World Heritage listing for the prehistoric sites of the Vézère Valley."],
 src:[["Britannica — Lascaux","https://www.britannica.com/place/Lascaux-Grotto"],["UNESCO — Vézère Valley","https://whc.unesco.org/en/list/85"]]},
{d:"2026-12-09",t:"The Bay of Fundy has tides as tall as a five-storey building",c:"Oceans",
 lead:"Between New Brunswick and Nova Scotia, the sea rises and falls by about as much as a five-storey building.",
 body:["The Bay of Fundy, between the Canadian provinces of New Brunswick and Nova Scotia, has the highest tides in the world, with a difference between high and low water of up to about 16 metres at its head. Roughly 100 billion tonnes of seawater flow in and out with each tide, a volume often compared with the combined flow of all the world’s rivers.","The reason is resonance. The bay’s shape and depth mean that a tidal wave takes about 13 hours to travel to its head and back, almost matching the rhythm of the ocean tides outside. Each pull from the Moon’s gravity therefore arrives just as the water is ready to move again, like pushing a child on a swing at exactly the right moment."],
 more:["At low tide the sea floor is exposed far out, and people can walk on the ocean bed where boats floated hours earlier. The tide can return quickly, so visitors are warned to watch the clock.","The rushing water creates tidal bores, waves that travel up rivers against the current, and powerful tidal currents. Some are strong enough that engineers have tested tidal turbines in the bay to generate electricity.","The mudflats are rich in food and attract huge flocks of migratory shorebirds, especially semipalmated sandpipers, which stop to feed before flying south.","The tidal range is not the same everywhere in the bay. It is smallest at the mouth and grows towards the narrowing, shallowing head, where the water is funnelled into a smaller and smaller space."],
 bg:"Exact heights vary with the Moon’s cycle, the weather and where in the bay they are measured. The 16 metre figure is for the largest tides at the head of the bay.",
 why:"It is a clear example of resonance, and of how geography can amplify natural forces, with potential for tidal power.",
 dyk:["Tides are caused mainly by the Moon’s gravity, with the Sun’s adding to it.","The biggest tides, spring tides, happen around new and full moon.","Joggins Fossil Cliffs, on the bay’s shore, is a UNESCO World Heritage Site."],
 src:[["Britannica — Bay of Fundy","https://www.britannica.com/place/Bay-of-Fundy"],["Britannica — Tide","https://www.britannica.com/science/tide"]]},
{d:"2026-12-10",t:"Farmers digging a well found an emperor’s clay army",c:"History",
 lead:"In 1974, a well in northern China struck thousands of life-sized warriors guarding a tomb.",
 body:["The Terracotta Army was discovered in 1974 by farmers digging a well near Xi’an, in China’s Shaanxi province. The figures guard the tomb of Qin Shi Huang, who unified China and became its first emperor, and who died in 210 BCE. Archaeologists estimate that the pits hold thousands of soldiers, with some estimates around 8,000, along with horses and chariots.","The figures were made with a degree of individuality. Their bodies were built from standard parts, but the faces, hairstyles and details were finished separately, so each seems different. They were originally painted in bright colours, but the paint has mostly flaked away after exposure to air."],
 more:["The tomb complex itself is huge. The emperor’s burial mound has not been opened, and ancient texts, including a description by the historian Sima Qian, describe elaborate chambers inside. Soil tests around the mound have found raised levels of mercury, which fits those descriptions, but the mound remains unopened.","Weapons found with the soldiers were real and functional, including bronze swords, spearheads and crossbow triggers, many remarkably well preserved.","The army is only part of the site. Other pits have yielded figures of acrobats, musicians and officials, and bronze birds, suggesting the tomb was meant to reproduce the emperor’s court in the afterlife.","Excavation continues slowly. Archaeologists work carefully because exposure to air damages the paint, and only part of the site has been dug."],
 bg:"Figures such as “8,000 soldiers” are estimates, because large parts of the site have not been fully excavated. The Qin dynasty itself was short, lasting only from 221 to 206 BCE.",
 why:"The site gives direct evidence of the organisation and craftsmanship of China’s first unified state.",
 dyk:["The site is a UNESCO World Heritage Site, listed in 1987.","Qin Shi Huang became king of the state of Qin at the age of 13 and emperor of a unified China in 221 BCE.","The Great Wall is associated with early work under Qin Shi Huang, though most of what survives today was built by later dynasties."],
 src:[["Britannica — Terracotta Army","https://www.britannica.com/topic/Terracotta-Army"],["UNESCO — Mausoleum of the First Qin Emperor","https://whc.unesco.org/en/list/441"]]},
{d:"2026-12-11",t:"The sky is blue because air scatters blue light the most",c:"Science",
 lead:"The same effect that colours the daytime sky paints sunsets red.",
 body:["Sunlight looks white but contains all the colours of the rainbow. As it passes through the atmosphere, molecules of gas scatter short wavelengths (blue light) much more strongly than long wavelengths (red light), a process called Rayleigh scattering. Scattered blue light reaches your eyes from every direction in the sky, so the sky looks blue.","At sunrise and sunset, sunlight travels through much more atmosphere to reach you. Most of the blue has been scattered out of the direct beam by then, leaving the reds and oranges that colour the horizon."],
 more:["Violet light scatters even more than blue, so why isn’t the sky violet? Several things contribute: the Sun emits less violet than blue, some violet is absorbed high in the atmosphere, and our eyes are less sensitive to violet. The mixture we see looks blue.","Rayleigh scattering is named after the British physicist Lord Rayleigh, who worked out in the 1870s how scattering depends on wavelength. It varies with the inverse fourth power of wavelength, so blue light is scattered several times more than red.","Clouds look white because their water droplets are much larger than gas molecules and scatter all colours of light about equally, so the scattered light stays white.","On the Moon, which has almost no atmosphere, the sky is black even in daytime. On Mars, fine dust scatters light differently, giving a butterscotch daytime sky and, remarkably, bluish sunsets."],
 bg:"A common myth says the sky is blue because it reflects the ocean. The relationship is the other way round: the sea partly looks blue because it reflects the sky, although water itself also absorbs red light.",
 why:"Scattering explains many everyday sights, and measuring how light scatters in the atmosphere helps scientists study air quality and climate.",
 dyk:["Sunsets can look especially vivid after volcanic eruptions or wildfires, because particles add to scattering.","Some insects, such as bees, use the pattern of polarised light in the sky to work out where the Sun is.","Light from the Sun takes about eight minutes to reach Earth."],
 src:[["NASA Space Place — Why is the sky blue?","https://spaceplace.nasa.gov/blue-sky/en/"],["Britannica — Lord Rayleigh","https://www.britannica.com/biography/John-William-Strutt-3rd-Baron-Rayleigh"]]},
{d:"2026-12-12",t:"The platypus lays eggs, senses electricity and has venom",c:"Animals",
 lead:"A mammal that seems to have been assembled from spare parts.",
 body:["The platypus, native to eastern Australia and Tasmania, is one of only five living species of egg-laying mammals, the monotremes. The others are four species of echidna. Females lay eggs, usually one to three, then nurse the hatchlings with milk, which seeps from patches of skin rather than from nipples.","It also hunts in an unusual way. Underwater, a platypus closes its eyes, ears and nostrils and finds prey, such as insect larvae and small crustaceans, with its bill, which contains thousands of sensors that detect touch and the faint electric fields produced by moving animals."],
 more:["Male platypuses have a venomous spur on each hind leg. The venom is not generally lethal to humans but is reported to cause severe, long-lasting pain, and it may play a role in competition between males in the breeding season.","When European scientists first saw a preserved specimen in the late 1700s, some reportedly suspected a hoax, thinking a duck’s bill had been stitched on to a mammal’s body.","Its genome, published in 2008, showed a mix of features, including genes linked to reptile-like egg-laying, bird-like traits and mammalian ones, reflecting its early branch on the mammal family tree.","Platypus numbers are hard to count because the animals are shy and live in burrows along riverbanks. Habitat change, drought and pollution are concerns, and the species is considered at risk."],
 bg:"Details of electroreception and venom are still being studied, and counts of wild populations are uncertain because of how hard the animals are to survey.",
 why:"Monotremes help biologists understand how mammals evolved, because they preserve features seen in early mammals.",
 dyk:["The platypus has no true stomach: its oesophagus connects directly to the intestine.","Baby platypuses are called puggles.","The echidna, a spiny relative, is also an egg-laying mammal."],
 src:[["Britannica — Platypus","https://www.britannica.com/animal/platypus"]]},
{d:"2026-12-13",t:"Andromeda is heading towards us, but a collision isn’t guaranteed",c:"Space",
 lead:"Our neighbouring galaxy is approaching the Milky Way, and the forecast keeps being revised.",
 body:["The Andromeda Galaxy, about 2.5 million light-years away, is the nearest large galaxy to the Milky Way and is moving towards us at roughly 110 kilometres per second. Because of that motion, astronomers have long expected the two galaxies to merge in the distant future, billions of years from now.","Even so, a merger is not certain. The prediction depends on measurements of Andromeda’s sideways motion, which are very hard to make, and newer analyses that include the influence of other nearby galaxies suggest the outcome is less clear than older estimates, which often quoted about four billion years."],
 more:["Even if the galaxies do merge, the stars themselves would almost never collide. The distances between stars are so vast that most would pass one another, though gravity would reshape both galaxies into a single, larger elliptical galaxy.","Andromeda is the farthest object most people can see with the naked eye. Under dark skies it appears as a faint smudge in the constellation Andromeda, and the light you see left it about 2.5 million years ago.","It is larger than the Milky Way in some measures, containing roughly a trillion stars, compared with an estimated 100 to 400 billion in our galaxy.","Andromeda also has a curious feature at its centre: a pair of bright nuclei, which may be the result of a past merger with a smaller galaxy."],
 bg:"Distances and speeds are measured with uncertainty, and predictions about galaxy mergers depend on estimates of dark matter and the motions of neighbouring galaxies, so timelines in different sources differ.",
 why:"Studying Andromeda gives us a close-up view of a galaxy like our own, and a test for models of how galaxies evolve.",
 dyk:["The Milky Way and Andromeda are the two largest galaxies in the Local Group.","The Triangulum Galaxy is a third large spiral in the group.","The Sun orbits the centre of the Milky Way once roughly every 225 to 250 million years."],
 src:[["Britannica — Andromeda Galaxy","https://www.britannica.com/place/Andromeda-Galaxy"]]},
{d:"2026-12-14",t:"A mouldy petri dish started the antibiotic age",c:"Science",
 lead:"Penicillin was noticed by chance in 1928, but turning it into a medicine took more than a decade of teamwork.",
 body:["In September 1928, the Scottish scientist Alexander Fleming returned to his laboratory at St Mary’s Hospital in London and noticed that a mould had contaminated a dish of Staphylococcus bacteria. Around the mould, the bacteria had been killed. Fleming identified the mould as Penicillium and named the active substance penicillin.","Fleming published his findings in 1929, but turning penicillin into a usable drug was difficult. In the late 1930s and early 1940s a team at Oxford led by Howard Florey and Ernst Chain, with Norman Heatley, worked out how to purify it and showed it could cure infected mice, then people."],
 more:["Early supplies were tiny. The first patient treated in 1941 improved at first, but the available penicillin ran out and he later died. Researchers even recycled the drug from patients’ urine to stretch the supply.","Large-scale production came with help from US laboratories and companies, which developed deep-tank fermentation and found a more productive mould strain. By 1944 enough was being made to treat Allied troops around the time of the D-Day landings.","Fleming, Florey and Chain shared the 1945 Nobel Prize in Physiology or Medicine. Fleming himself warned that misuse of penicillin could lead to resistant bacteria.","His warning proved right. Antibiotic resistance is now a major global health problem, which is why antibiotics should only be used when needed and as directed."],
 bg:"The idea that Fleming’s discovery was pure luck is a simplification. He was a skilled bacteriologist who recognised the significance of the clear zone, but turning the observation into a drug depended on the later work of others.",
 why:"Antibiotics transformed medicine, making many once-deadly infections treatable and surgery much safer.",
 dyk:["Penicillin works by interfering with the formation of bacterial cell walls.","Fleming had earlier discovered lysozyme, an enzyme in tears and saliva that destroys some bacteria.","Some people are allergic to penicillin, so doctors ask about allergies before prescribing it."],
 src:[["Britannica — Alexander Fleming","https://www.britannica.com/biography/Alexander-Fleming"],["Nobel Prize — Physiology or Medicine 1945","https://www.nobelprize.org/prizes/medicine/1945/summary/"]]},
{d:"2026-12-15",t:"In 1843, Ada Lovelace described a program for a machine that wasn’t built",c:"History",
 lead:"More than a century before electronic computers, a mathematician explained how a machine could be instructed.",
 body:["Ada Lovelace, daughter of the poet Lord Byron, worked with the inventor Charles Babbage on his proposed Analytical Engine, a mechanical general-purpose calculator. In 1843 she published an English translation of an article about the machine by the Italian engineer Luigi Menabrea, adding her own notes, which were longer than the article itself.","In one of those notes she set out a step-by-step method for the engine to calculate a sequence of Bernoulli numbers, often described as the first published computer program. The machine was never built, so the program was never run on it."],
 more:["Lovelace saw further than arithmetic. She suggested that the engine might work with symbols other than numbers, and speculated that it could one day compose music if the rules of harmony could be expressed in its operations.","She was also cautious. She wrote that the engine had no pretensions to originate anything and could only do what it was ordered to perform, a remark later quoted in debates about artificial intelligence.","Whether she was the first programmer is debated. Babbage had written earlier example programs for the engine, and historians disagree about how much of the Bernoulli method was hers, though her notes show original ideas and a clear grasp of the machine’s potential.","Lovelace died in 1852, aged 36. Her notes were rediscovered and reprinted in the twentieth century, and the programming language Ada, developed for the US Department of Defense, was named after her."],
 bg:"Credit for the first program is a matter of interpretation, because “program” and “first” can be defined in different ways, and the Analytical Engine was never completed.",
 why:"Lovelace’s notes show that ideas central to computing, such as general-purpose machines and programs, were being discussed long before electronic computers existed.",
 dyk:["Ada Lovelace Day, held every October, celebrates women in science and technology.","Babbage’s earlier Difference Engine was designed to calculate and print mathematical tables.","A working Difference Engine No. 2 was built from Babbage’s plans at London’s Science Museum in 2002."],
 src:[["Britannica — Ada Lovelace","https://www.britannica.com/biography/Ada-Lovelace"],["Britannica — Charles Babbage","https://www.britannica.com/biography/Charles-Babbage"]]},
{d:"2026-12-16",t:"Greenland isn’t as big as Africa, even if the map says so",c:"Geography",
 lead:"On many maps the two look similar in size, but Africa is about fourteen times larger.",
 body:["Greenland covers about 2.2 million square kilometres, while Africa covers about 30 million, roughly 14 times more. On many wall maps and web maps they look similar in size because of the Mercator projection, introduced by the Flemish cartographer Gerardus Mercator in 1569.","Any flat map of a round planet must distort something. The Mercator projection keeps angles and shapes accurate locally, which made it useful to sailors, because a straight line on the map is a path of constant compass bearing. The price is that areas become increasingly stretched towards the poles."],
 more:["The stretching is not small. On a Mercator map, an area near the poles is magnified many times compared with the same area near the equator, which makes countries such as Canada and Russia, and Antarctica, look far larger than they are compared with places such as India or Brazil.","Other projections make different trade-offs. Equal-area maps keep sizes right but distort shapes, while compromise projections, such as the Robinson and Winkel Tripel, balance both, which is why they are common in atlases.","Web maps adopted a version of Mercator because it keeps shapes sharp when you zoom in, which suits street-level navigation even though it distorts the world view.","The only distortion-free way to show the whole Earth is a globe, but a globe is hard to carry, so mapmaking has always involved choices about what to preserve and what to give up."],
 bg:"Areas quoted vary slightly with how land is counted, for example whether islands or ice are included, and the comparison is deliberately rounded.",
 why:"Understanding map projections helps us read maps critically, and see how a design choice can quietly shape our sense of the world.",
 dyk:["Mercator helped popularise the word “atlas” for a book of maps.","The Gall–Peters projection preserves area but distorts shape, and has been used in debates about how maps portray the world.","Mercator was also a skilled maker of globes and scientific instruments."],
 src:[["Britannica — Mercator projection","https://www.britannica.com/science/Mercator-projection"],["Britannica — Gerardus Mercator","https://www.britannica.com/biography/Gerardus-Mercator"]]},
{d:"2026-12-17",t:"The tallest tree on record is taller than a 30-storey building",c:"Nature",
 lead:"Coast redwoods reach heights few other living things can match, helped by a surprising supply of fog.",
 body:["Coast redwoods, native to a narrow strip of fog-bathed coast in northern California and southern Oregon, are the tallest trees on Earth. The tallest known living tree, nicknamed Hyperion, was measured at about 115.9 metres in 2006, taller than a 30-storey building and than the Statue of Liberty with its pedestal.","Fog helps them get that tall. Research shows redwoods can absorb moisture through their leaves, and fog drip adds water during dry summers, helping the trees get water to heights where gravity and friction make lifting it difficult."],
 more:["Lifting water to such heights is hard. Trees pull water up through narrow tubes by the tension created as water evaporates from the leaves, and the higher the tree, the stronger the pull needed. Some scientists think this limits the maximum height of trees to a little above 120 metres.","Redwoods also live long. Some coast redwoods are estimated to be over 2,000 years old, and they can resprout from stumps and burls after fire or logging, which helps old-growth groves persist.","An ecosystem lives in the canopy too. Researchers have found plants, soil and salamanders in the high branches of old redwoods, creating a whole world high above the forest floor.","Most of the original old-growth forest was logged. Only a small fraction of it remains, and protection of what is left began in the early twentieth century."],
 bg:"Heights are measured by climbing or laser and change as trees grow. Hyperion’s location is not publicised, and access to the area is restricted because trampling can harm the tree and its surroundings.",
 why:"Giant trees store large amounts of carbon and provide habitat for many species, making their protection important for climate and wildlife.",
 dyk:["Giant sequoias are the largest trees by volume, while coast redwoods are the tallest.","Redwoods have shallow roots that spread widely and intertwine with their neighbours.","The dawn redwood, a relative, was known only from fossils until living trees were found in China in the 1940s."],
 src:[["Britannica — Redwood","https://www.britannica.com/plant/redwood"],["US National Park Service — Redwood National and State Parks","https://www.nps.gov/redw/"]]},
{d:"2026-12-18",t:"On the dark seafloor, whole ecosystems run on chemistry",c:"Oceans",
 lead:"Hot springs in the deep ocean support thriving communities with no sunlight at all.",
 body:["In 1977 scientists exploring the Galápagos Rift in the submersible Alvin found hot springs on the seafloor surrounded by dense communities of animals, including giant tube worms, clams and mussels. Hydrothermal vents like these release water heated by magma, carrying dissolved chemicals such as hydrogen sulphide.","The base of the food web is chemosynthesis. Bacteria use energy from chemicals such as hydrogen sulphide to make food, instead of using sunlight as plants do. Many vent animals host these bacteria in their bodies and rely on them for nutrition."],
 more:["Vent fluids can be extremely hot, reaching around 400 °C, but the surrounding water is near freezing. The fluid does not boil because the pressure at those depths is so high, and life thrives in the narrow zone where hot and cold water mix.","Giant tube worms, Riftia pachyptila, can reach about two metres in length. As adults they have no mouth or gut and depend on symbiotic bacteria living inside them.","Vents have raised questions about the origin of life. Some scientists suggest that similar chemical-rich settings on the early Earth may have helped life begin, and similar processes may be possible on icy moons such as Europa and Enceladus, though this is a hypothesis.","New vents are still being found. Because they are small and scattered, and the deep ocean is hard to explore, researchers expect many more remain undiscovered, along with their unusual species."],
 bg:"The vents’ role in the origin of life is a hypothesis, and scientists disagree about where and how life began. Temperature figures refer to fluid emerging from chimneys, not to the surroundings.",
 why:"Vents show that life can flourish without sunlight, which widens the range of places where we might look for life beyond Earth.",
 dyk:["Black smokers are chimney-like vents that release dark, mineral-rich water.","Alvin, the submersible used in the 1977 discovery, is still in service after upgrades.","Vents form deposits of metal sulphides, which some companies are interested in mining, a subject of environmental debate."],
 src:[["Britannica — Hydrothermal vent","https://www.britannica.com/science/hydrothermal-vent"],["NOAA Ocean Exploration","https://oceanexplorer.noaa.gov/"]]},
{d:"2026-12-19",t:"There is a coldest possible temperature, and nothing quite reaches it",c:"Science",
 lead:"Absolute zero is the floor of the temperature scale, and physics says we can only approach it.",
 body:["Absolute zero is 0 kelvin, or −273.15 °C (−459.67 °F), the lowest possible temperature. At this point a system would have the least possible thermal energy, though atoms would still retain a small amount of motion from quantum effects, known as zero-point energy.","According to the third law of thermodynamics, absolute zero cannot be reached in a finite number of steps. Laboratories have cooled atoms to within billionths of a degree above it, but never exactly to zero."],
 more:["Matter behaves strangely at such temperatures. When certain atoms are cooled close to absolute zero, they can form a Bose–Einstein condensate, in which many atoms behave as a single quantum object. It was first created in the laboratory in 1995, work that won a Nobel Prize in Physics in 2001.","The Kelvin scale starts at absolute zero, so it has no negative numbers. It is named after Lord Kelvin, who proposed an absolute temperature scale in the nineteenth century.","Space is not at absolute zero. The background glow left over from the early universe, the cosmic microwave background, keeps empty space at about 2.7 kelvin, and the Boomerang Nebula, at around 1 kelvin, is the coldest known natural place.","Some materials show surprising behaviour when cold. Superconductors, for example, conduct electricity with no resistance below a critical temperature, a property used in MRI scanners and particle accelerators."],
 bg:"Physicists also talk about “negative temperatures” in special quantum systems. These are in fact hotter than any positive temperature, not colder than absolute zero, and they do not break the third law.",
 why:"Studying matter at extreme cold reveals quantum behaviour and underpins technologies such as MRI scanners and quantum computing research.",
 dyk:["One kelvin is the same size as one degree Celsius.","The Celsius scale is set by the properties of water, while the kelvin scale is anchored to absolute zero.","Liquid helium boils at about 4 kelvin, which is why it is used to cool superconducting magnets."],
 src:[["Britannica — Absolute zero","https://www.britannica.com/science/absolute-zero"],["Nobel Prize — Physics 2001","https://www.nobelprize.org/prizes/physics/2001/summary/"]]},
{d:"2026-12-20",t:"Babies have more bones than adults",c:"Science",
 lead:"You started life with far more bones than you have now.",
 body:["Adults have 206 bones, but babies are born with roughly 270 to 300 bony elements, depending on how you count. Many of these are separate pieces of bone or cartilage that gradually fuse as a child grows, which is why an adult has fewer bones than an infant.","The skull is a good example. A baby’s skull is made of several plates, held together by flexible joints and soft gaps called fontanelles. These allow the head to squeeze through the birth canal and the brain to grow, and the plates gradually fuse during childhood and adulthood."],
 more:["Bones are living tissue. They are constantly remodelled, with old bone broken down by cells called osteoclasts and new bone built by osteoblasts, so the adult skeleton is gradually renewed over roughly ten years.","The smallest bone is the stapes, in the middle ear, about three millimetres long, and the largest is the femur, or thighbone. Together with two other ear bones, the stapes carries sound vibrations from the eardrum to the inner ear.","Bone marrow, the soft tissue inside some bones, makes blood cells. In adults, red blood cells, white blood cells and platelets are produced in the marrow of bones such as the pelvis, the breastbone and the vertebrae.","Bone is also a store of minerals. The skeleton holds most of the body’s calcium, releasing it into the blood when needed, which is why diet and exercise matter for keeping bones strong."],
 bg:"The number of bones in a baby varies in sources because some bones are partly cartilage and some are counted as one piece or several, so ranges are given rather than a single figure.",
 why:"Knowing how bones form and renew explains why children heal fractures quickly and why bone density matters in later life.",
 dyk:["The hyoid bone in the neck is not directly connected to any other bone.","Babies’ bones are softer than adult bones because they contain more cartilage.","The human hand and wrist contain 27 bones."],
 src:[["Britannica — Human skeleton","https://www.britannica.com/science/human-skeleton"]]}
];

"2026-11-02":["Radar is how we know. Venus is shrouded in thick cloud, so its spin cannot be seen directly. From the early 1960s, radar signals bounced off its surface were used to track features and work out the slow, backwards rotation. NASA’s Magellan spacecraft later used radar to map most of the surface in the early 1990s.","The atmosphere behaves very differently from the ground beneath it. The upper cloud layers circle the planet in only about four Earth days, far faster than the planet turns, a pattern called super-rotation. Exactly why remains an active area of research."],
"2026-11-03":["An octopus’s brain is unusual. Commonly cited estimates give it around 500 million neurons, comparable to some mammals, with a large share located in the arms rather than the central brain. That lets the arms handle much of the detailed control locally.","The blue-blood trick is not unique to octopuses. Haemocyanin is used by many other molluscs and some arthropods, including squid, snails and horseshoe crabs. It is a different solution to the problem haemoglobin solves in vertebrates, and it works best in cold, low-oxygen water."],
"2026-11-04":["The process starts with bees. Foragers collect nectar and pass it to hive bees, whose enzymes break sucrose into the simpler sugars glucose and fructose. The bees then fan their wings to evaporate water until the honey reaches roughly 17–18% moisture, and seal each cell with wax.","People have long used honey on wounds. Medical-grade honey, such as manuka honey, is used in some modern dressings, but the strength of the evidence varies between conditions and products, so it is not a replacement for medical care."],
"2026-11-05":["The Great Pyramid was built for the pharaoh Khufu and originally stood about 146 metres tall. By most accounts it was the tallest human-made structure in the world for nearly four thousand years, until medieval European cathedral spires overtook it.","By Cleopatra’s lifetime the pyramids were already ancient monuments. Greek writers such as Herodotus had described them centuries earlier, though some of what they recorded was hearsay. Cleopatra’s reign ended in 30 BCE, when Egypt became a province of the Roman Empire."],
"2026-11-06":["The bananas sold around the world are almost all one variety, the Cavendish. These plants are propagated as clones from shoots rather than grown from seed, so plantations are genetically uniform. That makes them vulnerable to disease, and a fungus called Fusarium wilt Tropical Race 4 is a serious threat.","Botany has more surprises. Watermelons, cucumbers and pumpkins are classed as pepos, a special kind of berry with a tough rind, and oranges and lemons as hesperidia. The categories track how a fruit develops from the flower, not how it is eaten."],
"2026-11-07":["Oxford’s colleges came later than its teaching. University College, Balliol and Merton were all founded in the thirteenth century, and the collegiate system gradually became the university’s defining feature.","The Aztec timeline is shorter than most people assume. The Triple Alliance that formed the Aztec Empire dates to 1428, and Tenochtitlan fell to Spanish forces and their indigenous allies in 1521. Oxford’s teaching tradition was already centuries old when the empire rose."],
"2026-11-08":["A well-known fossil shark, Cladoselache, lived around 370 million years ago. It was streamlined and fast, with a body shape that looks surprisingly familiar, though its teeth and fins differ from those of modern sharks.","Sharks are covered in dermal denticles, small tooth-like scales that reduce drag, and they replace their teeth continually. Some species can go through thousands of teeth over a lifetime, which helps explain why shark teeth are so common as fossils."],
"2026-11-09":["Sunlight begins as fusion. In the core, hydrogen nuclei fuse to form helium, converting around four million tonnes of matter into energy every second. That energy eventually reaches us as light and heat.","The core is extremely hot, at roughly 15 million °C, while the visible surface is far cooler at about 5,500 °C. Energy flows outwards through a radiative zone and then a churning convective zone before it escapes."]

"2026-11-03":"Octopuses are also famous escape artists and problem-solvers. Laboratory studies have shown that some species can learn to open jars, navigate mazes and recognise individual people. Cephalopods are now covered by animal-welfare rules for research in places such as the European Union and the United Kingdom. Their lives are short, usually a year or a few years, which makes that intelligence especially striking.",
"2026-11-04":"Not all honey is identical. Its colour and flavour depend on the flowers the bees visited, from pale clover honey to dark buckwheat. Sugar content and acidity vary a little with the source, but the basic chemistry, low water and high sugar, keeps almost all honey resistant to spoilage. Crystallisation is natural and can be reversed by gently warming the jar.",
"2026-11-05":"Cleopatra was of largely Macedonian Greek descent, though her mother’s identity is uncertain. She belonged to the Ptolemaic dynasty founded by Ptolemy I, a general under Alexander the Great, and by ancient accounts was the first of her line to learn the Egyptian language. Egypt’s history spans many eras, with pharaohs, Persians, Greeks and Romans each ruling it, and the people living there saw the ancient monuments from very different vantage points.",
"2026-11-06":"In everyday speech “berry” is about size and sweetness, so a strawberry feels like a berry and a banana doesn’t. The botanical definition ignores that completely. It is a good example of why scientists use precise technical terms: ordinary words are shaped by cooking and culture, while botanical classification follows the structure of the flower and how the fruit forms. Neither usage is wrong; they simply answer different questions.",
"2026-11-07":"Comparisons like this are fun, but they need care. “Older than” depends on what counts as the beginning: Oxford’s start is a gradual process without a founding charter, while Tenochtitlan’s traditional date of 1325 comes from Mexica accounts recorded later, so exact years are uncertain. The broader point holds either way. Different parts of the world were building complex institutions at overlapping times, and the neat divide between a “medieval” Europe and a separate “ancient” Americas is misleading Historians cross-check both stories against archaeology and other records, which is how such dates are refined over time.",
"2026-11-08":"Sharks have also lasted through repeated mass extinctions, including the end-Permian event about 252 million years ago, the most severe in Earth’s history. That does not mean every shark lineage survived: many groups vanished, and today’s species are only a fraction of those that have existed. A large share of shark and ray species are now considered threatened, with overfishing a major cause, which makes their long history a reason for caution rather than complacency.",
"2026-11-09":"Sunlight is “old” in two senses. The light that reaches your eyes is about eight minutes old, but the energy it carries was released by fusion in the core far longer ago, on a timescale that is debated and depends on solar models. Either way, the Sun is a remarkably steady engine: it has shone with broadly similar brightness for billions of years and has roughly five billion years of fuel left.",
"2026-11-11":"Tides are not just an ocean story. The same gravitational tug flexes the solid Earth by tens of centimetres twice a day, and the energy lost as friction from all this flexing and sloshing is what ultimately transfers angular momentum to the Moon.",
"2026-11-12":"Scientists are careful about overclaiming. Tardigrades survive extremes only in their dried-out state, and the space experiments tested specific stresses, not the full mix of hazards a real journey would involve. Even so, the results are valuable: they show that complex animals can tolerate vacuum and radiation that would kill most life almost immediately, and they inform debates about how life might travel between worlds, a hypothesis called panspermia that remains unproven.",
"2026-11-13":"Antarctica’s dryness also shapes its wildlife. On land, the largest year-round animal is a wingless midge only a few millimetres long, while the surrounding ocean teems with krill, seals, penguins and whales. Almost all the continent’s life clings to the coast, and the interior is among the most barren landscapes on Earth.",
"2026-11-14":"Saturn was the most distant planet known to ancient observers, visible to the naked eye as a slow, yellowish point of light, and it takes about 29 Earth years to orbit the Sun. NASA’s Cassini spacecraft studied the planet, its rings and its moons for 13 years, ending in 2017 with a deliberate plunge into Saturn’s atmosphere to protect moons that might harbour habitable conditions, such as Enceladus. Its hexagon-shaped jet stream at the north pole was first seen by Voyager and later studied closely by Cassini."

"Bats are the only mammals capable of true flight|A|Other mammals glide, but only bats can flap their way through the air.|A bat’s wing is a modified hand, with long finger bones supporting a thin membrane of skin. This gives bats unusual manoeuvrability.|Bats make up about a fifth of all mammal species.|Many bats find food by echolocation.|Bat",
"The Eiffel Tower grows taller in summer|C|Heat makes the iron expand, lifting the tower by around 15 cm on hot days.|Most materials expand slightly when warmed. The tower’s iron structure is no exception, and its height changes with the temperature. The sun-facing side warms more, so the top can even lean slightly away from the Sun.|The tower was completed in 1889 for the World’s Fair.|It is repainted roughly every seven years.|Eiffel_Tower",

"The Great Wall of China is not visible from space with the naked eye|H|It is long, but it is narrow and blends into the landscape.|Astronauts have said it is very hard to pick out from low Earth orbit without aid. The wall is generally only a few metres wide, and its colour is close to the surrounding terrain.|A 2012 Chinese survey put all its sections at about 21,000 km.|It was built and rebuilt by many dynasties over centuries.|Great_Wall_of_China",
"A year on Mercury lasts only 88 Earth days|S|The closest planet to the Sun races round it, yet its days are very slow.|Mercury orbits the Sun in about 88 Earth days. It spins so slowly that one sunrise to the next takes about 176 Earth days, twice as long as its year.|Mercury has almost no atmosphere.|Despite being closest to the Sun, it is not the hottest planet.|Mercury_(planet)",
"The Milky Way holds hundreds of billions of stars|S|Our galaxy is a spiral of at least 100 billion stars, and the Sun is one of them.|Estimates range from 100 to 400 billion stars. The Sun lies in one of the spiral arms, about 26,000 light-years from the galactic centre, and takes roughly 230 million years to orbit it.|A supermassive black hole sits at the galaxy’s centre.|Most stars in the Milky Way have planets, according to current estimates.|Milky_Way",
"Water has a “triple point” where it is ice, liquid and vapour at once|C|At the right temperature and pressure, all three forms of water coexist.|The triple point is at 0.01 °C and about 0.006 atmospheres of pressure. It was once used to define the kelvin, the unit of temperature.|The kelvin was redefined in 2019 using a fixed physical constant.|Other substances have their own triple points.|Triple_point",
"Hot water sometimes freezes faster than cold, but nobody is sure why|C|The Mpemba effect is reported in some experiments, but it is hard to reproduce.|Explanations have been proposed, including evaporation, dissolved gases and convection, but experiments disagree. Some researchers suspect the effect is not real in many cases.|It is named after Erasto Mpemba, a Tanzanian student who noticed it in the 1960s.|Aristotle may have mentioned something similar.|Mpemba_effect",
"Bananas are slightly radioactive|C|They contain potassium-40, a natural radioactive isotope found in all potassium.|The radiation from a banana is tiny and harmless. The “banana equivalent dose” is an informal unit that compares small radiation doses with the dose from eating one.|Your own body contains potassium-40 too.|Potassium-40 is about 0.012% of natural potassium.|Banana_equivalent_dose",
"Crows remember human faces|A|Wild crows have been shown to recognise people who threatened them and to pass on the grudge.|In studies by researchers led by John Marzluff, crows scolded people wearing a mask used during capture, even years later. Other crows that had not been caught also joined in.|Corvids such as crows and ravens use tools.|New Caledonian crows can shape hooks from twigs.|Crow",
"The mantis shrimp has one of the fastest punches in nature|A|Its club-like claws strike at about the speed of a bullet from a small-calibre rifle.|The strike is powered by a spring-like mechanism. It is so fast that it creates cavitation bubbles in the water, and the collapse of those bubbles adds a second blow.|Mantis shrimp eyes have many types of colour receptor.|They can break shells and even aquarium glass.|Mantis_shrimp",
"The Pacific Ocean is larger than all of Earth’s land combined|O|Its area is about 165 million km², compared with about 149 million km² of land.|The Pacific holds roughly half of the open ocean’s water. It contains the Mariana Trench, the deepest known place on Earth.|It is named after the Latin for “peaceful”, a name given by Magellan.|It is bordered by the Ring of Fire, a belt of volcanoes and earthquakes.|Pacific_Ocean",
"Most of the seafloor had not been mapped to modern standards until recently|O|Seabed 2030 aims to chart the entire ocean floor by the end of this decade.|As of recent reports, only about a quarter of the seafloor had been mapped in high detail. We know the surface of Mars and the Moon in more detail than much of our own ocean floor.|The project is a collaboration between the Nippon Foundation and GEBCO.|Ships use sonar to map the seabed.|Seabed_2030",
"Sloths grow algae in their fur|A|Their slow lives and grooved hairs make a home for green algae that helps camouflage them.|Sloths move slowly and rarely groom, and their hair has tiny grooves where algae and other organisms grow. They usually come down from the trees about once a week to defecate.|Sloths have a very slow metabolism.|They can rotate their heads far further than most mammals.|Sloth",
"Argentine ants built a supercolony that spans thousands of kilometres|A|A 2009 study found one huge colony from Italy through France to Spain.|Genetic and behavioural tests showed that the ants along about 6,000 km of Mediterranean coast treated one another as nestmates rather than enemies, and so formed one enormous colony.|Argentine ants are native to South America.|They have become invasive on several continents.|Argentine_ant",
"Dolphins sleep with half their brain at a time|A|One half of the brain rests while the other stays alert, so they can keep surfacing to breathe.|This is called unihemispheric slow-wave sleep. Dolphins breathe consciously, and need to stay partly awake to reach the surface for air.|Some birds also show this kind of sleep.|Newborn dolphins and their mothers stay active for the first weeks.|Unihemispheric_slow-wave_sleep",
"Phytoplankton make about half of Earth’s oxygen|O|Tiny drifting ocean organisms do a huge share of the planet’s photosynthesis.|Phytoplankton are microscopic plant-like organisms that use sunlight to make food and release oxygen. Estimates suggest they generate roughly half of the oxygen produced each year, though figures vary.|They also form the base of most marine food webs.|Some blooms are large enough to see from space.|Phytoplankton",
"Coast redwoods drink fog|N|Redwoods absorb water through their leaves, and fog is a key part of their supply.|Coast redwoods grow along a foggy strip of the Pacific coast. Fog condenses on their needles and drips to the ground, and the trees can also take in water directly through their foliage.|Redwoods are among the tallest trees on Earth.|Some live for over 2,000 years.|Sequoia_sempervirens",
"A Venus flytrap counts before it snaps shut|N|The trap closes only after two touches within about twenty seconds.|Tiny trigger hairs on the leaf detect movement. A single touch does nothing, which stops the plant wasting energy on raindrops or debris. More touches tell the plant it has caught something alive.|The plant is native to a small region of North and South Carolina.|It digests insects to get nutrients that its poor soil lacks.|Venus_flytrap",
"Some bamboo can grow almost a metre in a day|N|Bamboo is among the fastest-growing plants on Earth.|Record growth of about 91 cm in 24 hours has been reported for some species. Bamboo is a grass, not a tree, and its stems grow from the base in segments.|Many bamboo plants flower only once every several decades.|Bamboo is a staple food of giant pandas.|Bamboo",
"Seen from above, a rainbow is a full circle|S|The arc we see from the ground is just part of a circle that the horizon cuts off.|Rainbows form when sunlight refracts and reflects inside water droplets. From an aircraft, or a high viewpoint with droplets below, you can sometimes see a complete circle.|Every person sees their own rainbow, from their own viewpoint.|Double rainbows have their colours reversed in the outer arc.|Rainbow",
"Glass is not a slow-flowing liquid|C|Old windows are thicker at the bottom for other reasons, not because the glass flowed.|Glass is an amorphous solid. At room temperature it does not flow noticeably, even over centuries. Older panes were made by methods that produced uneven sheets, and glaziers often placed the heavy edge down.|Glass is mostly made from silica sand.|Natural glass such as obsidian forms in volcanoes.|Glass",
"Sound travels about four times faster in water than in air|C|In seawater sound moves at roughly 1,500 metres per second, against about 343 in air.|Sound is a pressure wave, and it passes faster through denser, less compressible media. Whales and submarines make use of this to communicate and navigate over long distances.|The speed of sound in air depends on temperature.|Sound cannot travel through a vacuum.|Speed_of_sound",
"It may rain diamonds inside Neptune|S|Laboratory experiments suggest that carbon deep in ice giants could crystallise into diamond.|The idea is that extreme heat and pressure could split methane, releasing carbon that forms diamonds that sink slowly towards the core. Experiments have recreated similar conditions, but nobody has seen it directly.|Neptune has the strongest winds of any planet in our Solar System.|It takes about 165 Earth years to orbit the Sun.|Neptune",
"Jupiter has the shortest day of any planet|S|It spins once in about 9 hours and 56 minutes despite being enormous.|That fast spin flattens the planet slightly at the poles and drives its banded cloud patterns. Jupiter is a gas giant, so different latitudes rotate at slightly different rates.|Jupiter has more than 90 known moons.|Its mass is more than twice that of all other planets combined.|Jupiter",
"Uranus spins on its side|S|Its axis is tilted about 98 degrees, so it rolls around the Sun like a ball.|One leading theory is that a giant impact knocked the planet over early in its history. Because of the tilt, each pole gets about 42 years of sunlight, then 42 years of darkness.|Uranus was the first planet discovered with a telescope, in 1781.|It has faint rings and 27 known moons.|Uranus",
"Titan has lakes and rivers, but of methane|S|Saturn’s largest moon is the only other world known to have stable liquid on its surface.|Cassini and its Huygens probe found seas of liquid methane and ethane near Titan’s poles. It also has a thick nitrogen atmosphere and weather, including methane rain.|Huygens landed on Titan in 2005.|NASA’s Dragonfly rotorcraft is planned to explore it.|Titan_(moon)",
"A tiny patch of sky revealed thousands of galaxies|S|The Hubble Deep Field looked at a speck of sky the size of a grain of sand held at arm’s length.|In 1995 Hubble stared at an apparently empty patch for days. The image revealed around 3,000 galaxies, many of them very distant and young.|Later deep fields have found even more.|It suggests there are hundreds of billions of galaxies.|Hubble_Deep_Field",
"A little of the static on an old TV was the Big Bang’s afterglow|S|The cosmic microwave background is radiation left over from the early Universe.|It was released about 380,000 years after the Big Bang, when the Universe cooled enough to become transparent. It has been stretched to microwave wavelengths as space expanded.|It was discovered by accident in 1964.|It is remarkably uniform, with tiny variations that seeded galaxies.|Cosmic_microwave_background",
"The Sun is about 400 times wider than the Moon, and 400 times farther away|S|That coincidence makes them look almost the same size in our sky.|The match allows total solar eclipses, when the Moon covers the Sun’s disc. Because the Moon is slowly drifting away, this will stop being true in the very distant future.|Totality lasts only a few minutes at most.|The Sun’s outer atmosphere, the corona, is visible during totality.|Solar_eclipse",
"The oldest known writing is about 5,000 years old|H|Cuneiform began in Mesopotamia as marks pressed into clay to track goods.|Early Sumerian tablets from around 3400 to 3200 BCE recorded grain, livestock and labour. Over time the signs developed to represent sounds and could be used for literature and law.|Scribes used reed styluses on wet clay.|The Epic of Gilgamesh was written in cuneiform.|Cuneiform",
"The shortest war in history lasted under an hour|H|The Anglo-Zanzibar War of 1896 is usually said to have lasted about 40 minutes.|Britain bombarded the palace in Zanzibar after a new sultan took power without British approval. Sources give the duration as between about 38 and 45 minutes.|The sultan fled and a pro-British replacement was installed.|It happened on 27 August 1896.|Anglo-Zanzibar_War",
"Vikings reached North America about 500 years before Columbus|H|Archaeology at L’Anse aux Meadows in Newfoundland dates a Norse camp to around 1000 CE.|Excavations found the remains of sod buildings and iron-working. Research on tree rings in 2021 pinned one date to the year 1021 CE.|The Norse sagas describe a land they called Vinland.|The site is a UNESCO World Heritage Site.|L'Anse_aux_Meadows",
"Roman concrete may heal its own cracks|H|Tiny lumps of lime in the mix could react with water to seal cracks over time.|A 2023 study by MIT researchers and others suggested that the lime clasts, often seen as a sign of poor mixing, were deliberate and helped the concrete repair itself. Many Roman structures, such as the Pantheon, have lasted for about 2,000 years.|The Pantheon’s dome is still the world’s largest unreinforced concrete dome.|Roman builders added volcanic ash to the mix.|Roman_concrete",
"Machu Picchu was built without mortar|H|Inca masons cut stones so precisely that they fit together without any binding material.|The citadel was built in the mid-1400s, perhaps as a royal estate for the emperor Pachacuti. Walls built this way flex during earthquakes rather than collapsing.|It sits high in the Andes at about 2,430 m.|It was abandoned during the Spanish conquest and later rediscovered by the wider world in 1911.|Machu_Picchu",
"Stonehenge’s stones came from far away|H|Some of its stones travelled around 225 km from Wales, and the Altar Stone came from much further north.|The smaller bluestones come from the Preseli Hills in Wales. A 2024 study traced the six-tonne Altar Stone to north-east Scotland, much farther than previously thought.|The main circle was built about 4,500 years ago.|How the stones were moved is still debated.|Stonehenge",
"A 5,300-year-old man was found frozen in the Alps|H|Ötzi the Iceman is among the best-preserved natural mummies ever found.|Hikers found him in 1991 on the Italian-Austrian border. Scientists have identified his last meal, his tattoos and his copper axe, and the arrowhead lodged in his shoulder suggests he died violently.|His body is displayed in a museum in Bolzano, Italy.|Study of his DNA has revealed relatives who live today.|Ötzi",
"Polynesian navigators crossed the Pacific without instruments|H|They read stars, swells and birds to find tiny islands across vast ocean.|Wayfinders memorised star paths and used patterns of ocean swell, cloud shapes and seabird flights. Their voyaging canoes settled islands from Hawaii to Aotearoa New Zealand.|The Hōkūle‘a, a modern voyaging canoe, has sailed around the world using traditional methods.|Pacific settlement was among the greatest feats of exploration.|Polynesian_navigation",
"The sky-high price of a tulip bulb: Tulip Mania|H|In 1630s Holland, prices for rare bulbs soared, though historians debate how big the crash really was.|Tulip bulbs became fashionable and contracts to buy them rose sharply until early 1637. Some historians argue the story has been exaggerated and that the economic damage was limited.|The word “bubble” is often linked to this episode.|Tulips originated in Central Asia, not the Netherlands.|Tulip_mania",
"The Sahara was once green|G|Around 11,000 to 5,000 years ago, rains turned much of it into grassland with lakes.|This “African Humid Period” was triggered by slow changes in Earth’s orbit that strengthened monsoon rains. Rock art in the desert shows animals such as giraffes and cattle.|The change back to desert took place over centuries.|Today it is the world’s largest hot desert.|African_humid_period",
"The Nile flows north|G|One of the world’s longest rivers runs from the highlands towards the Mediterranean Sea.|The Nile has two main branches, the White Nile and the Blue Nile, which meet at Khartoum in Sudan. Because Egypt lies downstream, “Upper” Egypt is in the south and “Lower” Egypt is in the north.|Ancient Egyptians relied on its yearly floods.|The Aswan High Dam now controls the floods.|Nile",
"Iceland is splitting apart|G|The island sits on the boundary between the North American and Eurasian plates, which are slowly pulling apart.|The plates drift apart by roughly two centimetres each year, and you can walk or snorkel in the rift at Þingvellir. Volcanic activity fills the gap with new rock.|Iceland’s parliament, the Althing, first met at Þingvellir in 930 CE.|Most Icelandic homes use geothermal heat.|Iceland",
"The Atacama Desert has places that almost never see rain|G|Some weather stations in this Chilean desert have gone years without recording rain.|The Atacama is sandwiched between the Andes and the cold Pacific, which together block moisture. Parts of it are used by scientists to test Mars rovers.|It is often described as the driest non-polar desert on Earth.|Some towns collect water from fog.|Atacama_Desert",
"Angel Falls is the tallest waterfall in the world|G|Venezuela’s waterfall drops 979 metres, much of it in one uninterrupted plunge.|The water falls so far that it can turn to mist before it reaches the bottom. The falls are in Canaima National Park and were named after the American aviator Jimmie Angel.|The local Pemon name is Kerepakupai Merú.|The falls are hard to reach and are usually visited by boat and trek.|Angel_Falls",
"Vatican City is the smallest country in the world|G|It covers about 0.44 km², smaller than many city parks.|It is an independent city-state inside Rome and the home of the Pope. It has its own post office, radio station and stamps.|Fewer than a thousand people live there.|Its official language for many purposes is Latin.|Vatican_City",
"Indonesia is made up of around 17,000 islands|G|It is the world’s largest island country, spread across the equator.|Only about 6,000 of the islands are inhabited. The country has several hundred languages and lies on the Ring of Fire, with many active volcanoes.|The capital is moving from Jakarta to Nusantara on Borneo.|Komodo dragons live on some of its islands.|Indonesia",
"Bolivia has two capitals|G|Sucre is the constitutional capital, while La Paz is the seat of government.|La Paz sits at around 3,600 m and is one of the world’s highest capital cities. Sucre houses the judiciary.|Bolivia is landlocked.|Lake Titicaca lies on its border with Peru.|Bolivia",
"Your heart beats about 100,000 times a day|C|At rest, an adult heart beats roughly 60 to 100 times a minute and never takes a break.|Over a lifetime that adds up to billions of beats. The heart pumps blood round two circuits: one to the lungs and one to the rest of the body.|The heart is roughly the size of a fist.|It begins beating a few weeks after conception.|Heart",
"Spider silk is tougher than steel, weight for weight|C|Some spider silks combine great strength with stretchiness.|On a weight-for-weight basis, dragline silk can rival steel in strength, and it can stretch far more. Scientists are trying to make synthetic versions for medicine and materials.|Spiders can make several kinds of silk.|Silk is made of proteins.|Spider_silk",
"Much of Earth’s gold was forged in colliding neutron stars|S|In 2017 astronomers saw such a collision and detected signs of heavy elements being made.|The event, GW170817, was seen in gravitational waves and light. Its glow matched what models predicted for heavy elements such as gold and platinum being created. Supernovae may add to the supply, and the balance is still debated.|It was the first neutron star merger seen with gravitational waves.|The explosion is called a kilonova.|GW170817",
"Your skin is your largest organ|C|An adult’s skin covers roughly two square metres and weighs several kilograms.|Skin protects against infection, regulates temperature and senses touch. Its outer layer is replaced continually as old cells flake away.|Skin has three main layers.|Thickness varies, thinnest on the eyelids.|Skin",
"Elephants can recognise themselves in a mirror|A|Only a few species have passed the mirror test, and elephants are among them.|In a 2006 study, an Asian elephant touched a mark on her head that she could see only in a mirror. This suggests a sense of self.|Great apes, dolphins and magpies have also passed versions of the test.|Elephants have large brains and live in complex family groups.|Mirror_test",
"Penguins can propose with a pebble|A|In some species, males offer stones to a potential mate.|Pebbles are valuable as nest-building material in rocky places, and a good stone can help win a partner. Some penguins even steal stones from neighbours.|Emperor penguins don’t build nests.|Penguins live almost entirely in the Southern Hemisphere.|Penguin",
"Hummingbirds can fly backwards|A|They are the only birds that can hover for long periods and also fly in reverse.|Their wings rotate in a figure-of-eight pattern, producing lift on both the forward and back strokes. Many species beat their wings dozens of times each second.|Hummingbirds are found only in the Americas.|They eat nectar, which they find by sight.|Hummingbird",
"Cheetahs are the fastest land animals|A|Over short sprints they can exceed 100 km/h.|They accelerate quickly, and can only keep up their top speed for a few hundred metres. Their long tails help them turn sharply, and their claws grip the ground like running spikes.|Cheetahs can’t roar.|Their claws only partly retract, which helps grip the ground.|Cheetah",
"Coral reefs cover under 1% of the ocean floor but host about a quarter of marine species|O|They are among the most biodiverse habitats on Earth.|Reefs are built by tiny animals called polyps that make limestone skeletons. Many fish and invertebrates depend on them for food and shelter.|Warming seas cause coral bleaching.|Corals have algae living in their tissue.|Coral_reef",
"Most deep-sea animals make their own light|O|Bioluminescence is common in the dark ocean, where it’s used to hunt, hide and signal.|Light is made by a chemical reaction. Anglerfish dangle glowing lures, while other animals flash to confuse predators or glow to match faint light from above and hide their shadow.|Some microbes make light in the sea’s surface, making waves glow.|Fireflies are bioluminescent too.|Bioluminescence",
"The ocean is salty because of rocks|O|Rivers wash minerals from rock into the sea, and the water leaves behind its salt as it evaporates.|The average salinity of seawater is about 3.5%, mostly sodium and chloride. Undersea vents also add and remove minerals.|The Dead Sea is far saltier.|Salinity varies from place to place.|Seawater",
"One jellyfish can reverse its life cycle|A|Turritopsis dohrnii can return to its juvenile polyp stage when stressed.|This is sometimes called “biological immortality”, but the animals can still die from predators or disease. Scientists study the process to learn about ageing.|It is only a few millimetres across.|It lives in oceans worldwide.|Turritopsis_dohrnii",
"One fungus in Oregon covers about 10 square kilometres|N|A honey fungus in the Malheur National Forest is among the largest living organisms known.|Armillaria ostoyae spreads through the soil by underground threads. Most of the organism is hidden, and only mushrooms appear above ground.|Its age is estimated at around 2,000 to 8,000 years.|It kills the trees it grows on.|Armillaria_ostoyae",
"A grove of aspens in Utah is a single organism|N|Pando is a clonal colony of about 47,000 trembling aspen trunks sharing one root system.|The stems are genetically identical. It covers about 43 hectares and may be among the heaviest known organisms. It is now declining in places because of grazing.|It’s sometimes called the Trembling Giant.|Its true age is debated.|Pando_(tree)",
"Earth’s magnetic field has flipped many times|C|The poles have reversed repeatedly over geological time, most recently about 780,000 years ago.|The field comes from molten iron moving in the outer core. Reversals leave records in rocks. They take thousands of years and are not sudden.|We can’t predict the next one.|The field protects life from solar radiation.|Geomagnetic_reversal",
"Nothing with mass can reach the speed of light|C|Light travels at about 299,792 km per second, and reaching it would take infinite energy for anything with mass.|Einstein’s special relativity shows that as an object speeds up, its energy grows without limit as it nears light speed. Light itself, having no mass, always travels at this speed in a vacuum.|Light from the Sun takes about 8 minutes to reach us.|The speed of light is used to define the metre.|Speed_of_light",
"The human brain has about 86 billion neurons|C|That estimate comes from a method that dissolved brains and counted the cell nuclei.|Each neuron can link to thousands of others, forming a network with trillions of connections. The brain uses about a fifth of the body’s energy.|Earlier textbooks said 100 billion.|Neurons communicate through electrical and chemical signals.|Human_brain",
"GPS satellites must correct for relativity|C|Their clocks run slightly differently from clocks on the ground, and the system accounts for it.|Gravity makes clocks tick faster at altitude, while the satellites’ speed makes them tick slower. The net effect is a gain of about 38 microseconds a day, which would cause large position errors if ignored.|GPS needs signals from at least four satellites.|The system was developed by the US military.|Global_Positioning_System",
"Butterflies taste with their feet|A|Sensors on their legs let them test plants before laying eggs.|When a butterfly lands on a leaf, taste receptors on its feet tell it whether the plant suits its caterpillars. Many insects also have taste organs on their feet.|Butterflies drink through a long tongue called a proboscis.|Their wings are covered in tiny scales.|Butterfly",
"Krakatoa’s 1883 eruption was heard thousands of kilometres away|G|The explosion was heard in places about 4,800 km from the volcano.|The eruption in Indonesia generated tsunamis that killed tens of thousands of people and sent pressure waves around the globe several times. Ash lowered global temperatures slightly for years.|It was one of the first disasters reported worldwide by telegraph.|Sunsets turned vivid red around the world for months.|1883_eruption_of_Krakatoa",
"Footprints on the Moon could last for millions of years|S|There is no wind or rain to wipe them away.|Moon dust is gradually disturbed by micrometeorites and sunlight, but this happens very slowly. Apollo boot prints and rover tracks remain visible in orbital images.|Twelve people have walked on the Moon.|The last Apollo landing was in 1972.|Moon",
"Venus is the brightest planet in our sky|S|Only the Sun and the Moon outshine it, thanks to its reflective clouds.|Venus’s thick clouds reflect about 70% of the sunlight that hits them, and it comes relatively close to Earth. It shines near the horizon around sunrise or sunset, which is why it is often called the morning or evening star.|It is not a star at all.|It can sometimes be seen in daylight.|Venus",
"Saturn’s rings are extraordinarily thin|S|They span hundreds of thousands of kilometres but are often only about 10 metres thick.|The rings are made of countless pieces of mostly water ice, from dust grains to boulders. Cassini showed how they ripple, clump and interact with small moons.|Some scientists think the rings are relatively young.|They are slowly losing material to the planet.|Rings_of_Saturn",
"Sunsets on Mars look blue|S|Martian dust scatters light differently, so the sky near the setting Sun glows blue.|By day, the Martian sky is a butterscotch colour because of suspended dust. Near sunset, the Sun’s glare takes on a blue tint, as seen in images from NASA’s rovers.|Mars’s thin atmosphere is mostly carbon dioxide.|The rust-red colour comes from iron oxide.|Mars",
"Astronauts grow taller in space|S|Without gravity compressing the spine, astronauts can gain a few centimetres in height.|The discs between the vertebrae expand in microgravity. The extra height disappears after returning to Earth, and the stretching can cause back pain.|Space also weakens bones and muscles.|Astronauts exercise for around two hours a day.|Effect_of_spaceflight_on_the_human_body",
"TRAPPIST-1 has seven Earth-sized planets|S|This small red star about 40 light-years away hosts one of the most compact planetary systems found.|All seven planets orbit closer to their star than Mercury does to the Sun. Several lie in the zone where liquid water could exist, though whether they have atmospheres is still being studied with the James Webb Space Telescope.|The star is much smaller and cooler than the Sun.|It was announced in 2017.|TRAPPIST-1",
"Pluto has a giant heart-shaped glacier|S|A huge plain of nitrogen ice, Sputnik Planitia, forms the left lobe of Pluto’s “heart”.|NASA’s New Horizons spacecraft flew past in 2015 and found the plain is about 1,000 km wide, with ice that moves slowly like a glacier. It has few craters, so it is geologically young.|New Horizons took about nine years to reach Pluto.|Pluto’s largest moon is Charon.|Sputnik_Planitia",
"The Moon has quakes|S|Seismometers left by Apollo astronauts recorded thousands of moonquakes.|Some were shallow quakes that rumbled for many minutes. The Moon’s dry, rigid rock transmits vibrations for much longer than Earth’s.|Causes include Earth’s gravity, temperature changes and meteorite impacts.|New seismometers have since been sent to the Moon.|Moonquake",
"Elephants communicate with sounds we can’t hear|A|Low rumbles called infrasound can carry for kilometres.|Elephants produce very low-frequency calls and may also pick up vibrations through the ground with their feet. This helps herds stay in touch across long distances.|Elephant herds are led by older females.|They have excellent long-term memories.|Elephant_communication",
"Hippos produce their own sunscreen|A|Their skin secretes a reddish fluid that helps protect it from sunlight and germs.|The pigments in this fluid, called hipposudoric and norhipposudoric acid, absorb ultraviolet light. It is often called “blood sweat”, but it is neither blood nor sweat.|Hippos spend the day in water to stay cool.|They are far more dangerous than they look.|Hippopotamus",
"Koalas have fingerprints almost like ours|A|Their prints are so similar to human ones that they could be mistaken for them under a microscope.|Koalas evolved fingerprints separately from primates, probably to help grip branches and feel texture. This is an example of convergent evolution.|Koalas eat mostly eucalyptus leaves.|They sleep up to about 20 hours a day.|Koala",
"Owls cannot move their eyes|A|Their tube-shaped eyes are fixed in the skull, so owls turn their whole heads instead.|They can rotate their necks up to about 270 degrees. Special blood-vessel adaptations stop the blood supply to the brain being cut off during these turns.|Owls have excellent hearing and can hunt in darkness.|Their feathers allow almost silent flight.|Owl",
"Sea stars have no brain|A|They have no centralised brain and no blood, but they still hunt and move.|A nerve ring and radial nerves coordinate their arms. Instead of blood, a water-vascular system pumps seawater through the body, powering their tube feet.|Many sea stars can regrow lost arms.|Some can digest prey outside their bodies.|Starfish",
"Giraffes have the same number of neck bones as people|A|Both have seven, but each giraffe vertebra can be over 25 cm long.|Almost all mammals have seven neck vertebrae, from mice to whales. The giraffe’s neck is long because each bone is stretched, not because it has extra ones.|A giraffe’s heart must pump blood a long way up to the brain.|Giraffes sleep very little.|Giraffe",
"Salmon find their way home by smell|A|After years at sea, they return to the stream where they were born to spawn.|Young salmon imprint on the chemical signature of their home stream. Adults then use a mix of magnetic cues and smell to find it.|Many species die soon after spawning.|Their journeys can span thousands of kilometres.|Salmon",
"The Arctic tern makes the longest migration of any animal|A|It flies from the Arctic to the Antarctic and back every year, around 70,000 km or more.|Tracking devices have revealed zigzag routes that follow winds, so the birds enjoy two summers each year. Terns can live for 30 years.|They weigh only about 100 grams.|They breed in the far north.|Arctic_tern",
"Ice floats because water expands as it freezes|C|Most liquids shrink when they freeze, but water gets about 9% bigger.|Water molecules form an open crystal lattice in ice, leaving gaps that make it less dense than liquid water. Lakes therefore freeze from the top down, leaving liquid water below for life to survive winter.|Water is densest at around 4 °C.|Frozen pipes can burst because of this expansion.|Properties_of_water",
"Sunflower seed spirals follow Fibonacci numbers|N|The seeds are packed in two sets of spirals, whose counts are often neighbouring Fibonacci numbers.|Counts like 34 and 55, or 55 and 89, are common. This pattern lets the plant pack in as many seeds as possible without gaps.|The sequence runs 1, 1, 2, 3, 5, 8, 13 and so on.|Pinecones and pineapples show similar spirals.|Phyllotaxis",
"Pencils do not contain lead|C|The “lead” is a mixture of graphite and clay.|Graphite was first mined in 16th-century England and was mistaken for a form of lead, which gave the name. Modern “lead” is a safe, non-toxic mineral.|The hardness depends on how much clay is mixed in.|Graphite and diamond are both pure carbon.|Pencil",
"Non-stick pans began with a lab accident|C|In 1938 Roy Plunkett found a waxy white solid in a cylinder that should have held gas.|The material was PTFE, later sold as Teflon. It is extremely slippery and resistant to heat and chemicals.|It was first used in industrial and military applications.|It has the lowest friction of many solids.|Polytetrafluoroethylene",
"The first X-ray picture showed a hand|C|Wilhelm Röntgen made it in 1895, using his wife’s hand.|He discovered the rays by accident while experimenting with a tube, and called them X-rays because their nature was unknown. He won the first Nobel Prize in Physics in 1901.|X-rays are a type of electromagnetic radiation.|They pass through soft tissue but are blocked by bone.|X-ray",
